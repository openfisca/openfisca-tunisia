description: Minimum d'impôt forfaitaire annuel pour les établissements implantés hors des zones communales (régime forfaitaire BIC, articles 44 bis à 44 sexies du code de l'IRPP et de l'IS)
documentation: |
  2011-2013 : minimums de 100 et 50 DT SANS critère de zone (par convention,
  ce paramètre porte la valeur basse sur cette période). La différenciation
  zone communale / hors zone date de la LF 2014 (art. 45) ; le minimum hors
  zone vaut la moitié du minimum en zone communale sur toute la période.
  Depuis 2016, le minimum est dû dès le premier dinar et s'ajoute au taux sur
  la fraction du chiffre d'affaires excédant franchise_chiffre_affaires.
unit: currency
reference:
