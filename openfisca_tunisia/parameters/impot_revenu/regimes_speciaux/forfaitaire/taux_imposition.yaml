description: Taux d'imposition forfaitaire sur le chiffre d'affaires — activités d'achat en vue de la revente et de production (régime forfaitaire BIC, articles 44 bis à 44 sexies du code de l'IRPP et de l'IS)
documentation: |
  Régime forfaitaire créé par la loi de finances pour 2011 (transfert et refonte
  de l'ancien forfait de l'article 44 § IV, en vigueur 1990-2010, tarifé par
  BARÈME PAR TRANCHES de chiffre d'affaires — non couvert par ce paramètre).

  - 2011-2015 : impôt = taux x chiffre d'affaires TOTAL (2 % achats en vue de
    revente et production, 2,5 % services — voir taux_imposition_services),
    avec plancher (minimum_zone_communale / minimum_hors_zone_communale).
  - Depuis 2016 (LF 2016, art. 17 ; note commune DGI n° 27/2016) : impôt =
    minimum (selon zone) + taux x la FRACTION du chiffre d'affaires excédant
    franchise_chiffre_affaires (10 000 DT), taux unifié à 3 % pour toutes les
    activités.

  L'ancienne valeur 0,10 « à titre d'exemple » ne correspondait à aucune
  période de l'historique.
unit: /1
