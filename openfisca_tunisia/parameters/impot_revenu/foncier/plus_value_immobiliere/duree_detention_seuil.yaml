description: "Durée de détention, comptée depuis la date de possession, qui sépare les deux taux de l'impôt sur la plus-value immobilière"
values:
  1998-08-17:
    value: 10
  2013-01-01:
    value: 5
metadata:
  unit: year
  short_label: "Durée de détention séparant les deux taux"
  note: "Série incomplète : états antérieurs à 1998 non versés."
  reference:
    1998-08-17:
    - title: "Loi n° 98-73 du 4 août 1998, portant simplification des procédures fiscales et réduction des taux de l'impôt, article premier"
      href: https://www.pist.tn/jort/1998/1998F/Jo06498.pdf
      note: "JORT n° 64 du 11 août 1998, p. 1736. Article premier, paragraphe III nouveau de l'article 44 du code : 10 % « lorsque la cession intervient au cours de la période de dix ans à compter de la date de possession », 5 % « lorsque la cession intervient après dix ans à compter de la date de possession ». Date d'effet : la loi n'en fixe pas ; elle est exécutoire cinq jours après le dépôt du Journal officiel au siège du gouvernorat de Tunis, jour du dépôt non compté (loi n° 93-64 du 5 juillet 1993, article 2). Dépôt du 12 août 1998, lu en dernière page du fascicule ; d'où le 17 août 1998. Édition française lue à l'image, p. 1736 ; l'édition arabe n'est pas relue."
    2013-01-01:
    - title: "Loi n° 2012-27 du 29 décembre 2012, portant loi de finances pour l'année 2013, articles 47 et 79"
      href: https://www.pist.tn/jort/2013/2013F/Jo0012013.pdf
      note: "JORT n° 1 du 1er janvier 2013, p. 13 (article 47) et p. 28 (article 79). Article 47, paragraphe 1 : « La durée de dix ans prévue par l'alinéa 1 du paragraphe III de l'article 44 du code de l'impôt sur le revenu des personnes physiques et de l'impôt sur les sociétés est réduite à cinq ans. » Date d'effet : article 79, à compter du 1er janvier 2013. Édition française lue à l'image, p. 13, et sur la couche texte, p. 28 ; l'édition arabe n'est pas relue."
documentation: |-
  Le texte de 1998 oppose une cession « au cours de la période » de dix ans à une cession
  « après » dix ans, comptés depuis la date de possession. La cession intervenue le jour
  anniversaire n'est pas tranchée par le texte.

  Avant 1998, le même nombre d'années avait un autre rôle : de 1990 à 1992, le code de l'impôt
  sur le revenu ne rangeait dans le champ de la plus-value que les biens « détenus depuis moins de
  10 ans », imposés au taux unique de 15 % ; la loi de finances pour 1993 supprime cette condition.
  Ces états ne sont pas versés.
