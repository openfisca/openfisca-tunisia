documentation: |
  Plafond annuel de déduction des primes d'assurance-vie et des contrats de capitalisation
  (article 39 § I-2 du code).

  VALEUR DE 1990 CORRIGÉE, ET SON ERREUR EXPLIQUÉE. Le texte d'origine dispose « Ces versements
  sont admis en déduction dans la limite de 200 dinars par an, majorés de : 100 dinars au titre
  du conjoint ; 50 dinars au titre de chacun des quatre premiers enfants à charge »
  (JORT n° 1 des 2-5 janvier 1990, page 8). Les valeurs 800, 400 et 200 précédemment portées à
  1990 n'étaient pas fausses en elles-mêmes : ce sont celles de l'article 52 de la loi de
  finances pour 1998, rattachées à la mauvaise date.

  DATES. Le rattachement du palier de 1997 est DÉRIVÉ de la règle de conversion, l'article 52
  n'énonçant pas de date d'effet propre — à la différence de l'article 62 de la même loi. Même
  raisonnement pour 2007 et 2013. Le palier de 100 000 dinars, lui, est attesté aux revenus 2020
  par la note commune n° 1/2021.

  La loi de finances 2014 supprime les majorations pour conjoint et enfants au profit d'un
  plafond unique ; la loi de finances 2021 soumet en outre cette déduction, pour la première
  fois, au minimum d'impôt de l'article 12 bis de la loi n° 89-114.
