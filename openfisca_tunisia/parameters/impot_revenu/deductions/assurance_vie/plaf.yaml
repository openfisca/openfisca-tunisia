documentation: |
  Plafond annuel de déduction des primes d'assurance-vie et des contrats de capitalisation
  (article 39 § I-2 du code).

  VALEUR DE 1990 CORRIGÉE : 200 dinars et non 800. Le texte d'origine dispose « Ces versements
  sont admis en déduction dans la limite de 200 dinars par an, majorés de : 100 dinars au titre
  du conjoint ; 50 dinars au titre de chacun des quatre premiers enfants à charge »
  (JORT n° 1 des 2-5 janvier 1990, page 8, lue à l'image). Les majorations sont dans les
  paramètres voisins `conj_plaf` et `enf_plaf`, corrigés dans les mêmes proportions.

  DATES CORRIGÉES. Le plafond de 10 000 dinars est rattaché aux revenus de 2013 et non de 2014 :
  l'article 24 de la loi de finances pour 2014 n'énonce pas de date d'effet propre, et
  l'administration rattache alors la mesure aux revenus de l'année précédant le millésime de la
  loi. Le plafond de 100 000 dinars est rattaché aux revenus de 2020 et non de 2021, cette fois
  sur attestation expresse de la note commune n° 1/2021.

  La loi de finances 2021 soumet en outre cette déduction, pour la première fois, au minimum
  d'impôt de l'article 12 bis de la loi n° 89-114.

  RESTE OUVERT : une valeur intermédiaire existe nécessairement entre 200 et 1 200 dinars,
  l'intitulé de l'article 23 de la loi de finances 2008 parlant de « relèvement ». Elle est
  vraisemblablement dans l'article 52 de la loi de finances pour 1998, non vérifié.
