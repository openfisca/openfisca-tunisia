documentation: |
  Plafond annuel de déduction des primes d'assurance-vie et des contrats de capitalisation
  (article 39 § I-2 du code).

  Valeur de 1990 corrigée, et son erreur expliquée. Le texte d'origine dispose « Ces versements
  sont admis en déduction dans la limite de 200 dinars par an, majorés de : 100 dinars au titre
  du conjoint ; 50 dinars au titre de chacun des quatre premiers enfants à charge »
  (JORT n° 1 des 2-5 janvier 1990, page 8). Les valeurs 800, 400 et 200 précédemment portées à
  1990 n'étaient pas fausses en elles-mêmes : ce sont celles de l'article 52 de la loi de
  finances pour 1998, rattachées à la mauvaise date.

  Dates. Le rattachement du palier de 1997 est dérivé de la règle de conversion, l'article 52
  n'énonçant pas de date d'effet propre — à la différence de l'article 62 de la même loi. Le
  palier de 2007 est attesté par la note commune n° 10/2008 (primes payées à partir du
  1er janvier 2007), celui de 10 000 dinars par la note commune n° 25/2012, celui de
  100 000 dinars par la note commune n° 1/2021 (revenus de 2020).

  Le plafond unique de 10 000 dinars vient de la loi de finances complémentaire pour 2012
  (article 42), qui supprime les majorations pour conjoint et enfants. Il était daté du
  1er janvier 2013 et rapporté à l'article 24 de la loi de finances pour 2014, qui le reprend
  sans le changer en fixant une durée minimale de contrat. La note commune n° 25/2012 l'applique
  aux déclarations dont le délai de dépôt intervient à partir du 25 mai 2012 : revenus de 2011
  pour les bénéfices non commerciaux, artisanaux et agricoles et pour les salaires et pensions ;
  pour les bénéfices industriels et commerciaux, dont la déclaration de 2011 était échue avant
  cette date, revenus de 2012. La série retient les revenus de 2011.

  La loi de finances 2021 soumet en outre cette déduction, pour la première fois, au minimum
  d'impôt de l'article 12 bis de la loi n° 89-114.
