documentation: |
  Valeur de 1990 corrigée : 50 dinars et non 200 (JORT n° 1 des 2-5 janvier 1990, p. 8).
  Les 200 dinars sont ceux de l'article 52 de la loi de finances pour 1998, mal datés.

  L'assiette de la majoration change en 1997. Le texte de 1990 la réserve aux quatre premiers
  enfants à charge ; l'article 52 de la loi de finances pour 1998 vise « chacun des enfants à
  charge au sens des paragraphes II et III de l'article 40 », sans limite de rang. Le modèle
  n'encode pas cette borne de rang : à vérifier avant tout calcul sur les revenus 1990 à 1996.

  La majoration est clôturée à zéro à compter des revenus 2011 : l'article 42 de la loi de
  finances complémentaire pour 2012 remplace le plafond majoré par un plafond unique de
  10 000 dinars, qu'aucune majoration ne vient plus accroître. La clôture était datée des
  revenus 2013, d'après l'article 24 de la loi de finances pour 2014, qui ne fait que reprendre
  ce plafond.
