documentation: |
  Plafond annuel de la déduction des intérêts de l'épargne (article 39 § II du code).

  En 1990, l'article ne connaît qu'un seul plafond, de 1 000 dinars, portant sur les seuls
  comptes spéciaux d'épargne ouverts auprès des banques.

  L'article 30 de la loi de finances pour 1992 institue la structure à DEUX NIVEAUX encore en
  vigueur : un plafond global, qui couvre aussi les intérêts des emprunts obligataires, et un
  sous-plafond propre aux comptes spéciaux d'épargne. Texte : « … dans la limite d'un montant
  annuel de mille cinq cent dinars (1500 d) sans que ce montant n'excède mille dinars pour les
  intérêts provenant des comptes spéciaux d'épargne … ».

  Les dates sont des ANNÉES DE REVENUS. Celles de 2016 et 2021 sont attestées par note commune.
  Celle de 1992 est retenue d'après la mention, dans le même article, des « emprunts obligataires
  émis à partir du 1er janvier 1992 » ; l'article ne portant pas de clause d'effet explicite, un
  rattachement aux revenus de 1991 ne peut être exclu.
