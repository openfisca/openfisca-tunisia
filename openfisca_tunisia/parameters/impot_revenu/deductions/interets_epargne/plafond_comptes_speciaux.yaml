documentation: |
  Fraction du plafond global qui peut provenir des intérêts des comptes spéciaux d'épargne
  ouverts auprès des banques et de la Caisse d'épargne nationale de Tunisie.

  De 1990 à 1991, ce sous-plafond se confond avec le plafond global : l'article 39 § II ne vise
  alors que les comptes spéciaux d'épargne. La distinction n'apparaît qu'avec l'article 30 de la
  loi de finances pour 1992, qui étend la déduction aux emprunts obligataires.

  Les paramètres voisins `interets_comptes_speciaux_epargne_bancaires` et
  `interets_comptes_speciaux_epargne_cent` décrivent le même dispositif dans une découpe par
  établissement, qui ne correspond pas à celle du texte et reste figée à sa valeur de 1990.
