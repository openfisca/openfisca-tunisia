documentation: |
  ATTENTION AU NOM. Ce paramètre ne porte pas le plafond propre aux emprunts obligataires :
  il porte le PLAFOND GLOBAL de la déduction des intérêts de l'épargne de l'article 39 § II,
  qui couvre à la fois les comptes spéciaux d'épargne et les emprunts obligataires. C'est
  ainsi que la variable `deduction_interets` l'utilise. Le nom est conservé pour ne pas
  casser les usages ; un renommage est proposé par ailleurs.

  Le sous-plafond propre aux comptes spéciaux d'épargne est dans
  `interets_comptes_speciaux_epargne_bancaires/plaf.yaml`.

  VALEUR DE 1990 CORRIGÉE : 1 000 dinars et non 1 500. Le code de 1990 ne connaît qu'un
  plafond unique de 1 000 dinars, portant sur les seuls comptes spéciaux d'épargne ouverts
  auprès des banques. Les 1 500 dinars sont ceux de l'article 30 de la loi de finances pour
  1992, qui institue la structure à deux niveaux en étendant la déduction aux emprunts
  obligataires : « … dans la limite d'un montant annuel de mille cinq cent dinars (1500 d)
  sans que ce montant n'excède mille dinars pour les intérêts provenant des comptes spéciaux
  d'épargne … ». La série s'arrêtait là ; les deux relèvements de 2016 et 2021 manquaient.

  Le rattachement de 1992 est retenu d'après la mention, dans le même article, des « emprunts
  obligataires émis à partir du 1er janvier 1992 » ; l'article ne portant pas de clause d'effet
  explicite, un rattachement aux revenus de 1991 ne peut être exclu.
