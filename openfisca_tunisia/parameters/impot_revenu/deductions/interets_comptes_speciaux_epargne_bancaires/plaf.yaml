documentation: |
  Fraction du plafond global de l'article 39 § II qui peut provenir des intérêts des comptes
  spéciaux d'épargne. Le plafond global est dans
  `interets_emprunts_obligataires/plaf.yaml`, dont le nom prête à confusion.

  De 1990 à 1991, ce sous-plafond se confond avec le plafond global : l'article 39 § II ne
  vise alors que les comptes spéciaux d'épargne. La distinction n'apparaît qu'avec l'article 30
  de la loi de finances pour 1992.

  Les deux relèvements de 2016 et 2021 manquaient ; la valeur était figée à 1 000 dinars depuis
  l'origine.

  La variable `deduction_interets` applique ce sous-plafond à la somme des comptes ouverts
  auprès des banques ET de la Caisse d'épargne nationale, ce qui est conforme au texte de 1992.
  Le paramètre voisin `interets_comptes_speciaux_epargne_cent` n'est consommé par aucune
  formule et fait double emploi.
