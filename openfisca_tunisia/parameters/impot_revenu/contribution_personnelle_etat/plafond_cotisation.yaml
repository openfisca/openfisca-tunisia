    1983-01-01:
      title: Article 9 de la loi n° 82-91 du 31 décembre 1982 portant loi de finances pour la gestion 1983 (article 8 nouveau du décret du 31 mars 1932), JORT n° 84 du 31 décembre 1982, pp. 2877-2878
      href: https://www.pist.tn/jort/1982/1982F/Jo08482.pdf
      note: "Lu à l'image. L'article 9 abroge et remplace « les dispositions de l'article 8 du décret du 31 mars 1932 tel que modifié par l'article 8 de la loi de finances pour la gestion 1980 ». L'article 8 nouveau comprend un paragraphe 1 (tarif, exonération des revenus qui ne dépassent pas le SMIG, impôt limité à l'excédent sur le SMIG) et un paragraphe 2 (un décret fixera un barème par tranches de 20 dinars à partir de 900 dinars) ; il ne comporte aucune clause de plafonnement de la cotisation effective. Le tarif conduit à un taux global de 60,76 % à 90 000 dinars et de 62,29 % à 100 000 dinars. « Toutes les dispositions du présent article sont applicables pour les revenus à réaliser à partir du 1er janvier 1983. » Le décret n° 84-1265 du 16 octobre 1984 (JORT n° 64 du 2 novembre 1984, pp. 2472-2477), pris pour ce barème par tranches de 20 dinars, ne comporte que son barème (article premier) et l'article d'exécution (article 2), lus à l'image : il ne rétablit pas de plafond."
    1986-01-01:
      title: Article 8 de la loi n° 85-109 du 31 décembre 1985 portant loi de finances pour la gestion 1986 (article 8 nouveau du décret du 31 mars 1932, paragraphe 2), JORT n° 91 du 31 décembre 1985, p. 1731
      href: https://www.pist.tn/jort/1985/1985F/Jo09185.pdf
      note: "Lu à l'image. L'article 8 abroge et remplace « les dispositions de l'article 8 du décret du 31 mars 1932 relatif à la contribution personnelle d'Etat, tel que modifié par l'article 9 de la loi n° 82-91 du 31 décembre 1982 ». Paragraphe 2 : « La cotisation effective de la contribution personnelle d'Etat calculée conformément aux dispositions du paragraphe III ci-après ne peut excéder 60 % du revenu global imposable. » La loi ne porte pas de clause d'application aux revenus : publiée au Journal officiel du mardi 31 décembre 1985, elle devient exécutoire un jour franc après, le 2 janvier 1986 (article 3 nouveau du décret du 27 janvier 1883, rédaction du décret du 13 septembre 1956). Les dates de ce paramètre étant des années de revenus, le plafond est porté aux revenus de 1986, les premiers réalisés sous la loi exécutoire ; le tarif du même article est daté de même dans le barème."
documentation: |
  « La cotisation effective de la contribution personnelle d'État calculée conformément aux
  dispositions du paragraphe III ci-après, à l'exclusion de toute majoration, ne peut excéder
  X % du revenu global imposable. »

  Ce plafonnement n'a pas d'équivalent dans le barème de l'IRPP institué en 1990. Il tempère
  fortement les taux marginaux nominaux, très élevés dans les premières rédactions du tarif
  (88 % au-delà de 9 800 D pour les revenus de 1965, sous un plafond de 45 %).

  Il explique aussi que la dernière ligne du barème publié au JORT de 1979 porte « 55,00 % »
  dans la colonne des taux d'imposition à la limite supérieure : c'est le plafond, et non un
  taux calculé.

  Le plafond disparaît pour les revenus de 1983 à 1985 : l'article 9 de la loi n° 82-91
  réécrit l'article 8 sans le reprendre, et le tarif de 1983 dépasse 60 % de taux global au-delà
  de 80 000 dinars. La valeur nulle au 1er janvier 1983 dit cette absence de plafond, et non
  un plafond nul. L'article 8 de la loi n° 85-109 le rétablit à 60 % à compter des revenus de
  1986.
