documentation: |
  Tarif de l'article 8 du décret du 31 mars 1932 instituant la contribution personnelle
  d'État, dans ses rédactions successives. Chaque texte cité en référence abroge et
  remplace cet article 8.

  DATES = ANNÉES DE REVENUS. Attention, la convention des textes eux-mêmes change en
  cours de période et il a fallu la convertir :
    - loi n° 62-73 : « taxés au titre de l'année 1963 (revenus de l'année 1962) et des
      années postérieures » -> revenus 1962 ;
    - loi n° 65-46 : « au titre de l'année 1966 (revenus de l'année 1965) » -> revenus 1965 ;
    - à partir de la loi de finances 1980, les textes datent directement en revenus
      (« applicables pour les revenus à réaliser à partir du 1er janvier … »).

  La contribution personnelle d'État est SUPPRIMÉE pour les revenus réalisés à compter
  du 1er janvier 1990 par l'article 2 de la loi n° 89-114, qui lui substitue l'IRPP.
  Ce tarif ne doit jamais être lu après 1989 : ce n'est pas un état antérieur du barème
  de l'IRPP, c'est un autre impôt, avec une autre assiette et un plafonnement propre.

  Les millésimes 1962 et 1965 ne sont PAS des relevés exhaustifs de la période : les
  lois de finances de 1967 à 1979 n'ont pas toutes été dépouillées. Une valeur lue pour
  une année intermédiaire est donc le dernier tarif connu, pas un tarif attesté.

  Aucune variable du modèle ne consomme ces paramètres : openfisca-tunisia ne calcule
  pas l'avant-1990. Ils servent de référence datée et sourcée, notamment aux tableaux
  du précis socio-fiscal.
