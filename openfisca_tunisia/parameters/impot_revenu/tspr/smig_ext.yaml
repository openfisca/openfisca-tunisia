description: Extension de l'abattement précédent aux bas salaires
values:
  2011-01-01:
    value: 0
metadata:
  unit: /1
documentation: |
  PARAMÈTRE SANS SOURCE ET SANS EFFET, CONSERVÉ EN L'ÉTAT (issue #390).

  Il est censé étendre aux salaires légèrement supérieurs au salaire minimum la déduction
  supplémentaire de `abattement_pour_salaire_minimum`. Deux faits le privent de portée :

  1. IL VAUT ZÉRO sur toute sa durée : aucun revenu positif ne peut lui être inférieur, de
  sorte que l'extension qu'il est censé porter reste sans objet. 2. IL N'EXISTE QU'À PARTIR
  DU 1er JANVIER 2011, et n'a aucune référence.

  L'issue #390 se demandait si l'absence de ce seuil avant 2011 était une lacune ou une
  règle étendue en 2011. La question ne peut pas être tranchée sans le texte qui institue le
  seuil, que le dépouillement n'a pas trouvé. Antidater une valeur reviendrait à inventer
  une source. Le dispositif lui-même — l'ancien paragraphe V de l'article 40 — est de toute
  façon abrogé à compter des revenus 2014.

