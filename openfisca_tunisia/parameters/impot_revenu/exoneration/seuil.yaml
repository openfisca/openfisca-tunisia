description: Seuil de revenu net imposable pour l'exonération catégorielle des salariés et pensionnés
values:
  2014-01-01:
    value: 5000
  2017-01-01:
    value: null
metadata:
  unit: currency
  reference:
    2014-01-01:
      title: Article 73-1 de la loi n° 2013-54 du 30 décembre 2013 portant loi de finances pour l'année 2014, JORT n° 105 du 31 décembre 2013, p. 3691
  official_journal_date:
    2014-01-01: "2013-12-31"
documentation: |
  Exonération catégorielle des salariés et pensionnés dont le revenu net imposable
  n'excède pas 5 000 dinars, instituée par l'article 73-1 de la loi de finances pour 2014.

  Ce paramètre est clôturé aux revenus de 2017, date de son abrogation par l'article 14-5 de
  la loi n° 2016-78 (loi de finances pour 2017), qui lui substitue la tranche à 0 % du
  barème jusqu'à 5 000 dinars.

  Les deux seuils — celui de l'exonération abrogée et celui de la première tranche imposée
  du barème — valent l'un et l'autre 5 000 dinars, ce qui est une coïncidence et non une
  identité de règle. L'issue #387 en tire les conséquences.
