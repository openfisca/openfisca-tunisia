description: "Montant annuel de revenus distribués en deçà duquel la retenue est déductible de l'impôt sur le revenu ou restituable"
values:
  2015-01-01:
    value: 10000
metadata:
  unit: currency
  short_label: "Revenus distribués : plafond de la restitution"
  reference:
    2015-01-01:
    - title: "Loi n° 2013-54 du 30 décembre 2013, portant loi de finances pour l'année 2014, article 19"
      href: https://www.pist.tn/jort/2013/2013F/Jo1052013.pdf
      note: "JORT n° 105 du 31 décembre 2013, p. 3671. Rubrique « Réduction du taux de l'impôt sur les sociétés et imposition des bénéfices distribués ». Article 19, paragraphe 6 : « Est ajouté au paragraphe 1 du paragraphe II de l'article 52 du code de l'impôt sur le revenu des personnes physiques et de l'impôt sur les sociétés ce qui suit : Est également déductible de l'impôt sur le revenu annuel exigible, ou est restituable, la retenue à la source effectuée au titre des revenus distribués conformément aux dispositions du présent article, et ce, pour les personnes physiques dont les revenus distribués ne dépassent pas 10.000 dinars par an. » Date d'effet : celle de la retenue qu'il tempère, les distributions réalisées à compter du 1er janvier 2015 (article 19, paragraphe 3 ; note commune n° 3/2015, numéro du recueil de l'administration). Édition française lue sur la couche texte."
documentation: |-
  Une personne physique dont les revenus distribués de l'année ne dépassent pas ce montant peut
  déduire de son impôt sur le revenu annuel la retenue opérée sur ces revenus
  (`taux_retenue_source`), ou en obtenir la restitution. La note commune n° 3/2015 juxtapose
  cette faculté et le caractère libératoire de la retenue sans en décrire les modalités. La
  disposition figure, au même montant, à l'article 52, paragraphe II, alinéa 1, de l'édition
  consolidée du code de 2025.
