description: "Taux de la retenue à la source sur le prix de cession de titres par les personnes physiques non résidentes"
values:
  2011-01-01:
    value: 0.025
  2012-01-01:
    value: null
metadata:
  unit: /1
  short_label: "Retenue sur le prix de cession, personnes physiques non résidentes"
  reference:
    2011-01-01:
    - title: "Loi n° 2010-58 du 17 décembre 2010, portant loi de finances pour l'année 2011, article 41"
      href: https://www.pist.tn/jort/2010/2010F/Jo1022010.pdf
      note: "JORT n° 102 du 21 décembre 2010, pp. 3475-3476. Article 41, paragraphe 12, ajout à l'alinéa e du paragraphe I de l'article 52 du code : « Ce taux est fixé à 2,5 % du prix de cession des actions ou des parts sociales ou des parts des fonds prévues par le deuxième paragraphe de l'article 3 du présent code. » Paragraphe 13 : option pour l'impôt sur le revenu sur la plus-value réelle, la retenue étant alors déductible. Paragraphe 5 : opérations de cession intervenant à partir du 1er janvier 2011. Édition française lue sur la couche texte."
    2012-01-01:
    - title: "Loi n° 2011-7 du 31 décembre 2011, portant loi de finances pour l'année 2012, articles 15 et 49"
      href: https://www.pist.tn/jort/2012/2012F/Jo0012012.pdf
      note: "JORT n° 1 du 3 janvier 2012, p. 5 (article 15) et p. 11 (article 49). Article 15, paragraphe 1 : la phrase « Ce taux est fixé à 2,5% du prix de cession ou de rétrocession des titres ou des droits y relatifs, prévus par le deuxième paragraphe de l'article 3 du présent code » est abrogée de l'alinéa e du paragraphe I de l'article 52. La retenue porte désormais sur la plus-value (`taux_personnes_physiques`). Date d'effet : article 49, à compter du 1er janvier 2012. Édition française lue sur la couche texte."
documentation: |-
  Taux de la retenue sur le prix de cession d'actions, de parts sociales et de parts de fonds
  par une personne physique non résidente, en 2011 (article 52, paragraphe I, alinéa e, du
  code). À partir de 2012, la retenue porte sur la plus-value.
