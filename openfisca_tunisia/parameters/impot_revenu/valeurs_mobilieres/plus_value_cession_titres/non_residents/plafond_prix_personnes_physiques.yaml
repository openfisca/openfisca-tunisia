description: "Plafond de la retenue à la source sur la plus-value des personnes physiques non résidentes, en pourcentage du prix de cession"
values:
  2012-05-25:
    value: 0.025
metadata:
  unit: /1
  short_label: "Plafond de la retenue, en part du prix, personnes physiques non résidentes"
  reference:
    2012-05-25:
    - title: "Loi n° 2012-1 du 16 mai 2012, portant loi de finances complémentaire pour l'année 2012, article 12"
      href: https://www.pist.tn/jort/2012/2012F/Jo0392012.pdf
      note: "JORT n° 39 du 18 mai 2012, p. 923. Article 12, paragraphe 2 : « Est ajouté au deuxième alinéa du sous paragraphe « e bis » du paragraphe I de l'article 52 du code […] ce qui suit : sans que le montant exigible ne dépasse une limite déterminée sur la base du taux de 2.5% du prix de cession ou de rétrocession desdits titres ou desdits droits prévus par le même paragraphe. » Date d'effet : la loi n'en fixe pas. Le fascicule porte la mention « déposé au siège du gouvernorat de Tunis le 19 mai 2012 » ; les notes communes n° 14/2012, 16/2012 et 25/2012 fixent l'entrée en vigueur de la loi au 25 mai 2012, en application de la loi n° 93-64 (article 2). Édition française lue sur la couche texte."
documentation: |-
  Plafond du montant de la retenue sur la plus-value réalisée par une personne physique non
  résidente (article 52, paragraphe I, alinéa e bis, deuxième alinéa, du code), exprimé en
  pourcentage du prix de cession ou de rétrocession des titres.
