description: "Plus-value de cession d'actions cotées à la Bourse des valeurs mobilières de Tunis"
metadata:
  short_label: "Actions cotées"
  order:
  - taux_detention_longue
  - taux_detention_courte
  - annees_detention
documentation: |-
  Régime de la plus-value de cession, par une personne physique résidente, d'actions cotées à la
  Bourse des valeurs mobilières de Tunis (code de l'impôt sur le revenu des personnes physiques
  et de l'impôt sur les sociétés, article 38, point 17, et article 44, paragraphe III, alinéa 3).

  - Du 1er janvier 2004 au 31 décembre 2010, la plus-value de cession d'actions cotées est
    exonérée, quelle que soit la durée de détention : les deux taux valent zéro.
  - À partir du 1er janvier 2011, l'exonération est réservée aux actions acquises ou souscrites
    avant cette date et aux cessions dans le cadre d'une introduction en bourse. Les actions
    acquises ou souscrites à partir du 1er janvier 2011 sont exonérées si elles sont cédées
    après l'expiration de l'année qui suit celle de leur acquisition (`annees_detention`,
    `taux_detention_longue`), et imposées sinon (`taux_detention_courte`).
  - À partir du 1er janvier 2023, la loi de finances fixe expressément le taux des actions
    cotées cédées avant cette échéance ; l'exonération au-delà demeure.

  Le décret-loi n° 2011-100 du 21 octobre 2011 (article 9, JORT n° 81 du 25 octobre 2011,
  pp. 2305-2306) récrit le point 17 de l'article 38 en reprenant à l'identique ces deux règles
  pour les actions cotées ; la série n'en porte pas d'entrée. La franchise annuelle de
  10 000 dinars (`franchise`, de 2004 à 2022) s'applique à la plus-value imposable.
