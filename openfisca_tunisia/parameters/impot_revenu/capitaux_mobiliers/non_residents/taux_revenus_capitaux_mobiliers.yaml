description: "Taux de la retenue à la source libératoire sur les revenus de capitaux mobiliers servis aux non-résidents"
values:
  1990-01-01:
    value: 0.15
  1992-01-02:
    value: 0.15
  1997-01-01:
    value: 0.20
metadata:
  unit: /1
  short_label: "Retenue libératoire, revenus de capitaux mobiliers des non-résidents"
  notes:
    1990-01-01:
    - note: "Série incomplète : états antérieurs à 1990 non versés."
  reference:
    1990-01-01:
    - title: "Code de l'impôt sur le revenu des personnes physiques et de l'impôt sur les sociétés, annexé à la loi n° 89-114 du 30 décembre 1989, article 52"
      href: https://www.pist.tn/jort/1990/1990F/Jo00190.pdf
      note: "JORT n° 1 des 2-5 janvier 1990, p. 11. Article 52, paragraphe I : retenue « c. 15% pour : - les revenus des capitaux mobiliers ; […] » ; paragraphe II : « La retenue d'impôt est libératoire de l'impôt sur le revenu pour les bons de caisse aux porteurs ainsi que pour les revenus servis aux personnes non résidentes ou non établies en Tunisie. » Date d'effet : le code s'applique aux revenus réalisés à partir du 1er janvier 1990 (loi n° 89-114, article 3). Édition française lue sur l'océrisation du fascicule, chiffres relus à l'image, p. 11."
    1992-01-02:
    - title: "Loi n° 91-98 du 31 décembre 1991, portant loi de finances pour la gestion 1992, article 31"
      href: https://www.pist.tn/jort/1991/1991F/Jo09091.pdf
      note: "JORT n° 90 du 31 décembre 1991, pp. 2084-2085. Article 31, paragraphe I nouveau de l'article 52 du code : « b) 15% au titre : […] - Des revenus des obligations et autres capitaux mobiliers ; […] » ; paragraphe II nouveau : « 1) La retenue à la source est libératoire de l'impôt sur le revenu ou de l'impôt sur les sociétés pour : […] - Les revenus servis aux personnes non résidentes ou non établies en Tunisie. » Le taux ne change pas ; l'entrée porte le texte qui le fonde depuis cette date. Date d'effet : la loi n'en fixe pas ; elle est exécutoire un jour franc après sa publication au Journal officiel du 31 décembre 1991, soit le 2 janvier 1992. Édition française lue à l'image, pp. 2084-2085."
    1997-01-01:
    - title: "Loi n° 96-113 du 30 décembre 1996, portant loi de finances pour la gestion 1997, articles 30, 31, 32 et 54"
      href: https://www.pist.tn/jort/1996/1996F/Jo10596.pdf
      note: "JORT n° 105 du 31 décembre 1996, p. 2581 (articles 30 à 32) et p. 2583 (article 54). Article 31 : « L'alinéa \"c\" du paragraphe I de l'article 52 […] est modifié comme suit : c - 20% au titre des revenus de capitaux mobiliers. » Article 32 : seul le premier tiret de l'alinéa 1 du paragraphe II de l'article 52 (titres au porteur anonymes) est supprimé ; le caractère libératoire demeure pour les revenus servis aux non-résidents. Date d'effet : article 54, à compter du 1er janvier 1997. Édition française lue sur la couche texte."
documentation: |-
  Taux de la retenue libératoire sur les intérêts des dépôts, des obligations, des bons du
  Trésor et des autres revenus de capitaux mobiliers servis à un bénéficiaire non résident ni
  établi en Tunisie. Le taux est celui des résidents ; seul le caractère de la retenue diffère.

  Le caractère libératoire est maintenu par les textes suivants sans changement de taux : la loi
  de finances pour 2005 (article 69, paragraphe 5, JORT n° 105 du 31 décembre 2004, p. 3443)
  écrit que la retenue est libératoire « au titre des sommes prévues par les alinéas b et c du
  paragraphe I du présent article et servies aux non résidents et non établis en Tunisie ». En
  2021, la retenue de 20 % est définitive pour tous les bénéficiaires (`retenue_source/
  taux_liberatoire`).

  Avant 1990, les revenus de capitaux mobiliers relevaient des impôts cédulaires (loi de finances
  pour 1988, article 29 : 20 %), dont le sort pour les non-résidents n'est pas relevé ici.
