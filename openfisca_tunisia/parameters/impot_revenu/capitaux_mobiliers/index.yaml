description: "Revenus de capitaux mobiliers"
metadata:
  short_label: "Revenus de capitaux mobiliers"
  order:
  - retenue_source
  - non_residents
documentation: |-
  Revenus de capitaux mobiliers au sens de l'article 34 du code de l'impôt sur le revenu des
  personnes physiques et de l'impôt sur les sociétés : intérêts des créances, dépôts,
  cautionnements et comptes courants, des obligations et des effets publics, dont les bons du
  Trésor. Ils entrent dans le revenu global et subissent le barème, sauf quand la retenue opérée
  par le payeur est libératoire.

  Les intérêts exonérés (épargne logement, dépôts et titres en devises ou en dinars convertibles,
  article 38) et la déduction des intérêts des comptes spéciaux d'épargne et des emprunts
  obligataires (article 39, paragraphe II) ne relèvent pas de ce nœud.
