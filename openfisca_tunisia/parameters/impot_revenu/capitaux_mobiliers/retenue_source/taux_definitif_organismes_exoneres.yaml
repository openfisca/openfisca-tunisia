metadata:
  unit: /1
  short_label: "Retenue définitive, organismes exonérés et fonds"
  reference:
    1992-01-02:
    - title: "Loi n° 91-98 du 31 décembre 1991, portant loi de finances pour la gestion 1992, article 31"
      href: https://www.pist.tn/jort/1991/1991F/Jo09091.pdf
      note: "JORT n° 90 du 31 décembre 1991, p. 2085. Article 31, paragraphe II nouveau de l'article 52 du code, alinéa 2 : « Les revenus de capitaux mobiliers réalisés par les personnes morales non soumises à l'impôt sur les sociétés ou qui en sont totalement exonérées en vertu de la législation en vigueur sont soumis à une retenue à la source définitive et non susceptible de restitution au taux de 20%. Cette retenue est opérée par la personne qui paie ces revenus. » Date d'effet : la loi n'en fixe pas ; elle est exécutoire un jour franc après sa publication au Journal officiel du 31 décembre 1991 (article 3 nouveau du décret du 27 janvier 1883, rédaction du décret du 13 septembre 1956), soit le 2 janvier 1992. Édition française lue à l'image, p. 2085."
    2002-01-01:
    - title: "Loi n° 2001-123 du 28 décembre 2001, portant loi de finances pour l'année 2002, articles 21 et 97"
      href: https://www.pist.tn/jort/2001/2001F/Jo1042001.pdf
      note: "JORT n° 104 du 28 décembre 2001, p. 4253 (article 21) et p. 4261 (article 97). Rubrique « Institution d'un régime fiscal pour les organismes de placement collectif ». Article 21 : « Les dispositions de l'alinéa 2 du paragraphe II de l'article 52 du code […] sont modifiées comme suit : 2 – les revenus de capitaux mobiliers réalisés par les personnes morales non soumises à l'impôt sur les sociétés ou qui en sont totalement exonérées en vertu de la législation en vigueur ainsi que les revenus de capitaux mobiliers réalisés par le fonds commun de placement en valeurs mobilières prévu par la loi n° 2001-83 du 24 juillet 2001, portant promulgation du code des organismes de placement collectif sont soumis à une retenue à la source définitive (le reste sans changement). » Le taux de 20 % est celui de l'alinéa de 1992, que l'article laisse « sans changement » ; l'entrée porte le texte qui étend la retenue aux fonds communs de placement en valeurs mobilières. Date d'effet : article 97 — « Sans préjudice des dispositions des articles 39, 70, 76 et 77 les dispositions de la présente loi sont applicables à compter du 1er janvier 2002. » Édition française lue sur la couche texte, à police décalée, décodée."
    2021-01-01:
    - title: "Loi n° 2020-46 du 23 décembre 2020, portant loi de finances pour l'année 2021, articles 17 et 42"
      href: https://www.pist.tn/jort/2020/2020F/Jo1282020.pdf
      note: "JORT n° 128 du 25 décembre 2020, p. 3130 (article 17) et p. 3138 (article 42). Article 17, paragraphe 1 : « Sont abrogées les dispositions des paragraphes 2 et 2 bis du paragraphe II de l'article 52 du code […]. » Le paragraphe 2 rend « définitive et non restituable, et ce, nonobstant le régime fiscal du bénéficiaire » la retenue de 20 % sur tous les revenus de capitaux mobiliers (feuille `taux_liberatoire`). Date d'effet : article 42, paragraphe 1, à compter du 1er janvier 2021. Édition française lue sur la couche texte."
    2022-01-01:
    - title: "Décret-loi n° 2021-21 du 28 décembre 2021, portant loi de finances pour l'année 2022, articles 38 et 73"
      href: https://www.pist.tn/jort/2021/2021F/Jo1192021.pdf
      note: "JORT n° 119 du 28 décembre 2021, p. 3090 (article 38) et p. 3107 (article 73). Rubrique « Réinstauration de la retenue à la source déductible due sur les revenus de capitaux mobiliers ». Article 38, paragraphe 1, paragraphe 2 rétabli au paragraphe II de l'article 52 du code : « Les revenus de capitaux mobiliers réalisés par les personnes morales non soumises à l'impôt sur les sociétés ou qui en sont totalement exonérées en vertu de la législation en vigueur ainsi que les revenus de capitaux mobiliers réalisés par le fonds commun de placement en valeurs mobilières […] sont soumis à une retenue à la source définitive et non susceptible de restitution au taux de 20 %. » Il s'applique aussi aux fonds d'amorçage et aux fonds communs de placement à risque, et non aux revenus en devises ou en dinars convertibles. Date d'effet : article 73, paragraphe 1, à compter du 1er janvier 2022 ; la note commune n° 1/2022 : revenus « payés à partir du 1er janvier 2022 ». Édition française lue sur la couche texte."
documentation: |-
  Taux de la retenue opérée sur les revenus de capitaux mobiliers servis à une personne morale
  qui n'est pas soumise à l'impôt sur les sociétés ou qui en est totalement exonérée (article 52,
  paragraphe II, alinéa 2, du code). La retenue est définitive : elle n'est ni imputée ni
  restituée. Le texte vise aussi les fonds communs de placement en valeurs mobilières à partir du
  1er janvier 2002, et, à partir du 1er janvier 2022, les fonds d'amorçage et les fonds communs
  de placement à risque.

  À partir du 1er janvier 2002, la loi de finances pour 2002 (article 21) étend la retenue aux
  revenus de capitaux mobiliers des fonds communs de placement en valeurs mobilières, au même
  taux. Les articles 22 à 28 de la même loi règlent le reste du régime des organismes de
  placement collectif : les revenus des parts de ces fonds sont des revenus distribués (article
  29, paragraphe II bis), et les fonds communs de créances subissent une retenue imputable sur
  celle qui frappe les revenus servis à leurs copropriétaires. La loi de finances pour 1999
  (article 43) retire du même alinéa une mention des banques non résidentes, sans changer le
  taux.

  En 2021, l'alinéa est abrogé : la feuille est vide, et ces revenus subissent, comme tous les
  revenus de capitaux mobiliers, la retenue définitive de 20 % portée par `taux_liberatoire`.
