description: "Taux de la retenue à la source libératoire sur les revenus des obligations au porteur dont le bénéficiaire n'est pas révélé"
values:
  1992-01-02:
    value: 0.25
  1997-01-01:
    value: null
metadata:
  unit: /1
  short_label: "Retenue libératoire, obligations au porteur anonymes"
  reference:
    1992-01-02:
    - title: "Loi n° 91-98 du 31 décembre 1991, portant loi de finances pour la gestion 1992, article 31"
      href: https://www.pist.tn/jort/1991/1991F/Jo09091.pdf
      note: "JORT n° 90 du 31 décembre 1991, p. 2085. Rubrique « Dispositions relatives à la retenue à la source ». Article 31, paragraphe I nouveau de l'article 52 : « c) 25% au titre des revenus des obligations au porteur dont l'identité du bénéficiaire n'est pas révélée à l'administration. » Paragraphe II nouveau : « 1) La retenue à la source est libératoire de l'impôt sur le revenu ou de l'impôt sur les sociétés pour : - Les revenus de capitaux mobiliers au porteur dont l'identité du bénéficiaire n'est pas révélée à l'administration. […] » Date d'effet : la loi n'en fixe pas ; elle est exécutoire un jour franc après sa publication au Journal officiel du 31 décembre 1991 (article 3 nouveau du décret du 27 janvier 1883, rédaction du décret du 13 septembre 1956), soit le 2 janvier 1992. Édition française lue à l'image, p. 2085."
    1997-01-01:
    - title: "Loi n° 96-113 du 30 décembre 1996, portant loi de finances pour la gestion 1997, articles 31, 32 et 54"
      href: https://www.pist.tn/jort/1996/1996F/Jo10596.pdf
      note: "JORT n° 105 du 31 décembre 1996, p. 2581 (articles 31 et 32) et p. 2583 (article 54). Rubrique « Unification des taux de la retenue à la source sur les revenus de capitaux mobiliers ». Article 31 : l'alinéa c du paragraphe I de l'article 52, qui portait le taux de 25 %, devient « c - 20% au titre des revenus de capitaux mobiliers ». Article 32 : « Les dispositions du premier tiret de l'alinéa 1 du paragraphe II de l'article 52 […] sont supprimées », ce qui met fin au caractère libératoire de la retenue sur les titres au porteur anonymes. Date d'effet : article 54 — « Les dispositions de la présente loi sont applicables à compter du 1er janvier 1997. » Édition française lue sur la couche texte."
documentation: |-
  Taux libératoire propre aux revenus des obligations au porteur dont l'identité du
  bénéficiaire n'est pas révélée à l'administration, du 2 janvier 1992 au 31 décembre 1996. À
  partir du 1er janvier 1997, ces revenus suivent le taux de droit commun, imputable
  (`taux_imputable`).
