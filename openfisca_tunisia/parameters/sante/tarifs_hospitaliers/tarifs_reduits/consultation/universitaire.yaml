description: "Tarif réduit d'une consultation externe, établissement sanitaire à vocation universitaire"
values:
  1993-01-01:
    value: 2
  1994-09-06:
    value: 3
  1998-03-08:
    value: null
metadata:
  unit: currency
  short_label: "Universitaire"
  notes:
    1993-01-01:
    - note: "Série incomplète : états antérieurs à 1993 non versés."
  reference:
    1993-01-01:
    - title: "Décret n° 93-529 du 1er mars 1993, fixant les tarifs réduits de soins et d'hospitalisation institués au profit des structures sanitaires publiques relevant du ministère de la santé publique, article premier"
      href: https://www.pist.tn/jort/1993/1993F/Jo01993.pdf
      note: "JORT n° 19 du 9 mars 1993, p. 362. Article premier, 1), « pour toute consultation externe » : « Dans les établissements sanitaires à vocation universitaire », 2,000 D. Date d'effet : le décret « prend effet à compter du 1er janvier 1993 » (article 5) ; la date, antérieure à la publication, est reprise telle quelle. Édition française lue à l'image."
    1994-09-06:
    - title: "Décret n° 94-1738 du 22 août 1994, fixant les tarifs réduits et les contributions aux frais de soins et d'hospitalisation institués au profit des structures sanitaires publiques relevant du ministère de la santé publique, article 2"
      href: https://www.pist.tn/jort/1994/1994F/Jo06894.pdf
      note: "JORT n° 68 du 30 août 1994, p. 1385. Article 2, tarifs réduits et contributions « pour toute consultation externe » : « dans les établissements sanitaires à vocation universitaire », 3,000 D. Date d'effet : le décret n'en fixe pas ; le JORT n° 68 a été déposé au siège du gouvernorat de Tunis le 1er septembre 1994 (mention de la dernière page du fascicule, lue à l'image) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 6 septembre 1994. Édition française lue sur la couche texte."
    1998-03-08:
    - title: "Décret n° 98-409 du 18 février 1998, fixant les catégories des bénéficiaires des tarifs réduits de soins et d'hospitalisation dans les structures sanitaires publiques relevant du ministère de la santé publique ainsi que les modalités de leur prise en charge et les tarifs auxquels ils sont assujettis, articles 17 et 25"
      href: https://www.pist.tn/jort/1998/1998F/Jo01798.pdf
      note: "JORT n° 17 du 27 février 1998, p. 407. Le décret n° 98-409 fixe désormais le tarif réduit d'une consultation en pourcentage du tarif des malades payants (article 17) et abroge le décret n° 94-1738 (article 25) : la série en dinars est close. Date d'effet : le décret n'en fixe pas ; le JORT n° 17 a été déposé au siège du gouvernorat de Tunis le 3 mars 1998 (mention de la dernière page du fascicule) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 8 mars 1998. Édition française lue sur la couche texte."
