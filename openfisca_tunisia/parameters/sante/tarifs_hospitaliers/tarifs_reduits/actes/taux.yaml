description: "Tarif réduit des examens complémentaires, interventions et actes de la nomenclature, en part des tarifs des malades payants"
values:
  1998-03-08:
    value: 0.2
metadata:
  unit: /1
  short_label: "Actes, taux"
  reference:
    1998-03-08:
    - title: "Décret n° 98-409 du 18 février 1998, fixant les catégories des bénéficiaires des tarifs réduits de soins et d'hospitalisation dans les structures sanitaires publiques relevant du ministère de la santé publique ainsi que les modalités de leur prise en charge et les tarifs auxquels ils sont assujettis, article 21"
      href: https://www.pist.tn/jort/1998/1998F/Jo01798.pdf
      note: "JORT n° 17 du 27 février 1998, p. 407. Article 21, premier alinéa : les frais des examens complémentaires de radiologie, de biologie, d'explorations fonctionnelles et endoscopiques, des interventions chirurgicales et de tout autre acte inscrit à la nomenclature « sont payés selon un taux de 20% des tarifs en vigueur des malades payants » dans la limite de trente dinars, en sus des tarifs réduits des consultations et de l'hospitalisation. Date d'effet : le décret n'en fixe pas ; le JORT n° 17 a été déposé au siège du gouvernorat de Tunis le 3 mars 1998 (mention de la dernière page du fascicule) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 8 mars 1998. Édition française lue sur la couche texte."
