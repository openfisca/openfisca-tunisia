metadata:
  unit: /1
  short_label: "Actes, part maximale, conventionnels"
  reference:
    1994-09-06:
    - title: "Décret n° 94-1738 du 22 août 1994, fixant les tarifs réduits et les contributions aux frais de soins et d'hospitalisation institués au profit des structures sanitaires publiques relevant du ministère de la santé publique, article 4"
      href: https://www.pist.tn/jort/1994/1994F/Jo06894.pdf
      note: "JORT n° 68 du 30 août 1994, p. 1385. Article 4 : « Pour les bénéficiaires des régimes de soins conventionnels : les frais des examens complémentaires de radiologie, de biologie, d'explorations fonctionnelles et endoscopiques ainsi que les frais d'intervention chirurgicale et tout autre acte inscrit à la nomenclature, sont payés en sus, dans les limites de 10% des tarifs en vigueur ». Date d'effet : le décret n'en fixe pas ; le JORT n° 68 a été déposé au siège du gouvernorat de Tunis le 1er septembre 1994 (mention de la dernière page du fascicule, lue à l'image) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 6 septembre 1994. Édition française lue sur la couche texte."
    1998-03-08:
    - title: "Décret n° 98-409 du 18 février 1998, fixant les catégories des bénéficiaires des tarifs réduits de soins et d'hospitalisation dans les structures sanitaires publiques relevant du ministère de la santé publique ainsi que les modalités de leur prise en charge et les tarifs auxquels ils sont assujettis, articles 21, 23 et 25"
      href: https://www.pist.tn/jort/1998/1998F/Jo01798.pdf
      note: "JORT n° 17 du 27 février 1998, p. 407. Le décret n° 98-409 abroge le décret n° 94-1738 (article 25) ; les affiliés des régimes conventionnels paient désormais les tarifs réduits (article 23), dont 20 % des tarifs des actes dans la limite de trente dinars (article 21). Date d'effet : le décret n'en fixe pas ; le JORT n° 17 a été déposé au siège du gouvernorat de Tunis le 3 mars 1998 (mention de la dernière page du fascicule) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 8 mars 1998. Édition française lue sur la couche texte."
