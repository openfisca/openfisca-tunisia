description: "Tranche à laquelle sont arrondis les tarifs réduits calculés en pourcentage"
values:
  1998-03-08:
    value: 0.5
metadata:
  unit: currency
  short_label: "Arrondi"
  reference:
    1998-03-08:
    - title: "Décret n° 98-409 du 18 février 1998, fixant les catégories des bénéficiaires des tarifs réduits de soins et d'hospitalisation dans les structures sanitaires publiques relevant du ministère de la santé publique ainsi que les modalités de leur prise en charge et les tarifs auxquels ils sont assujettis, article 22"
      href: https://www.pist.tn/jort/1998/1998F/Jo01798.pdf
      note: "JORT n° 17 du 27 février 1998, p. 407. Article 22 : « Les montants des tarifs réduits provenant de l'application des pourcentages mentionnés au présent décret sont fixés par tranche entière de cinq cent millimes. La dernière tranche est comptée sur la base d'une tranche entière. » Date d'effet : le décret n'en fixe pas ; le JORT n° 17 a été déposé au siège du gouvernorat de Tunis le 3 mars 1998 (mention de la dernière page du fascicule) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 8 mars 1998. Édition française lue sur la couche texte."
