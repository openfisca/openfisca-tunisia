description: "Tarif de l'hospitalisation de jour, en part du tarif normal d'une journée d'hospitalisation, malades payants"
values:
  1997-01-04:
    value: 0.75
metadata:
  unit: /1
  short_label: "Hospitalisation de jour"
  reference:
    1997-01-04:
    - title: "Arrêté des ministres des finances et de la santé publique du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article 5"
      href: https://www.pist.tn/jort/1996/1996F/Jo10496.pdf
      note: "JORT n° 104 du 27 décembre 1996, p. 2554. Article 5 : « Le tarif de l'hospitalisation de jour est fixé à 75% du tarif forfaitaire normal d'une journée d'hospitalisation selon la spécialité et la catégorie de l'établissement. » L'arrêté de 1993 ne traite pas de l'hospitalisation de jour. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 104 a été déposé au siège du gouvernorat de Tunis le 30 décembre 1996 (mention de la dernière page du fascicule, lue à l'image) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 4 janvier 1997. Édition française lue sur la couche texte."
