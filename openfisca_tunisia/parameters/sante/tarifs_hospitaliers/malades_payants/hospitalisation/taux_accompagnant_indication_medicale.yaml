description: "Tarif dû par la personne qui accompagne un malade hospitalisé sur indication du médecin, en part du tarif appliqué au malade, malades payants"
values:
  1997-01-04:
    value: 0.5
metadata:
  unit: /1
  short_label: "Accompagnant sur indication médicale"
  reference:
    1997-01-04:
    - title: "Arrêté des ministres des finances et de la santé publique du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article 4"
      href: https://www.pist.tn/jort/1996/1996F/Jo10496.pdf
      note: "JORT n° 104 du 27 décembre 1996, p. 2553. Article 4, troisième alinéa : « Toutefois, les accompagnants des malades, sur indication du médecin, ne sont tenus qu'au paiement de la moitié de ce tarif forfaitaire. » L'arrêté de 1993 ne fait pas cette distinction. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 104 a été déposé au siège du gouvernorat de Tunis le 30 décembre 1996 (mention de la dernière page du fascicule, lue à l'image) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 4 janvier 1997. Édition française lue sur la couche texte."
