description: "Lettre clé E : acte d'échographie"
values:
  2008-07-17:
    value: 3.6
metadata:
  unit: currency
  short_label: "Échographie (E)"
  reference:
    2008-07-17:
    - title: "Arrêté du ministre des finances et du ministre de la santé publique du 7 juillet 2008, portant modification de l'arrêté du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article premier : article 10 (nouveau) de l'arrêté du 19 décembre 1996"
      href: https://www.pist.tn/jort/2008/2008F/Jo0562008.pdf
      note: "JORT n° 56 du 11 juillet 2008, p. 2078. Article 10 (nouveau), liste des lettres clés et de leur valeur en dinars : « E : acte d'échographie 3d,600 ». L'arrêté de 1996 n'avait pas de lettre d'échographie. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 56 a été déposé au siège du gouvernorat de Tunis le 12 juillet 2008 (mention de la dernière page du fascicule) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 17 juillet 2008. Édition française lue sur la couche texte."
