description: "Lettre clé KC : acte de chirurgie opératoire, puis aussi d'anesthésie ou de radiologie interventionnelle"
values:
  1997-01-04:
    value: 1.4
  2008-07-17:
    value: 1.4
metadata:
  unit: currency
  short_label: "Chirurgie (KC)"
  notes:
    1997-01-04:
    - note: "Série incomplète : états antérieurs à 1997 non versés."
  reference:
    1997-01-04:
    - title: "Arrêté des ministres des finances et de la santé publique du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article 10"
      href: https://www.pist.tn/jort/1996/1996F/Jo10496.pdf
      note: "JORT n° 104 du 27 décembre 1996, p. 2554. Article 10, liste des lettres clés et de leur valeur en dinars : « KC : acte de chirurgie opératoire » : 1d,400. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 104 a été déposé au siège du gouvernorat de Tunis le 30 décembre 1996 (mention de la dernière page du fascicule, lue à l'image) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 4 janvier 1997. Édition française lue sur la couche texte."
    2008-07-17:
    - title: "Arrêté du ministre des finances et du ministre de la santé publique du 7 juillet 2008, portant modification de l'arrêté du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article premier : article 10 (nouveau) de l'arrêté du 19 décembre 1996"
      href: https://www.pist.tn/jort/2008/2008F/Jo0562008.pdf
      note: "JORT n° 56 du 11 juillet 2008, p. 2077. Article 10 (nouveau), liste des lettres clés et de leur valeur en dinars : « KC : acte de chirurgie opératoire ou d'anesthésie ou de radiologie interventionnelle : 1d,400 ». La radiologie interventionnelle, qui avait sa lettre propre, est rattachée à cette lettre. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 56 a été déposé au siège du gouvernorat de Tunis le 12 juillet 2008 (mention de la dernière page du fascicule) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 17 juillet 2008. Édition française lue sur la couche texte."
