description: "Forfait d'un essai de fécondation in vitro, médicaments exclus, malades payants"
values:
  1998-05-04:
    value: 250
metadata:
  unit: currency
  short_label: "Fécondation in vitro, essai"
  reference:
    1998-05-04:
    - title: "Arrêté des ministres des finances et de la santé publique du 17 avril 1998, modifiant l'arrêté du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article unique : article 11 (nouveau) de l'arrêté du 19 décembre 1996"
      href: https://www.pist.tn/jort/1998/1998F/Jo03398.pdf
      note: "JORT n° 33 du 24 avril 1998, p. 874. Article 11 (nouveau), point 5), procréation médicalement assistée : « acte de fécondation In vitro (F.I.V) : 250 dinars pour chaque essai » ; le forfait comprend les soins médicaux et infirmiers et les examens complémentaires de la nomenclature, à l'exclusion des médicaments. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 33 a été déposé au siège du gouvernorat de Tunis le 29 avril 1998 (mention de la dernière page du fascicule) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 4 mai 1998. Édition française lue sur la couche texte."
