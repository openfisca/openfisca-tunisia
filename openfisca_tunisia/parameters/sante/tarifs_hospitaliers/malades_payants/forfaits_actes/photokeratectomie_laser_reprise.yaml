description: "Supplément du forfait de photo-kératectomie au laser excimère en cas de reprise, malades payants"
values:
  2003-02-10:
    value: 100
metadata:
  unit: currency
  short_label: "Photo-kératectomie, reprise"
  reference:
    2003-02-10:
    - title: "Arrêté des ministres des finances et de la santé publique du 29 janvier 2003, modifiant l'arrêté du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article unique : point 7 ajouté à l'article 11 (nouveau) de l'arrêté du 19 décembre 1996"
      href: https://www.pist.tn/jort/2003/2003F/Jo0102003.pdf
      note: "JORT n° 10 du 4 février 2003, p. 331. Point 7, correction des troubles réfractifs : « photo-kératectomie au laser excimère : 300 dinars (l'œil) plus 100 dinars en cas de reprise » : supplément de 100 dinars. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 10 a été déposé au siège du gouvernorat de Tunis le 5 février 2003 (mention de la dernière page du fascicule, lue à l'image) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 10 février 2003. Édition française lue à l'image, la couche texte étant décalée."
