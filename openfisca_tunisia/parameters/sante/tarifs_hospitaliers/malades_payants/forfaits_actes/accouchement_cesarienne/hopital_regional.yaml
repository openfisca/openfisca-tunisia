description: "Forfait d'un accouchement par césarienne, séjour de trois jours, hôpital régional, malades payants"
values:
  1997-01-04:
    value: 200
  1998-05-04:
    value: 200
metadata:
  unit: currency
  short_label: "Hôpital régional"
  notes:
    1997-01-04:
    - note: "Série incomplète : états antérieurs à 1997 non versés."
  reference:
    1997-01-04:
    - title: "Arrêté des ministres des finances et de la santé publique du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article 11"
      href: https://www.pist.tn/jort/1996/1996F/Jo10496.pdf
      note: "JORT n° 104 du 27 décembre 1996, p. 2555. Article 11, point 4) : accouchement par césarienne, « hôpital régional : 200 dinars ». L'arrêté ne fixe pas de forfait de césarienne pour les hôpitaux de circonscription. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 104 a été déposé au siège du gouvernorat de Tunis le 30 décembre 1996 (mention de la dernière page du fascicule, lue à l'image) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 4 janvier 1997. Édition française lue sur la couche texte."
    1998-05-04:
    - title: "Arrêté des ministres des finances et de la santé publique du 17 avril 1998, modifiant l'arrêté du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article unique : article 11 (nouveau) de l'arrêté du 19 décembre 1996"
      href: https://www.pist.tn/jort/1998/1998F/Jo03398.pdf
      note: "JORT n° 33 du 24 avril 1998, p. 874. Article 11 (nouveau), point 4) : forfait repris sans changement, 200 dinars. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 33 a été déposé au siège du gouvernorat de Tunis le 29 avril 1998 (mention de la dernière page du fascicule) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 4 mai 1998. Édition française lue sur la couche texte."
