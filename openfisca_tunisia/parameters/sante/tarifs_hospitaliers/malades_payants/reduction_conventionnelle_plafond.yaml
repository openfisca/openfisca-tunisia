description: "Réduction maximale des tarifs des malades payants accordée dans un régime conventionnel préférentiel"
values:
  1997-01-04:
    value: 0.15
metadata:
  unit: /1
  short_label: "Réduction conventionnelle maximale"
  reference:
    1997-01-04:
    - title: "Arrêté des ministres des finances et de la santé publique du 19 décembre 1996, fixant les tarifs de prise en charge des malades payants dans les structures sanitaires publiques relevant du ministère de la santé publique, article 14"
      href: https://www.pist.tn/jort/1996/1996F/Jo10496.pdf
      note: "JORT n° 104 du 27 décembre 1996, p. 2555. Article 14 : dans le cadre d'un régime conventionnel préférentiel, les structures sanitaires publiques peuvent accorder des réductions « ne dépassant pas 15% des tarifs prévus par le présent arrêté », en vertu de conventions qui ne prennent effet qu'après approbation de l'autorité de tutelle. Date d'effet : l'arrêté n'en fixe pas ; le JORT n° 104 a été déposé au siège du gouvernorat de Tunis le 30 décembre 1996 (mention de la dernière page du fascicule, lue à l'image) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 4 janvier 1997. Édition française lue sur la couche texte."
