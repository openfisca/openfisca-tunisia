description: Montant minimum exigible au titre du minimum d'impôt sur les sociétés, régime réduit
values:
  2006-01-01:
    value: 100
  2011-01-01:
    value: 200
  2014-01-01:
    value: 300
metadata:
  unit: currency
  reference:
    2006-01-01:
      title: Article 43 § 1 de la loi n° 2005-106 du 19 décembre 2005 portant loi de finances pour l'année 2006, JORT n° 101 du 20 décembre 2005, p. 3601-3602 — « 100 dinars pour les entreprises soumises au taux de 10 % »
    2011-01-01:
      title: Article 38 § 1 de la loi n° 2010-58 du 17 décembre 2010 portant loi de finances pour l'année 2011, JORT n° 102 du 21 décembre 2010, p. 3474 — « Le montant de 100 dinars prévu au paragraphe II de l'article 44 et au premier tiret de l'alinéa premier du paragraphe II de l'article 49 … est relevé à 200 dinars »
    2014-01-01:
      title: Article 48 § 2 de la loi n° 2013-54 du 30 décembre 2013 portant loi de finances pour l'année 2014, JORT n° 105 du 31 décembre 2013, p. 3679 — « avec un minimum égal à 300 dinars »
documentation: |
  Montant dû même en l'absence de chiffre d'affaires, pour les sociétés dont les bénéfices
  sont soumis à l'impôt sur les sociétés au taux de 10 %.

  Un relèvement qui vise les deux impôts à la fois. L'article 38 § 1 de la loi de finances
  pour 2011 relève « le montant de 100 dinars prévu au paragraphe II de l'article 44 et au
  premier tiret de l'alinéa premier du paragraphe II de l'article 49 » : un seul membre de
  phrase modifie le minimum de l'impôt sur le revenu et celui de l'impôt sur les sociétés.
  C'est l'illustration la plus nette de ce que les deux impôts partagent un même code.

  Ce plancher triple entre 2006 et 2014, pendant que le taux d'impôt correspondant — 10 % —
  ne bougeait pas d'un point.

  Dates d'effet présumées pour 2006 et 2011, les clauses d'application n'ayant pas été lues.
  Celle de 2014 est établie sur le texte.
