description: Taux optionnel de l'impôt sur les sociétés sur le prix de cession, pour la plus-value de l'article 45 § II
values:
  2021-01-01:
    value: 0.10
  2024-01-01:
    value: 0.15
metadata:
  unit: /1
  reference:
    2021-01-01:
      title: Article 14 § 11 de la loi n° 2020-46 du 23 décembre 2020 portant loi de finances pour l'année 2021, JORT n° 128 du 25 décembre 2020 — remplace « au taux de 15 % du prix de cession » par « au taux de 10 % du prix de cession » au troisième paragraphe de l'article 49 § I ; effet fixé par son article 14 § 28 à la plus-value réalisée à partir du 1er janvier 2021
    2024-01-01:
      title: Article 37 § 1 de la loi n° 2024-48 du 9 décembre 2024 portant loi de finances pour l'année 2025, JORT n° 149 du 10 décembre 2024, édition française, p. 3429-3430 — « les intéressés peuvent opter pour le paiement de l'impôt sur les sociétés au titre de ladite plus-value au taux de 15 % du prix de cession » ; date d'effet fixée par le § 16 du même article aux bénéfices réalisés à compter du 1er janvier 2024
documentation: |
  Une assiette qui n'est pas le bénéfice. Ce taux ne frappe pas le bénéfice imposable mais
  le prix de cession, et il relève d'une option : à défaut, la plus-value de l'article 45
  § II est imposée au taux de droit commun. Il ne peut donc pas être comparé terme à terme
  aux autres taux de cet arbre, et il ne s'y substitue jamais d'office.

  Un calendrier propre, distinct de celui des bénéfices. C'est le seul paramètre de l'arbre
  dont les dates ne sont pas des années de bénéfices. La loi de finances pour 2021 date ses
  effets « à la plus-value réalisée à partir du 1er janvier 2021 », par une clause séparée
  de celle qui vise les bénéfices ; et le code consolidé porte deux notes distinctes — la
  note (2) rattache le droit commun de 20 % aux bénéfices de 2024, la note (3) rattache ces
  taux-ci à la plus-value réalisée à partir de 2025. Aligner les deux séries serait une
  erreur d'un an.

  L'état antérieur à 2021 n'est pas daté. L'existence d'un taux d'option de 15 % avant cette
  date est certaine — la loi de finances pour 2021 le remplace, donc il existait —, mais le
  texte qui l'a institué et sa date d'effet n'ont pas été établis. La série commence donc à
  l'état attesté plutôt que de faire courir une valeur dont l'origine serait supposée.

  Le texte de 2024 n'a pas été lu au Journal officiel : la loi n° 2024-48 est absente du
  corpus local, n'est pas indexée par la base des textes et l'édition française de son
  fascicule n'est pas en ligne. La valeur de 2025 repose sur le code consolidé.
