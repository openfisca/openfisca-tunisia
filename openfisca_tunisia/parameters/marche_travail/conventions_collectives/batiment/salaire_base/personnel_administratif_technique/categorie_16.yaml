  Catégorie 16 de la grille du personnel administratif et technique à traitement mensuel, qui en
  compte dix-neuf, numérotées de 1 à 19 et sans intitulé sur la grille. Échelons versés : tous, de
  l'échelon 1 à l'échelon 11, depuis la grille du 1er mai 1996.
