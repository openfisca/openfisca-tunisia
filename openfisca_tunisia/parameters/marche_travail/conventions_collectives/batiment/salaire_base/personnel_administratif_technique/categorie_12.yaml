documentation: |-
  Catégorie 12 de la grille du personnel administratif et technique à traitement mensuel, qui en
  compte dix-neuf, numérotées de 1 à 19 et sans intitulé sur la grille. Échelons versés : tous, de
  l'échelon 1 à l'échelon 11, depuis la grille du 1er mai 1996.
  La case de l'échelon 7 est illisible sur le fascicule dans la grille du 1er mai 1996 : elle y porte
  une valeur vide, sans valeur déduite ni reportée.
