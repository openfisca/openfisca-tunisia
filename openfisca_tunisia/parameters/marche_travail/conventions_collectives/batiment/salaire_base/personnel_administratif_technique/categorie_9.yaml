      - title: "Décret n° 2026-68 du 30 avril 2026, article premier"
        href: https://www.pist.tn/jort/2026/2026F/Jo0442026.pdf
        note: "JORT n° 44 du 30 avril 2026, pp. 838-839. Article premier : hausse annuelle de 5 % des salaires de base, au titre des années 2026, 2027 et 2028, à compter du 1er janvier 2026 ; pour 2026, elle s'applique aux salaires de base de tous les échelons des dernières grilles annexées aux conventions collectives sectorielles. Aucun texte ne publie la grille qui en résulte pour cette branche : sans valeur à compter de cette date, la dernière grille conventionnelle ne valant pas au-delà du 31 décembre 2025."
  documentation: |-
    Salaire mensuel de base de la catégorie 9, échelon 8, de la grille du personnel administratif et technique à
    traitement mensuel annexée à la convention collective du bâtiment et des travaux publics.

    Unité : dinars courants par mois.

    Ce que le salaire comprend : c'est un salaire de base. Il comprend l'indemnité complémentaire
    provisoire des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982, ce que chaque
    grille mentionne. Il ne comprend pas les indemnités de la convention (présence, transport), qui
    s'y ajoutent.

    La série commence au 1er mai 1996, avec l'avenant n° 5 : les grilles antérieures ne mesurent pas
    la même grandeur ou ne sont pas relevées. Les trois grilles de l'avenant n° 16 (1er décembre
    2021, 1er janvier 2023, 1er janvier 2024) sont lues sur une reproduction du journal par un site
    tiers.

    La série est sans valeur à compter du 1er janvier 2026 : le décret n° 2026-68 du 30 avril 2026
    relève alors de 5 % les salaires de base des dernières grilles annexées aux conventions
    collectives sectorielles, et aucun texte ne publie la grille qui en résulte.

    Une valeur vaut de sa date d'effet jusqu'à la veille de la date suivante. Chaque date est la date
    d'effet que la grille énonce elle-même ; elle est souvent antérieure à la signature de l'avenant et
    à l'arrêté qui l'agrée. Une date sans valeur est une date à laquelle le salaire change sans qu'aucun
    texte en publie le montant : la valeur précédente n'y vaut plus.
