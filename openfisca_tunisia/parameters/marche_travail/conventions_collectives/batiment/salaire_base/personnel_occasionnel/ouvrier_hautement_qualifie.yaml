documentation: |-
  Salaire horaire de base de la catégorie « ouvrier hautement qualifié » de la grille du personnel occasionnel
  annexée à la convention collective du bâtiment et des travaux publics. Cette grille n'a
  pas d'échelon.

  Unité : dinars courants par heure de travail. La grille ne dit pas à quel régime de durée
  hebdomadaire du travail elle se rapporte.

  Ce que le salaire comprend : c'est un salaire de base. Il comprend l'indemnité complémentaire
  provisoire des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982, ce que chaque
  grille mentionne. Il ne comprend pas les indemnités de la convention (présence, transport), qui
  s'y ajoutent.

  La série commence au 1er mai 1996, avec l'avenant n° 5 : les grilles antérieures ne mesurent pas
  la même grandeur ou ne sont pas relevées.

  La série est sans valeur à compter du 1er mai 2008 : la grille qui prend effet à cette date
  (avenant n° 9) divise l'ouvrier hautement qualifié en deux niveaux, I et II, versés chacun à
  part. La ligne unique ne se prolonge ni dans l'un ni dans l'autre.

  Une valeur vaut de sa date d'effet jusqu'à la veille de la date suivante. Chaque date est la date
  d'effet que la grille énonce elle-même ; elle est souvent antérieure à la signature de l'avenant et
  à l'arrêté qui l'agrée. Une date sans valeur est une date à laquelle la valeur précédente ne vaut
  plus : ici, celle à laquelle la grille cesse de porter cette ligne.
