documentation: |-
  Convention collective nationale du bâtiment et des travaux publics, signée le 16 janvier 1975 et
  agréée par arrêté du ministre des affaires sociales du 12 mars 1975 (JORT n° 18 du 14 mars 1975,
  p. 504) ; son texte paraît au JORT n° 20 du 25 mars 1975, pp. 557-571. Les avenants l'intitulent
  « convention collective sectorielle du bâtiment et des travaux publics » à partir de l'avenant
  n° 8, agréé en 2006.

  Chaque avenant de salaires porte, par date d'effet, une grille du personnel occasionnel — un
  salaire horaire par catégorie, sans échelon : manœuvre ordinaire, manœuvre spécialisé,
  aide-ouvrier, ouvrier qualifié de 1re et de 2e catégorie, ouvrier hautement qualifié, chef
  d'équipe à trois degrés — et une grille du personnel administratif et technique à traitement
  mensuel (19 catégories, 11 échelons). L'avenant n° 5 paraît encore en français (JORT n° 86 du
  25 octobre 1996) ; les suivants ne paraissent que dans l'édition arabe du journal.

  La date d'effet de la convention de 1975 n'est pas relevée ici.
