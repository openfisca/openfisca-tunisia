documentation: |-
  Convention collective nationale du bâtiment et des travaux publics, signée le 16 janvier 1975 et
  agréée par arrêté du ministre des affaires sociales du 12 mars 1975 (JORT n° 18 du 14 mars 1975,
  p. 504) ; son texte paraît au JORT n° 20 du 25 mars 1975, pp. 557-571. Les avenants l'intitulent
  « convention collective sectorielle du bâtiment et des travaux publics » à partir de l'avenant
  n° 8, agréé en 2006.

  L'avenant n° 5 paraît encore en français (JORT n° 86 du 25 octobre 1996) ; les suivants ne
  paraissent que dans l'édition arabe du journal.

  Son article 58 la fait entrer en application le 1er juin 1974 (p. 565).
