documentation: |-
  Salaire mensuel de base de la position « échelle 21, dernier échelon » de la grille annexée à la convention
  collective des assurances. C'est le salaire le plus élevé de la grille : dernière échelle de la catégorie I, dernier échelon — le 12e jusqu'au 31 mai 1999, le 14e depuis le 1er juin 1999, date à laquelle la grille gagne deux échelons. Les valeurs antérieures et postérieures à cette date ne se comparent donc pas à échelon égal.

  Unité : dinars courants par mois, pour une durée du travail de 40 heures par semaine, soit
  2 080 heures par an (article 30 de la convention révisée).

  Ce que le salaire comprend : c'est le salaire mensuel de la grille. Il comprend l'indemnité
  complémentaire provisoire des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982,
  depuis la grille du 1er juin 1993 (avenant n° 3). Il ne comprend ni l'indemnité de transport, ni
  les treizième et quatorzième mois, ni la prime de rendement, que la convention sert en sus.

  La série commence au 1er juin 1993. Les grilles de 1983 à 1992 ne comprennent pas l'indemnité
  complémentaire provisoire et ne mesurent donc pas la même grandeur, et rien ne relie la grille
  de 1975 à la suite : elles ne sont pas versées ici. De l'avenant n° 3 à l'avenant n° 15, tous
  les avenants ont été lus, sans numéro manquant.

  La série est sans valeur du 1er juin 2014 au 31 mai 2015 : l'avenant n° 11 annonce une grille au
  1er juin 2014 que le journal n'imprime pas.

  Elle est aussi sans valeur du 1er juin 2018 au 30 septembre 2020 : ce salaire n'a pas été lu dans les grilles du 1er juin 2018 et du 1er juin 2019.

  La série est sans valeur à compter du 1er janvier 2026 : le décret n° 2026-68 du 30 avril 2026
  relève alors de 5 % les salaires de base des dernières grilles annexées aux conventions
  collectives sectorielles, et aucun texte ne publie la grille qui en résulte.

  Une valeur vaut de sa date d'effet jusqu'à la veille de la date suivante. Chaque date est la date
  d'effet que la grille énonce elle-même ; elle est souvent antérieure à la signature de l'avenant et
  à l'arrêté qui l'agrée. Une date sans valeur est une date à laquelle une grille prend effet sans
  que ce salaire ait été relevé, ou à laquelle le salaire change sans qu'aucun texte en publie le
  montant : la valeur précédente n'y vaut plus.
