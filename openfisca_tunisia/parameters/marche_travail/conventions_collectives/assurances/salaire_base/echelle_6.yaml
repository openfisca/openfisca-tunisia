      - title: "Décret n° 2026-68 du 30 avril 2026, article premier"
        href: https://www.pist.tn/jort/2026/2026F/Jo0442026.pdf
        note: "JORT n° 44 du 30 avril 2026, pp. 838-839. Article premier : hausse annuelle de 5 % des salaires de base, au titre des années 2026, 2027 et 2028, à compter du 1er janvier 2026 ; pour 2026, elle s'applique aux salaires de base de tous les échelons des dernières grilles annexées aux conventions collectives sectorielles. Aucun texte ne publie la grille qui en résulte pour cette branche : sans valeur à compter de cette date, la dernière grille conventionnelle ne valant pas au-delà du 31 décembre 2025. L'application de ce décret à la branche des assurances n'a pas été examinée, et aucun avenant postérieur à l'avenant n° 15 n'est identifié."
  documentation: |-
    Salaire mensuel de base de l'échelle 6, échelon 2, de la grille annexée à la convention collective des
    assurances.

    Unité : dinars courants par mois, pour une durée du travail de 40 heures par semaine, soit
    2 080 heures par an (article 30 de la convention révisée).

    Ce que le salaire comprend : c'est le salaire mensuel de la grille. Il comprend l'indemnité
    complémentaire provisoire des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982,
    depuis la grille du 1er juin 1993 (avenant n° 3). Il ne comprend ni l'indemnité de transport, ni
    les treizième et quatorzième mois, ni la prime de rendement, que la convention sert en sus.

    La série commence au 1er juin 1993 : les grilles antérieures ne mesurent pas la même grandeur.

    La grille du 1er juin 2014 ne paraît pas avec l'avenant n° 11, mais à part, au JORT n° 4 du
    13 janvier 2015.

    La série est sans valeur à compter du 1er janvier 2026 : le décret n° 2026-68 du 30 avril 2026
    relève alors de 5 % les salaires de base des dernières grilles annexées aux conventions
    collectives sectorielles, et aucun texte ne publie la grille qui en résulte.

    Une valeur vaut de sa date d'effet jusqu'à la veille de la date suivante. Chaque date est la date
    d'effet que la grille énonce elle-même ; elle est souvent antérieure à la signature de l'avenant et
    à l'arrêté qui l'agrée. Une date sans valeur est une date à laquelle le salaire change sans qu'aucun
    texte en publie le montant : la valeur précédente n'y vaut plus.
