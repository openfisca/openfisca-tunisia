documentation: |-
  Dernière échelle de la grille. Échelons versés : le 12e, dernier de l'échelle jusqu'au 31 mai
  1999, depuis le 1er juin 1993 ; le 13e et le 14e, créés le 1er juin 1999, le 14e étant depuis le
  dernier de l'échelle. Les échelons 1 à 11 ne sont pas versés. Les autres cases de la grille restent à lire : aucune entrée ne les représente.
