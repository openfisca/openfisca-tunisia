documentation: |-
  Ligne que les grilles intitulent « Exceptionnel », imprimée entre l'échelle 3 et l'échelle 4. Échelons versés : tous, du 1er au 12e depuis la grille du 1er juin 1993,
  les 13e et 14e depuis celle du 1er juin 1999 (avenant n° 5), qui les crée.
