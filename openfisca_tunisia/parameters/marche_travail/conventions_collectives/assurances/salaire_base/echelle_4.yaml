documentation: |-
  Échelle 4 de la grille. Échelons versés : tous, du 1er au 12e depuis la grille du 1er juin 1993,
  les 13e et 14e depuis celle du 1er juin 1999 (avenant n° 5), qui les crée.
  La case de l'échelon 1 est illisible sur le fascicule dans la grille du 1er juin 1996 : elle y porte une
  valeur vide, sans valeur déduite ni reportée.
