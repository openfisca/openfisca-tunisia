documentation: |-
  Convention collective nationale des assurances, signée le 24 juillet 1975 et agréée par arrêté du
  ministre des affaires sociales du 24 décembre 1975 (JORT n° 87 des 30 et 31 décembre 1975,
  pp. 2898-2899) ; son texte paraît au JORT n° 7 du 30 janvier 1976, pp. 270-279, et son article 70
  la fait entrer en vigueur à compter du 1er janvier 1975. Elle est révisée en 1983 : la convention
  collective nationale des assurances révisée est agréée par arrêté du 23 août 1983 (JORT n° 74 des
  15 et 18 novembre 1983, pp. 2935-2947), et ses dispositions pécuniaires prennent effet le
  1er janvier 1983. L'arrêté du 24 mai 2007 remplace l'appellation « nationale » par
  « sectorielle ».

  Elle vaut pour l'ensemble du personnel du secteur des assurances, sauf les agents généraux
  d'assurance et leurs employés, les concierges des immeubles de rapport et les agents
  contractuels.

  La durée du travail de référence est de 40 heures par semaine, soit 2 080 heures par an. Depuis
  l'avenant n° 4, agréé le 24 juillet 1996, les avenants et leurs grilles ne paraissent que dans
  l'édition arabe du journal.

  Trois nœuds, parce que les grilles ne mesurent pas toutes la même grandeur :
  - `salaire_base` : les grilles du 1er juin 1993 au 1er juin 2021, qui comprennent l'indemnité
    complémentaire provisoire ;
  - `salaire_base_avant_1993` : les grilles de 1975, 1983, 1989, 1990 (grille n° 2), 1991 et 1992 :
    celles de 1989 à 1992 excluent l'indemnité complémentaire provisoire, celles de 1975 et de
    1983 ne la mentionnent pas ; la série cesse le 1er juin 1993 ;
  - `salaire_base_avant_1993_grille_1_de_1990` : la grille n° 1 du 1er juin 1990, seconde
    grille de même date d'effet, pour les entreprises ayant appliqué l'avenant n° 1.
  Les deux derniers ne se prolongent pas dans le premier et ne se comparent pas à lui sans cette
  réserve.
