documentation: |-
  Première échelle de la grille. Échelons versés : les douze, aux six grilles antérieures au
  1er juin 1993 — 1er janvier 1975, 1er janvier 1983, 1er janvier 1989, 1er juin 1990 (grille n° 2),
  1er juin 1991 et 1er juin 1992. Dans la grille de 1975, c'est l'échelle I, de la catégorie G. La
  série cesse le 1er juin 1993.

  Les douze cases de la ligne sont illisibles sur le fascicule dans la grille du 1er janvier 1989 :
  valeur vide à cette date, sans valeur déduite ni reportée.
