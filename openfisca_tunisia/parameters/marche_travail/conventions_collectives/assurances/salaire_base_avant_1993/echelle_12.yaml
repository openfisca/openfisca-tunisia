    d'accord du 8 juin 1984 relatif à l'augmentation des salaires, que vise l'avenant n° 1, n'est
    pas lu.

    Entreprises visées. Au 1er janvier 1989 la grille est celle de l'avenant n° 1, dont l'arrêté
    d'agrément écarte les employeurs et travailleurs visés par les circulaires du Premier ministre
    n° 31 et n° 84 de 1988 et par le décret n° 88-1889. Au 1er juin 1990 l'avenant n° 2 publie deux
    grilles : la valeur portée ici est celle de la grille n° 2, qui s'applique aux entreprises ayant
    servi à leur personnel les augmentations de ces circulaires et de ce décret, et que prolongent
    les grilles de 1991 et de 1992 ; la grille n° 1, pour les entreprises ayant appliqué l'avenant
    n° 1, est dans `salaire_base_avant_1993_grille_1_de_1990`. Les grilles du 1er juin 1991 et du
    1er juin 1992 s'appliquent à toutes les entreprises.

    Chaque date est la date d'effet que la grille ou son texte énonce. Une date sans valeur est une
    date à laquelle la valeur précédente ne vaut plus : ici, celle à laquelle la série cesse
    (1er juin 1993).
