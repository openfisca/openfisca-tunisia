    servies en sus. Aucune de ces grilles ne dit comprendre l'indemnité complémentaire provisoire
    des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982 : celles de 1989, 1990, 1991
    et 1992 portent une note de bas de grille qui l'exclut ; celle de 1983, postérieure à ces
    décrets, n'en porte aucune mention ; celle de 1975 leur est antérieure.

    La série s'arrête au 1er juin 1993 : à compter de cette date la grille comprend l'indemnité
    complémentaire provisoire (avenant n° 3) et se lit dans `salaire_base`. Les deux séries ne
    mesurent pas la même grandeur : celle-ci ne se prolonge pas dans `salaire_base`, et ne se
