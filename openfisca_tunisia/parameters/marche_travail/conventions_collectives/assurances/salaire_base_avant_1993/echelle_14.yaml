  documentation: |-
    Salaire mensuel de base de l'échelle 14, échelon 10, des grilles annexées à la convention
    collective des assurances et à ses avenants n° 1 et n° 2, avant le 1er juin 1993. Dans la grille
    de 1975, l'échelle 14 est l'échelle XIV, de la catégorie C.

    Unité : dinars courants par mois, pour une durée du travail de 40 heures par semaine, soit 2 080
    heures par an.

    Ce que le salaire comprend : c'est le salaire mensuel de la grille, hors indemnités et primes
    servies en sus. Aucune de ces grilles ne dit comprendre l'indemnité complémentaire provisoire
    des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982 : celles de 1989, 1990, 1991
    et 1992 portent une note de bas de grille qui l'exclut ; celle de 1983, postérieure à ces
    décrets, n'en porte aucune mention ; celle de 1975 leur est antérieure.

    La série s'arrête au 1er juin 1993 : à compter de cette date la grille comprend l'indemnité
    complémentaire provisoire (avenant n° 3) et se lit dans `salaire_base`. Les deux séries ne
    mesurent pas la même grandeur : celle-ci ne se prolonge pas dans `salaire_base`, et ne se
    compare pas à elle sans cette réserve.

    Ces grilles ne forment pas une suite continue. Une valeur se lit de sa date d'effet jusqu'à la
    veille de la date suivante, sans qu'il soit établi qu'elle ait valu tout ce temps : aucune
    grille n'est lue entre celle du 1er janvier 1975 et celle du 1er janvier 1983, et un protocole
    d'accord du 8 juin 1984 relatif à l'augmentation des salaires, que vise l'avenant n° 1, n'est
    pas lu.

