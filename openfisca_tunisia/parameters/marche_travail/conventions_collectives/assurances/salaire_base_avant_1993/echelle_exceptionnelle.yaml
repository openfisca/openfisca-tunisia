        href: https://www.pist.tn/jort/1990/1990F/Jo07490.pdf
        note: "JORT n° 74 du 16 novembre 1990, édition française, p. 1721. La grille prend effet le 1er juin 1991 ; ligne « Exceptionnel », échelon 7 : 175,905 dinars par mois. Valeur lue à l'image, recoupée par l'édition arabe. Grille n° 3 de l'avenant, qui s'applique à toutes les entreprises. Note de bas de grille : ces salaires ne comprennent pas les augmentations prévues par les décrets n° 81-437 et n° 82-501 (indemnité complémentaire provisoire)."
      1992-06-01:
      - title: "Avenant n° 2 à la convention collective nationale des assurances, agréé par arrêté du 9 novembre 1990"
        href: https://www.pist.tn/jort/1990/1990F/Jo07490.pdf
