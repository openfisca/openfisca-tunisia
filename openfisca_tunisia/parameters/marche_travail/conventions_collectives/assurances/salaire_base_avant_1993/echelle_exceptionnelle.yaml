documentation: |-
  Ligne que les grilles intitulent « Exceptionnel », imprimée entre l'échelle 3 et l'échelle 4.
  Échelons versés : les douze, aux cinq grilles qui portent cette ligne avant le 1er juin 1993 —
  1er janvier 1983, 1er janvier 1989, 1er juin 1990 (grille n° 2), 1er juin 1991 et 1er juin 1992.
  La grille du 1er janvier 1975 ne porte pas cette ligne. La série cesse le 1er juin 1993.

  Les cases des échelons 1, 2, 3, 4 et 5 sont illisibles sur le fascicule dans la grille du
  1er janvier 1989 : valeur vide à cette date, sans valeur déduite ni reportée.
