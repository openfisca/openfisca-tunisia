  description: "Assurances - échelle 15, échelon 8 : salaire mensuel de base de la grille n° 1 du 1er juin 1990, hors indemnité complémentaire provisoire"
  values:
    1990-06-01:
      value: 316.366
    1991-06-01:
      value: null
  metadata:
    short_label: "Échelon 8"
    unit: currency/mois
    reference:
      1990-06-01:
      - title: "Avenant n° 2 à la convention collective nationale des assurances, agréé par arrêté du 9 novembre 1990"
        href: https://www.pist.tn/jort/1990/1990A/Ja07490.pdf
        note: "JORT n° 74 du 16 novembre 1990, édition arabe, p. 1729 (édition française, p. 1719). La grille prend effet le 1er juin 1990 ; échelle 15, échelon 8 : 316,366 dinars par mois. Valeur lue à l'image. Grille n° 1 de l'avenant, qui « entre en vigueur à compter du 1er juin 1990 et s'applique aux entreprises ayant appliqué l'avenant n° 1 signé le 9 mars 1989 » ; la grille n° 2, de même date, s'applique aux autres entreprises : voir `salaire_base_avant_1993`. Le numéro de la page de l'édition arabe est déduit de l'ordre des pages du fascicule. Note de bas de grille : ces salaires ne comprennent pas les augmentations prévues par les décrets n° 81-437 et n° 82-501 (indemnité complémentaire provisoire)."
      1991-06-01:
      - title: "Avenant n° 2 à la convention collective nationale des assurances, agréé par arrêté du 9 novembre 1990"
        href: https://www.pist.tn/jort/1990/1990F/Jo07490.pdf
        note: "JORT n° 74 du 16 novembre 1990, édition française, p. 1721. La grille n° 3 de l'avenant n° 2, qui prend effet le 1er juin 1991, s'applique à toutes les entreprises : la grille n° 1 cesse. Sans valeur à compter de cette date : voir `salaire_base_avant_1993`."
  documentation: |-
    Salaire mensuel de base de l'échelle 15, échelon 8, de la grille n° 1 que l'avenant n° 2 à la
    convention collective des assurances fait entrer en vigueur le 1er juin 1990.

    L'avenant n° 2 publie deux grilles à cette date. La grille n° 1 « entre en vigueur à compter du
    1er juin 1990 et s'applique aux entreprises ayant appliqué l'avenant n° 1 signé le 9 mars 1989 »
    ; la grille n° 2 s'applique aux entreprises ayant servi à leur personnel les augmentations
    prévues par les circulaires du Premier ministre n° 31 et n° 84 des 1er avril et 9 octobre 1988
    et par le décret n° 88-1889 du 10 novembre 1988, et se lit dans `salaire_base_avant_1993`.

    Unité : dinars courants par mois, pour une durée du travail de 40 heures par semaine, soit 2 080
    heures par an.

    Ce que le salaire comprend : c'est le salaire mensuel de la grille, hors indemnités et primes
    servies en sus. Une note de bas de grille en exclut l'indemnité complémentaire provisoire des
    décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982 : cette grille ne se compare pas,
    sans cette réserve, à `salaire_base`, qui la comprend depuis le 1er juin 1993.

    La série ne porte que cette date, et s'arrête au 1er juin 1991 : la grille n° 3 de l'avenant,
    qui prend effet ce jour-là, s'applique à toutes les entreprises et se lit dans
    `salaire_base_avant_1993`. La date sans valeur est celle à laquelle la valeur précédente ne vaut
    plus.
