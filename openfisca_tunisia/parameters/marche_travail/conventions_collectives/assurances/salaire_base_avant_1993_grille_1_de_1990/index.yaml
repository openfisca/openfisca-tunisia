documentation: |-
  Grille n° 1 des salaires mensuels de base que l'avenant n° 2 à la convention collective nationale
  des assurances (agréé par arrêté du 9 novembre 1990) fait entrer en vigueur le 1er juin 1990, par
  échelle et par échelon.

  L'avenant n° 2 publie deux grilles à la même date d'effet, et un paramètre n'a qu'une valeur par
  date : la seconde grille a donc son propre nœud. La grille n° 1 « entre en vigueur à compter du
  1er juin 1990 et s'applique aux entreprises ayant appliqué l'avenant n° 1 signé le 9 mars 1989 ».
  La grille n° 2 s'applique aux entreprises ayant servi à leur personnel les augmentations prévues
  par les circulaires du Premier ministre n° 31 et n° 84 des 1er avril et 9 octobre 1988 et par le
  décret n° 88-1889 du 10 novembre 1988 ; elle est la valeur de `salaire_base_avant_1993` au
  1er juin 1990, parce que les grilles de 1991 et de 1992 la prolongent.

  Cette série ne porte qu'une date, le 1er juin 1990, et cesse le 1er juin 1991 : la grille n° 3 de
  l'avenant, qui prend effet ce jour-là, s'applique à toutes les entreprises. Chaque case porte une
  valeur vide au 1er juin 1991 ; la suite se lit dans `salaire_base_avant_1993`.

  Source : JORT n° 74 du 16 novembre 1990, édition arabe, p. 1729 (numéro de page déduit de l'ordre
  des pages du fascicule) ; édition française, p. 1719. 22 lignes — `echelle_1` à `echelle_21`, et
  `echelle_exceptionnelle` pour la ligne « Exceptionnel », entre l'échelle 3 et l'échelle 4 — et
  12 échelons : 264 cases, toutes lues. Échelle 16, échelon 12 : les deux éditions divergent ; la
  valeur de l'édition française, manuscrite par-dessus l'imprimé, est retenue (407,658), et
  l'édition arabe imprime 14,175 de moins (393,483).

  Unité : dinars courants par mois, pour une durée du travail de 40 heures par semaine, soit 2 080
  heures par an.

  Ce que le salaire comprend : c'est le salaire mensuel de la grille, hors indemnités et primes
  servies en sus. Une note de bas de grille en exclut l'indemnité complémentaire provisoire des
  décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982, que les grilles comprennent depuis
  le 1er juin 1993 : cette grille ne se compare pas à `salaire_base` sans cette réserve.
