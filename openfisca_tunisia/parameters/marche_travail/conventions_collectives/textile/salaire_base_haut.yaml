documentation: |-
  Salaire horaire de base de la position « catégorie IV-2, échelon 0 » de la grille des agents payés à l'heure
  (personnel d'exécution) annexée à la convention collective du textile. C'est le salaire d'entrée de la catégorie la plus élevée de cette grille, à l'échelon de la confirmation, et non le dernier échelon de cette catégorie.

  Unité : dinars courants par heure de travail. La grille horaire ne dit pas à quel régime de durée
  hebdomadaire du travail elle se rapporte.

  Ce que le salaire comprend : c'est un salaire de base. Il comprend l'indemnité complémentaire
  provisoire des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982, que l'avenant n° 5
  intègre aux salaires de base à compter du 1er mai 1994 (JORT n° 78 du 4 octobre 1994, p. 1637).
  Il ne comprend pas les indemnités de la convention, qui s'y ajoutent.

  La série commence au 1er mai 1994. Les grilles de 1990 à 1992 ne comprennent pas l'indemnité
  complémentaire provisoire et ne mesurent donc pas la même grandeur, et celle de 1993 n'est pas
  relevée : rien d'antérieur n'est versé ici. De l'avenant n° 5 à l'avenant n° 18, tous les avenants ont été lus, sans numéro manquant.

  Ce salaire n'a pas été relevé dans les grilles à effet de 1999 à 2001, de 2003 à 2007 et du 1er septembre 2015 : la série est sans valeur sur ces périodes.

  Une valeur vaut de sa date d'effet jusqu'à la veille de la date suivante. Chaque date est la date
  d'effet que la grille énonce elle-même ; elle est souvent antérieure à la signature de l'avenant et
  à l'arrêté qui l'agrée. Une date sans valeur est une date à laquelle une grille prend effet sans
  que ce salaire ait été relevé, ou à laquelle le salaire change sans qu'aucun texte en publie le
  montant : la valeur précédente n'y vaut plus.
