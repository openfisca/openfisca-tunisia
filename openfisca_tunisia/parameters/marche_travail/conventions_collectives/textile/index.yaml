  reference:
  - title: "Arrêté du ministre des affaires sociales du 29 août 1974, portant agrément de la convention collective nationale du textile"
    href: https://www.pist.tn/jort/1974/1974F/Jo05574.pdf
    note: "JORT n° 55 du 30 août 1974, p. 1936."
  - title: "Convention collective nationale du textile, signée le 26 juillet 1974"
    href: https://www.pist.tn/jort/1974/1974F/Jo07674.pdf
    note: "JORT n° 76 des 10 et 12 décembre 1974, pp. 2715-2733 ; grille horaire du personnel d'exécution p. 2729."
documentation: |-
  Convention collective nationale du textile, signée le 26 juillet 1974 et agréée par arrêté du
  ministre des affaires sociales du 29 août 1974 (JORT n° 55 du 30 août 1974, p. 1936) ; son texte
  paraît au JORT n° 76 des 10 et 12 décembre 1974, pp. 2715-2733. Les avenants l'intitulent
  « convention collective sectorielle du textile » à partir de l'avenant n° 9, agréé en 2006.

  Depuis l'avenant n° 6, agréé le 24 juillet 1996, les avenants et leurs grilles ne paraissent que
  dans l'édition arabe du journal.

  La date d'effet de la convention de 1974 n'est pas relevée ici.
