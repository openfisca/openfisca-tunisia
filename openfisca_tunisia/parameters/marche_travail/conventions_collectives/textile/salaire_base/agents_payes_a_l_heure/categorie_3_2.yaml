        note: "JORT n° 49 du 16 avril 2024, édition arabe, p. 3509. La grille des agents payés à l'heure prend effet le 1er janvier 2025 ; catégorie III-2, échelon 18 : 3,959 dinars par heure. Les salaires de la grille comprennent l'indemnité complémentaire provisoire. Valeur lue à l'image."
      2026-01-01:
      - title: "Avenant n° 18 à la convention collective sectorielle du textile, agréé par arrêté du 8 avril 2024"
        href: https://www.pist.tn/jort/2024/2024A/Ja0492024.pdf
        note: "JORT n° 49 du 16 avril 2024, édition arabe, p. 3511. La grille des agents payés à l'heure prend effet le 1er janvier 2026 ; catégorie III-2, échelon 18 : 4,236 dinars par heure. Les salaires de la grille comprennent l'indemnité complémentaire provisoire. Valeur lue à l'image. C'est la dernière grille de l'avenant n° 18. Le décret n° 2026-68 du 30 avril 2026 (JORT n° 44 du 30 avril 2026, pp. 838-839) relève de 5 %, à compter du 1er janvier 2026, les salaires de base des dernières grilles annexées aux conventions collectives sectorielles ; aucun texte ne publie de grille du textile qui en résulte. La valeur est celle de la grille de l'avenant."
  documentation: |-
    Salaire horaire de base de la catégorie III-2, échelon 18, de la grille des
    agents payés à l'heure (personnel d'exécution) annexée à la convention collective du textile.

    Unité : dinars courants par heure de travail. La grille ne dit pas à quel régime de durée
    hebdomadaire du travail elle se rapporte.

    Ce que le salaire comprend : c'est un salaire de base. Il comprend l'indemnité complémentaire
    provisoire des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982, que l'avenant n° 5
    intègre aux salaires de base à compter du 1er mai 1994 (JORT n° 78 du 4 octobre 1994, p. 1637).
    Il ne comprend pas les indemnités de la convention, qui s'y ajoutent.

    La série commence au 1er mai 1999, date d'effet de la première grille qui porte cet échelon
    (avenant n° 7) : les grilles du 1er mai 1994 au 1er mai 1998 s'arrêtent à l'échelon 16.

    La dernière valeur est celle de la grille du 1er janvier 2026, la dernière que porte l'avenant
    n° 18.

    Une valeur vaut de sa date d'effet jusqu'à la veille de la date suivante. Chaque date est la date
    d'effet que la grille énonce elle-même ; elle est souvent antérieure à la signature de l'avenant et
    à l'arrêté qui l'agrée. Une date sans valeur est une date à laquelle le salaire change sans qu'aucun
    texte en publie le montant : la valeur précédente n'y vaut plus.
