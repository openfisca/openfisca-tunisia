  Deuxième catégorie de la grille des agents payés à l'heure. Échelons versés : tous, de l'échelon 0 à l'échelon 16 depuis la grille du
  1er mai 1994, et de l'échelon 17 à l'échelon 20 depuis celle du 1er mai 1999, la première qui les
  porte.
