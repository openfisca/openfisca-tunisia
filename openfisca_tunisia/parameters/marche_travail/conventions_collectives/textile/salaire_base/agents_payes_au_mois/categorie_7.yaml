  documentation: |-
    Salaire mensuel de base de la catégorie 7, échelon 18, de la grille des
    agents payés au mois annexée à la convention collective du textile.

    Unité : dinars courants par mois.

    Ce que le salaire comprend : c'est un salaire de base. Il comprend l'indemnité complémentaire
    provisoire des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982, que l'avenant n° 5
    intègre aux salaires de base à compter du 1er mai 1994 (JORT n° 78 du 4 octobre 1994, p. 1637).
    Il ne comprend pas les indemnités de la convention, qui s'y ajoutent.

    La série commence au 1er mai 1999, date d'effet de la première grille qui porte cet échelon
    (avenant n° 7) : les grilles du 1er mai 1994 au 1er mai 1998 s'arrêtent à l'échelon 16.

    La dernière valeur est celle de la grille du 1er janvier 2026, la dernière que porte l'avenant
    n° 18.

    Une valeur vaut de sa date d'effet jusqu'à la veille de la date suivante. Chaque date est la date
    d'effet que la grille énonce elle-même ; elle est souvent antérieure à la signature de l'avenant et
    à l'arrêté qui l'agrée. Une date sans valeur est une date à laquelle la valeur précédente ne vaut
    plus : ici, la case de la grille publiée est illisible sur le fascicule (grilles du 1er mai 2002, du 1er mai 2003, du 1er mai 2004).
    La grille fixe bien un salaire, mais il n'a pas pu être lu : aucune valeur n'est déduite ni reportée.
