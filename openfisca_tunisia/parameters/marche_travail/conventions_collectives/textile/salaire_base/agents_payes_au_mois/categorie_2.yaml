documentation: |-
  Catégorie 2 de la grille des agents payés au mois, qui compte dix-huit lignes. Colonnes versées : toutes, la
  colonne de stage et les échelons 1 à 16 depuis la grille du 1er mai 1994, les échelons 17 à 20 depuis
  celle du 1er mai 1999, la première qui les porte.
  Cases illisibles sur le fascicule, portées sans valeur à leur date, sans valeur déduite ni reportée :
  - grille du 1er mai 1999 : toute la ligne ;
  - grille du 1er mai 2000 : stage, échelon 1, échelon 2, échelon 3, échelon 4, échelon 5, échelon 6, échelon 7, échelon 8, échelon 9, échelon 10, échelon 11, échelon 12, échelon 13, échelon 14, échelon 15, échelon 16, échelon 17, échelon 18 ;
  - grille du 1er mai 2002 : échelon 18 ;
  - grille du 1er mai 2003 : échelon 18 ;
  - grille du 1er mai 2004 : échelon 18.
