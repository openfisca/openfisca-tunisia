        href: https://www.pist.tn/jort/2024/2024A/Ja0492024.pdf
        note: "JORT n° 49 du 16 avril 2024, édition arabe, p. 3512. La grille des agents payés au mois prend effet le 1er janvier 2026 ; catégorie 16, échelon 13 : 1 399,894 dinars par mois. Les salaires de la grille comprennent l'indemnité complémentaire provisoire. Valeur lue à l'image. C'est la dernière grille de l'avenant n° 18. Le décret n° 2026-68 du 30 avril 2026 (JORT n° 44 du 30 avril 2026, pp. 838-839) relève de 5 %, à compter du 1er janvier 2026, les salaires de base des dernières grilles annexées aux conventions collectives sectorielles ; aucun texte ne publie de grille du textile qui en résulte. La valeur est celle de la grille de l'avenant."
  documentation: |-
    Salaire mensuel de base de la catégorie 16, échelon 13, de la grille des
    agents payés au mois annexée à la convention collective du textile.

    Unité : dinars courants par mois.

    Ce que le salaire comprend : c'est un salaire de base. Il comprend l'indemnité complémentaire
    provisoire des décrets n° 81-437 du 7 avril 1981 et n° 82-501 du 16 mars 1982, que l'avenant n° 5
    intègre aux salaires de base à compter du 1er mai 1994 (JORT n° 78 du 4 octobre 1994, p. 1637).
    Il ne comprend pas les indemnités de la convention, qui s'y ajoutent.

    La série commence au 1er mai 1994 : les grilles antérieures ne mesurent pas la même grandeur ou
    ne sont pas relevées.

    La dernière valeur est celle de la grille du 1er janvier 2026, la dernière que porte l'avenant
    n° 18.

    Une valeur vaut de sa date d'effet jusqu'à la veille de la date suivante. Chaque date est la date
    d'effet que la grille énonce elle-même ; elle est souvent antérieure à la signature de l'avenant et
    à l'arrêté qui l'agrée. Une date sans valeur est une date à laquelle le salaire change sans qu'aucun
    texte en publie le montant : la valeur précédente n'y vaut plus.
