description: "Dommages-intérêts maximaux du licenciement pour cause réelle et sérieuse sans respect des procédures, en mois de salaire"
values:
  1994-03-01:
    value: 4
metadata:
  unit: month
  short_label: "Vice de procédure, maximum en mois de salaire"
  reference:
    1994-03-01:
    - title: "Loi n° 94-29 du 21 février 1994, portant modification de certaines dispositions du code du travail, article 1er (article 23 bis du code)"
      href: https://www.pist.tn/jort/1994/1994F/Jo01594.pdf
      note: "JORT n° 15 du 22 février 1994, p. 319. Article 23 bis, deuxième alinéa : « Toutefois, dans le cas où il s'avère que le licenciement a eu lieu pour une cause réelle et sérieuse mais sans respect des procédures légales ou conventionnelles, le montant des dômmages-intérêts varie entre le salaire d'un mois et celui de quatre mois. » Date d'effet : la loi ne porte pas de clause d'entrée en vigueur ; elle est exécutoire cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 24 février 1994 (mention de la dernière page, lue à l'image). Édition française lue sur la couche texte."
