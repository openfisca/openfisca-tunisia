description: "Convention collective cadre des activités non agricoles : jours fériés"
metadata:
  short_label: "Convention collective cadre"
  order:
  - jours_feries
  - majoration_jour_ferie_travaille
documentation: |-
  Avantages que la convention collective cadre, signée le 20 mars 1973 et agréée par l'arrêté du ministre des
  affaires sociales du 29 mai 1973, accorde en sus de la loi en matière de jours fériés, avec ses avenants n° 1
  (17 novembre 1984) et n° 2 (15 octobre 1992). L'avenant n° 3 (20 avril 2004) ne modifie pas l'article 29.

  Ces valeurs ne valent que pour les employeurs et les salariés couverts par la convention ; une convention de
  branche peut prévoir davantage.
