description: "Durée hebdomadaire jusqu'à laquelle la durée du travail peut être réduite dans les activités non agricoles"
values:
  1966-05-01:
    value: 40
  1996-07-31:
    value: 40
metadata:
  unit: heure
  short_label: "Plancher de réduction de la durée hebdomadaire"
  reference:
    1966-05-01:
    - title: "Code du travail promulgué par la loi n° 66-27 du 30 avril 1966, article 80"
      href: https://www.pist.tn/jort/1966/1966F/Jo02166.pdf
      note: "JORT n° 21 des 10-13 mai 1966, p. 760. Article 80 : « Dans certaines branches d'activités visées à l'article précédent, la durée du travail peut être ramenée par décret à quarante heures par semaine ou à une limitation équivalente établie sur une période du temps autre que la semaine sans toutefois que la durée de cette période puisse dépasser une année. Aucune diminution dans le niveau de vie des travailleurs ne peut résulter de l'application des décrets pris en application du présent article. » Date d'effet : « Ce dernier entrera en vigueur le 1er mai 1966 » (loi n° 66-27, article premier, JORT n° 20 des 3-6 mai 1966, p. 716) ; la date, antérieure à la publication du code, est reprise telle quelle. Édition française lue à l'image."
    1996-07-31:
    - title: "Loi n° 96-62 du 15 juillet 1996, portant modification de certaines dispositions du code du travail, article premier : article 79 (nouveau) du code"
      href: https://www.pist.tn/jort/1996/1996F/Jo05996.pdf
      note: "JORT n° 59 du 23 juillet 1996, p. 1582. Article 79 (nouveau) : « La durée du travail effectif ne peut excéder 48 heures par semaine ou une limitation équivalente établie sur une période de temps autre que la semaine sans que la durée de cette période ne puisse être supérieure à une année. Cette durée peut être réduite sans qu'elle puisse être inférieure à 40 heures par semaine ou une limitation équivalente établie sur une période de temps autre que la semaine et ne dépassant pas une année et ce par les conventions collectives ou par des textes réglementaires, pris après consultation des organisations syndicales des employeurs et des travailleurs. » L'article 5 de la loi abroge les articles 80 et 81 du code (p. 1588). Date d'effet : la loi n'en fixe pas ; le JORT n° 59 a été déposé au siège du gouvernorat de Tunis le 26 juillet 1996 (mention de la p. 1599) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 31 juillet 1996. Édition française lue sur la couche texte, mise en page contrôlée à l'image."
documentation: |-
  De 1966 à 1996, la durée peut être ramenée à quarante heures par décret, dans certaines branches. Depuis le
  31 juillet 1996, elle peut être réduite par les conventions collectives ou par des textes réglementaires, sans
  descendre au-dessous de quarante heures.
