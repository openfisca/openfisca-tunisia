documentation: |-
  Durées légales du travail : régime normal des activités non agricoles (articles 79 à 89 du code), plafond des
  heures supplémentaires (article 93), activités agricoles (article 88) et travail à temps partiel (article 94-2,
  depuis le 31 juillet 1996).
