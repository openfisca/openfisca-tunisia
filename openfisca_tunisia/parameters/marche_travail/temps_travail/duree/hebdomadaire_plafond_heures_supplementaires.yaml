description: "Durée hebdomadaire du travail que les heures supplémentaires et les récupérations ne peuvent dépasser"
values:
  1966-05-01:
    value: 60
metadata:
  unit: heure
  short_label: "Plafond hebdomadaire, heures supplémentaires comprises"
  reference:
    1966-05-01:
    - title: "Code du travail promulgué par la loi n° 66-27 du 30 avril 1966, article 93"
      href: https://www.pist.tn/jort/1966/1966F/Jo02166.pdf
      note: "JORT n° 21 des 10-13 mai 1966, p. 761. Article 93 : « L'exécution d'heures supplémentaires ou la récupération d'heures perdues ne peuvent avoir pour effet de porter à plus de soixante heures, non comprises les heures de dérogation permanente, la durée hebdomadaire du travail, sauf en cas de travaux urgents dont l'exécution immédiate est nécessaire pour prévenir des accidents imminents ou organiser des mesures de sauvetage. » L'article premier de la loi n° 96-62 du 15 juillet 1996, qui énumère les articles du code qu'elle modifie (JORT n° 59 du 23 juillet 1996, p. 1579), ne cite pas cet article. Date d'effet : « Ce dernier entrera en vigueur le 1er mai 1966 » (loi n° 66-27, article premier, JORT n° 20 des 3-6 mai 1966, p. 716) ; la date, antérieure à la publication du code, est reprise telle quelle. Édition française lue à l'image."
documentation: |-
  Plafond de la durée hebdomadaire du travail, heures supplémentaires et heures récupérées comprises, hors heures
  de dérogation permanente et sauf travaux urgents de sauvetage.
