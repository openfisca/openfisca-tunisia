description: "Durée hebdomadaire maximale de présence à laquelle un arrêté peut porter la durée de présence"
values:
  1996-07-31:
    value: 64
metadata:
  unit: heure
  short_label: "Durée hebdomadaire maximale de présence"
  reference:
    1996-07-31:
    - title: "Loi n° 96-62 du 15 juillet 1996, portant modification de certaines dispositions du code du travail, article premier : article 82 (nouveau) du code"
      href: https://www.pist.tn/jort/1996/1996F/Jo05996.pdf
      note: "JORT n° 59 du 23 juillet 1996, p. 1582. Article 82 (nouveau) : « La durée hebdomadaire de présence fixée conformément aux dispositions de l'article 79 du présent code peut être portée, pour certaines entreprises ou certaines catégories du personnel, à 64 heures au maximum afin de tenir compte de la perte de temps résultant de l'interruption du travail ou de la nature du travail et ce par Arrêté du ministre chargé des Affaires Sociales. » L'article 82 de 1966 permettait déjà, par arrêté, de porter la durée hebdomadaire de présence « à un chiffre supérieur à quarante-huit heures », sans plafond (p. 760). Date d'effet : la loi n'en fixe pas ; le JORT n° 59 a été déposé au siège du gouvernorat de Tunis le 26 juillet 1996 (mention de la p. 1599) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 31 juillet 1996. Édition française lue sur la couche texte, mise en page contrôlée à l'image."
documentation: |-
  Pour tenir compte des temps d'inaction, un arrêté du ministre chargé des affaires sociales peut porter la durée
  hebdomadaire de présence de certaines entreprises ou catégories de personnel au-delà de la durée du travail
  effectif. Le plafond n'existe que depuis le 31 juillet 1996.
