documentation: |-
  Jours fériés payés de l'article 445 du code (livre VII, chapitre XX) et règle de paiement du jour férié
  travaillé (article 109). Le chômage d'un jour férié ne réduit pas le salaire mensuel, et les salariés payés à
  l'heure ou à la tâche reçoivent une indemnité égale au salaire perdu (article 108).
