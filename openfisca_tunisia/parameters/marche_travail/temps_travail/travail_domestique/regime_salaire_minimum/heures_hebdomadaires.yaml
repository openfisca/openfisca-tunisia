description: "Régime horaire hebdomadaire auquel se rapporte le salaire minimum garanti du travailleur domestique"
values:
  2022-01-30:
    value: 48
metadata:
  unit: heure
  short_label: "Régime du salaire minimum, heures hebdomadaires"
  reference:
    2022-01-30:
    - title: "Loi n° 2021-37 du 16 juillet 2021, relative à la réglementation du travail domestique, article 11"
      href: https://www.pist.tn/jort/2021/2021F/Jo0682021.pdf
      note: "JORT n° 68 du 30 juillet 2021, p. 2007. Article 11 : « Le salaire de la travailleuse ou du travailleur domestique est payé en espèce ou par tout autre mode de paiement adopté. Il ne peut être inférieur au salaire minimum garanti applicable dans les différents secteurs, et ce, au régime de 48 heures de travail par semaine, qu’il soit payé mensuellement ou à l’heure. » Date d'effet : article 29, « Les dispositions de la présente loi entrent en vigueur dans un délai de six mois à compter de sa publication au Journal officiel de la République tunisienne » (p. 2010) ; le JORT n° 68 est daté du 30 juillet 2021 et déposé au siège du gouvernorat de Tunis le même jour ; six mois à compter du 30 juillet 2021 : 30 janvier 2022, date retenue (le 31 janvier 2022 si le jour de la publication n'est pas compté). Édition française lue sur la couche texte."
