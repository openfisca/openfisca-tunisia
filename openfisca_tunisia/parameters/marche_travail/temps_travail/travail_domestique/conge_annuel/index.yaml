documentation: |-
  Repos annuel du travailleur domestique qui travaille d'une manière continue auprès d'un seul employeur
  (article 14) : un jour par mois de travail effectif, 15 jours au plus dont 12 ouvrés ; un jour et demi par mois, 22 jours
  au plus dont 18 ouvrés, de 18 à 20 ans, âge apprécié au 31 décembre de chaque année. La durée du repos est fixée dans
  le contrat. Le repos ne se déduit pas des jours fériés payés, dont la jouissance peut être reportée par accord.
  La loi ne fixe pas de repos pour les moins de 18 ans : elle interdit l'emploi des enfants, sans en chiffrer l'âge
  (article 5).
