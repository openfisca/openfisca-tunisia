documentation: |-
  Congés payés accordés au travailleur domestique qui travaille d'une manière continue auprès d'un seul employeur,
  « sauf accord contraire des deux parties », sur production des justificatifs de l'événement (article 14).
  Le congé de paternité est accordé « conformément à la législation en vigueur » (article 15) : il renvoie à
  `conge_paternite/` et n'a pas de feuille ici.
