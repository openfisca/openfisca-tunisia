description: "Taux de majoration des heures de travail agricole effectuées au-delà de la durée journalière"
values:
  1966-05-01:
    value: 0.25
metadata:
  unit: /1
  short_label: "Majoration, agriculture"
  reference:
    1966-05-01:
    - title: "Code du travail promulgué par la loi n° 66-27 du 30 avril 1966, article 94"
      href: https://www.pist.tn/jort/1966/1966F/Jo02166.pdf
      note: "JORT n° 21 des 10-13 mai 1966, p. 761. Sous-section II « Dans les activités agricoles ». Article 94 : « Les heures de travail effectuées à la demande de l'employeur et pour les besoins de l'exploitation, au delà de la durée journalière définie en application de l'article 88, sont payées au salaire normal majorées de vingt-cinq pour cent (25 %). » L'article premier de la loi n° 96-62 du 15 juillet 1996, qui énumère les articles du code qu'elle modifie (JORT n° 59 du 23 juillet 1996, p. 1579), ne cite pas cet article. Date d'effet : « Ce dernier entrera en vigueur le 1er mai 1966 » (loi n° 66-27, article premier, JORT n° 20 des 3-6 mai 1966, p. 716) ; la date, antérieure à la publication du code, est reprise telle quelle. Édition française lue à l'image."
documentation: |-
  Majoration du salaire normal pour les heures faites, à la demande de l'employeur, au-delà de la durée
  journalière fixée en application de l'article 88.
