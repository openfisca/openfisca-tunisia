description: "Taux minimal de majoration des premières heures supplémentaires de la semaine dans le régime de 40 heures"
values:
  1966-05-01:
    value: 0.25
  1996-07-31:
    value: null
metadata:
  unit: /1
  short_label: "Majoration, régime de 40 heures, premières heures"
  reference:
    1966-05-01:
    - title: "Code du travail promulgué par la loi n° 66-27 du 30 avril 1966, article 90"
      href: https://www.pist.tn/jort/1966/1966F/Jo02166.pdf
      note: "JORT n° 21 des 10-13 mai 1966, p. 761. Article 90, deuxième alinéa : « Dans les activités assujetties au régime de la semaine de quarante heures, les heures supplémentaires effectuées au delà de cette durée donnent lieu à une majoration de salaires, qui ne peut être inférieure à vingt-cinq pour cent (25 %) du salaire horaire pour chacune des huit premières heures supplémentaires et à cinquante pour cent (50 %) pour chacune des suivantes effectuées dans le courant d'une même semaine. » Date d'effet : « Ce dernier entrera en vigueur le 1er mai 1966 » (loi n° 66-27, article premier, JORT n° 20 des 3-6 mai 1966, p. 716) ; la date, antérieure à la publication du code, est reprise telle quelle. Édition française lue à l'image."
    1996-07-31:
    - title: "Loi n° 96-62 du 15 juillet 1996, portant modification de certaines dispositions du code du travail, article premier : article 90 (nouveau) du code"
      href: https://www.pist.tn/jort/1996/1996F/Jo05996.pdf
      note: "JORT n° 59 du 23 juillet 1996, p. 1583. Article 90 (nouveau) : « Sont considérées comme heures supplémentaires les heures de travail effectuées au delà de la durée hebdomadaire normale. Ces heures sont rémunérées par référence au salaire de base horaire majoré selon les taux suivants : - Pour le régime de travail à plein temps de 48 heures par semaine: 75% - Pour les régimes de travail à plein temps inférieurs à 48 heures par semaine : 25% jusqu'à 48 heures et 50% au delà de cette durée. - Pour les régimes de travail à temps partiel : 50% » La règle des huit premières heures disparaît ; les régimes inférieurs à 48 heures suivent désormais le nœud `regimes_inferieurs_48h`. Date d'effet : la loi n'en fixe pas ; le JORT n° 59 a été déposé au siège du gouvernorat de Tunis le 26 juillet 1996 (mention de la p. 1599) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 31 juillet 1996. Édition française lue sur la couche texte, mise en page contrôlée à l'image."
documentation: |-
  Taux plancher : le code dit que la majoration « ne peut être inférieure » à ce taux.
