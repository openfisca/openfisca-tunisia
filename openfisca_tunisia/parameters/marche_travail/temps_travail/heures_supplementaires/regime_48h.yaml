description: "Taux de majoration des heures supplémentaires dans le régime de 48 heures par semaine"
values:
  1966-05-01:
    value: 0.75
  1996-07-31:
    value: 0.75
metadata:
  unit: /1
  short_label: "Majoration, régime de 48 heures"
  reference:
    1966-05-01:
    - title: "Code du travail promulgué par la loi n° 66-27 du 30 avril 1966, article 90"
      href: https://www.pist.tn/jort/1966/1966F/Jo02166.pdf
      note: "JORT n° 21 des 10-13 mai 1966, p. 761. Sous-section I « Dans les activités non agricoles ». Article 90, premier alinéa : « Dans les activités assujetties au régime de la semaine de quarante-huit heures toute heure de travail effectuée au delà de cette durée doit être majorée de soixante-quinze pour cent (75 %). » Date d'effet : « Ce dernier entrera en vigueur le 1er mai 1966 » (loi n° 66-27, article premier, JORT n° 20 des 3-6 mai 1966, p. 716) ; la date, antérieure à la publication du code, est reprise telle quelle. Édition française lue à l'image."
    1996-07-31:
    - title: "Loi n° 96-62 du 15 juillet 1996, portant modification de certaines dispositions du code du travail, article premier : article 90 (nouveau) du code"
      href: https://www.pist.tn/jort/1996/1996F/Jo05996.pdf
      note: "JORT n° 59 du 23 juillet 1996, p. 1583. Article 90 (nouveau) : « Sont considérées comme heures supplémentaires les heures de travail effectuées au delà de la durée hebdomadaire normale. Ces heures sont rémunérées par référence au salaire de base horaire majoré selon les taux suivants : - Pour le régime de travail à plein temps de 48 heures par semaine: 75% - Pour les régimes de travail à plein temps inférieurs à 48 heures par semaine : 25% jusqu'à 48 heures et 50% au delà de cette durée. - Pour les régimes de travail à temps partiel : 50% » Date d'effet : la loi n'en fixe pas ; le JORT n° 59 a été déposé au siège du gouvernorat de Tunis le 26 juillet 1996 (mention de la p. 1599) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 31 juillet 1996. Édition française lue sur la couche texte, mise en page contrôlée à l'image."
documentation: |-
  Majoration de toute heure faite au-delà de 48 heures par semaine dans le régime de 48 heures. Le texte de 1966
  ne nomme pas l'assiette de la majoration ; depuis le 31 juillet 1996, elle s'applique au salaire de base horaire.
