description: "Plafond du congé annuel en jours ouvrables, salariés de 18 à 20 ans"
values:
  1966-05-01:
    value: 18
  1996-07-31:
    value: 18
metadata:
  unit: day
  short_label: "Plafond en jours ouvrables, 18 à 20 ans"
  reference:
    1966-05-01:
    - title: "Code du travail promulgué par la loi n° 66-27 du 30 avril 1966, article 113"
      href: https://www.pist.tn/jort/1966/1966F/Jo02166.pdf
      note: "JORT n° 21 des 10-13 mai 1966, p. 763. Article 113, deuxième alinéa, tel que publié : « […] pour les salariés de dix-huit à vingt-et-un ans au 31 mai de chaque année, à un jour et demi par mois de travail sans que la durée totale du congé exigible puisse excéder une période de vingt-deux jours soit dix-huit jours ouvrables. » La borne d'âge est corrigée par le rectificatif ci-dessous. Date d'effet : « Ce dernier entrera en vigueur le 1er mai 1966 » (loi n° 66-27, article premier, JORT n° 20 des 3-6 mai 1966, p. 716) ; la date, antérieure à la publication du code, est reprise telle quelle. Édition française lue à l'image."
    - title: "Code du travail, rectificatif au JORT n° 21 des 10 et 13 mai 1966, article 113, deuxième alinéa"
      href: https://www.pist.tn/jort/1966/1966F/Jo03766.pdf
      note: "JORT n° 37 des 30 août-2 septembre 1966, p. 1298. « Au lieu de : …. pour les salariés de dix huit à vingt et un ans au 31 mai de chaque année […] Lire : …. pour les salariés de dix huit à vingt ans au 31 mai de chaque année, à un jour et demi par mois de travail sans que la durée totale du congé exigible puisse excéder une période de vingt deux jours soit dix huit jours ouvrables. » Le rectificatif corrige le texte publié : il vaut depuis l'entrée en vigueur du code. Édition française lue à l'image."
    1996-07-31:
    - title: "Loi n° 96-62 du 15 juillet 1996, portant modification de certaines dispositions du code du travail, article premier : article 113 (nouveau) du code"
      href: https://www.pist.tn/jort/1996/1996F/Jo05996.pdf
      note: "JORT n° 59 du 23 juillet 1996, p. 1584. Article 113 (nouveau), troisième alinéa : « La durée du congé est également portée à un jour et demi par mois de travail pour les salariés âgés de dix huit à vingt ans au 31 décembre de chaque année sans que la durée totale du congé exigible puisse excéder vingt deux jours dont dix huit jours ouvrables. » L'âge s'apprécie désormais au 31 décembre, et non plus au 31 mai. Date d'effet : la loi n'en fixe pas ; le JORT n° 59 a été déposé au siège du gouvernorat de Tunis le 26 juillet 1996 (mention de la p. 1599) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 31 juillet 1996. Édition française lue sur la couche texte, mise en page contrôlée à l'image."
documentation: |-
  Nombre maximal de jours ouvrables du congé annuel exigible, salariés de 18 à 20 ans.
