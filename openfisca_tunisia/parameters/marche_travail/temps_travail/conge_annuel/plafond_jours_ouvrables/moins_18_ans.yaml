description: "Plafond du congé annuel en jours ouvrables, salariés de moins de 18 ans"
values:
  1966-05-01:
    value: 24
  1996-07-31:
    value: 24
metadata:
  unit: day
  short_label: "Plafond en jours ouvrables, moins de 18 ans"
  reference:
    1966-05-01:
    - title: "Code du travail promulgué par la loi n° 66-27 du 30 avril 1966, article 113"
      href: https://www.pist.tn/jort/1966/1966F/Jo02166.pdf
      note: "JORT n° 21 des 10-13 mai 1966, p. 763. Article 113, deuxième alinéa : « La durée du congé fixée à l'alinéa précédent est portée pour les salariés de moins de dix huit ans au 31 mai de chaque année à deux jours par mois de travail, sans que la durée totale du congé exigible puisse excéder une période de trente jours comprenant vingt quatre jours ouvrables ; […] » Date d'effet : « Ce dernier entrera en vigueur le 1er mai 1966 » (loi n° 66-27, article premier, JORT n° 20 des 3-6 mai 1966, p. 716) ; la date, antérieure à la publication du code, est reprise telle quelle. Édition française lue à l'image."
    1996-07-31:
    - title: "Loi n° 96-62 du 15 juillet 1996, portant modification de certaines dispositions du code du travail, article premier : article 113 (nouveau) du code"
      href: https://www.pist.tn/jort/1996/1996F/Jo05996.pdf
      note: "JORT n° 59 du 23 juillet 1996, p. 1584. Article 113 (nouveau), deuxième alinéa : « La durée du congé fixée à l'alinéa précédent est portée pour les salariés de moins de dix huit ans au 31 décembre de chaque année à deux jours par mois de travail, sans que la durée totale du congé exigible puisse excéder une période de trente jours dont vingt quatre jours ouvrables. » L'âge s'apprécie désormais au 31 décembre, et non plus au 31 mai. Date d'effet : la loi n'en fixe pas ; le JORT n° 59 a été déposé au siège du gouvernorat de Tunis le 26 juillet 1996 (mention de la p. 1599) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 31 juillet 1996. Édition française lue sur la couche texte, mise en page contrôlée à l'image."
documentation: |-
  Nombre maximal de jours ouvrables du congé annuel exigible, salariés de moins de 18 ans.
