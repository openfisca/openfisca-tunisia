description: "Nombre de jours équivalant à un mois de travail effectif pour le calcul du congé annuel"
values:
  1966-05-01:
    value: 24
  1996-07-31:
    value: 26
metadata:
  unit: day
  short_label: "Mois de travail effectif, en jours"
  reference:
    1966-05-01:
    - title: "Code du travail promulgué par la loi n° 66-27 du 30 avril 1966, article 114"
      href: https://www.pist.tn/jort/1966/1966F/Jo02166.pdf
      note: "JORT n° 21 des 10-13 mai 1966, p. 763. Article 114 : « Sont assimilées à un mois de travail effectif, pour la détermination de la durée du congé annuel, les périodes équivalant à quatre semaines ou à vingt quatre jours de travail. » Date d'effet : « Ce dernier entrera en vigueur le 1er mai 1966 » (loi n° 66-27, article premier, JORT n° 20 des 3-6 mai 1966, p. 716) ; la date, antérieure à la publication du code, est reprise telle quelle. Édition française lue à l'image."
    1996-07-31:
    - title: "Loi n° 96-62 du 15 juillet 1996, portant modification de certaines dispositions du code du travail, article premier : article 114 (nouveau) du code"
      href: https://www.pist.tn/jort/1996/1996F/Jo05996.pdf
      note: "JORT n° 59 du 23 juillet 1996, p. 1584. Article 114 (nouveau) : « Sont considérées comme un mois de travail effectif, pour la détermination de la durée du congé annuel, les périodes équivalentes à vingt six jours ouvrables. » Date d'effet : la loi n'en fixe pas ; le JORT n° 59 a été déposé au siège du gouvernorat de Tunis le 26 juillet 1996 (mention de la p. 1599) ; exécutoire cinq jours après le dépôt, jour du dépôt non compté (loi n° 93-64, article 2), soit le 31 juillet 1996. Édition française lue sur la couche texte, mise en page contrôlée à l'image."
documentation: |-
  Jusqu'au 30 juillet 1996, est assimilée à un mois de travail effectif une période de quatre semaines ou de
  vingt-quatre jours de travail ; depuis le 31 juillet 1996, une période de vingt-six jours ouvrables.
