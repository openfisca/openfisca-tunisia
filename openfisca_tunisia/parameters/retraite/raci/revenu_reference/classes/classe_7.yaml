metadata:
  unit: smig
  reference:
    2003-05-01:
    - title: "Décret n° 2003-894 du 21 avril 2003, fixant les modalités d'application du régime de sécurité sociale des artistes, des créateurs et des intellectuels, article 5"
      href: "https://www.pist.tn/jort/2003/2003F/Jo0342003.pdf"
      note: "JORT n° 34 du 29 avril 2003, pp. 1291-1294. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, un jour franc après sa publication. Le coefficient multiplicateur du SMIG de la classe 7 est fixé à 10."
