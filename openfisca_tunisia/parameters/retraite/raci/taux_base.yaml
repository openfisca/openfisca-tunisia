description: Taux de la pension de vieillesse lorsque le stage de 40 trimestres est réalisé
values:
  2003-05-01:
    value: 0.3
metadata:
  unit: /1
  reference:
    2003-05-01:
    - title: "Décret n° 2003-894 du 21 avril 2003, fixant les modalités d'application du régime de sécurité sociale des artistes, des créateurs et des intellectuels, article 17"
      href: "https://www.pist.tn/jort/2003/2003F/Jo0342003.pdf"
      note: "JORT n° 34 du 29 avril 2003, pp. 1291-1294. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, un jour franc après sa publication. Le montant de la pension de vieillesse est fixé à 30 % du revenu moyen de référence en cas de réalisation de 40 trimestres de cotisations."
documentation: |-
  Le taux vient du décret : la loi renvoyait le revenu de référence à un texte
  d'application. Le paramètre commence donc le 1er mai 2003, et non avec la loi.
