description: Taux de la pension du conjoint survivant, en part de la pension du défunt
values:
  2003-01-02:
    value: 0.5
metadata:
  unit: /1
  reference:
    2003-01-02:
    - title: "Loi n° 2002-104 du 30 décembre 2002, relative au régime de sécurité sociale des artistes, des créateurs et des intellectuels, article 20"
      href: "https://www.pist.tn/jort/2002/2002F/Jo1062002.pdf"
      note: "JORT n° 106 du 31 décembre 2002, pp. 3187-3190. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, un jour franc après sa publication. Le montant de la pension de survivants est fixé à 50 % de la pension de vieillesse ou d'invalidité dont bénéficiait ou aurait dû bénéficier le défunt."
