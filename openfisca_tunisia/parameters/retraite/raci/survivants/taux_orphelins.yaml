description: Taux de la pension d'orphelins, en part de la pension du défunt
values:
  2003-01-05:
    value: 0.3
metadata:
  unit: /1
  reference:
    2003-01-05:
    - title: "Loi n° 2002-104 du 30 décembre 2002, relative au régime de sécurité sociale des artistes, des créateurs et des intellectuels, article 23"
      href: "https://www.pist.tn/jort/2002/2002F/Jo1062002.pdf"
      note: "JORT n° 106 du 31 décembre 2002, pp. 3187-3190. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 31 décembre 2002. Le taux de la pension d'orphelins est fixé à 30 % de la pension de vieillesse ou d'invalidité dont bénéficiait ou aurait dû bénéficier le défunt."
documentation: |-
  La pension d'orphelins est collective : elle est réduite à mesure que chaque orphelin
  cesse d'y avoir droit. Le cumul avec la pension du conjoint ne peut dépasser la pension
  du défunt, les pensions d'orphelins étant réduites temporairement au besoin.
