description: Âge avant lequel le remariage suspend la pension du conjoint survivant
values:
  2003-01-02:
    value: 55
metadata:
  unit: year
  reference:
    2003-01-02:
    - title: "Loi n° 2002-104 du 30 décembre 2002, relative au régime de sécurité sociale des artistes, des créateurs et des intellectuels, article 21"
      href: "https://www.pist.tn/jort/2002/2002F/Jo1062002.pdf"
      note: "JORT n° 106 du 31 décembre 2002, pp. 3187-3190. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, un jour franc après sa publication. Le paiement de la pension du conjoint survivant est suspendu lorsque l'intéressé se remarie sans avoir atteint l'âge de 55 ans ; il est rétabli, revalorisé, au décès du nouveau conjoint ou à la dissolution du mariage."
