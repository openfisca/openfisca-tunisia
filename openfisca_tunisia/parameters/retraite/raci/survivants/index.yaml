description: Pensions de survivants
documentation: |-
  Droits propres à la loi n° 2002-104. La pension est due si le mariage existe au moment du
  décès (article 19).

  Une phrase n'est pas versée, parce qu'elle ne se laisse pas lire sans interprétation.
  L'article 20, après avoir fixé la pension du conjoint à 50 %, ajoute : « Ce taux est majoré
  de 75 % de la pension de vieillesse ou d'invalidité en cas d'existence d'enfants bénéficiaires
  d'une pension. » Lue à la lettre, la majoration porterait le conjoint au-delà de la pension du
  défunt ; lue comme un taux porté à 75 %, elle jouerait en présence d'enfants, à l'inverse de
  la règle du régime non agricole. Aucune des deux lectures n'est versée.
