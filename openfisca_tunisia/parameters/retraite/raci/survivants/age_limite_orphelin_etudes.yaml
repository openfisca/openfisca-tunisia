description: Âge jusqu'auquel la pension d'orphelin est servie — en études secondaires, techniques ou professionnelles
values:
  2003-01-02:
    value: 21
metadata:
  unit: year
  reference:
    2003-01-02:
    - title: "Loi n° 2002-104 du 30 décembre 2002, relative au régime de sécurité sociale des artistes, des créateurs et des intellectuels, article 22"
      href: "https://www.pist.tn/jort/2002/2002F/Jo1062002.pdf"
      note: "JORT n° 106 du 31 décembre 2002, pp. 3187-3190. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, un jour franc après sa publication. La pension temporaire d'orphelin est servie jusqu'à 21 ans en études secondaires, techniques ou professionnelles."
    2007-07-02:
    - title: "Loi n° 2007-43 du 25 juin 2007, modifiant et complétant les lois régissant les pensions servies au titre des régimes de retraite, d'invalidité et de survivants dans les secteurs public et privé et des régimes spéciaux, article 3"
      href: "https://www.pist.tn/jort/2007/2007F/Jo0512007.pdf"
      note: "JORT n° 51 du 26 juin 2007, pp. 2198-2199. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 27 juin 2007. La loi récrit le droit de la fille sans ressources (cinquième tiret de l'article 22) ; elle ne change pas cet âge. Son article 4, qui supprime le mot « mineur », ne vise que la loi n° 81-6 et la loi n° 2002-32."
documentation: |-
  Une référence de 2007 est attachée sans valeur nouvelle : la loi n° 2007-43 réécrit
  l'article sans changer cet âge. La relecture du texte ne doit pas conclure à une lacune.
