description: Stage requis pour l'ouverture du droit à pension d'invalidité
values:
  2003-01-02:
    value: 20
metadata:
  unit: trimestre
  reference:
    2003-01-02:
    - title: "Loi n° 2002-104 du 30 décembre 2002, relative au régime de sécurité sociale des artistes, des créateurs et des intellectuels, article 15"
      href: "https://www.pist.tn/jort/2002/2002F/Jo1062002.pdf"
      note: "JORT n° 106 du 31 décembre 2002, pp. 3187-3190. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, un jour franc après sa publication. La période de cotisations effectives ne doit pas être inférieure à 20 trimestres ; aucune condition de stage n'est exigée de la victime d'un accident non professionnel."
