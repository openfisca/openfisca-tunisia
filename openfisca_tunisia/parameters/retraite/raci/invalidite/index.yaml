description: Pension d'invalidité du régime des artistes, des créateurs et des intellectuels
documentation: |-
  Ouverte à l'assuré atteint d'une incapacité d'origine non professionnelle réduisant des deux
  tiers au moins sa capacité de travail ou de gain, avant l'âge de la pension de vieillesse ;
  aucun stage n'est exigé en cas d'accident non professionnel (article 15). À 65 ans, la pension
  d'invalidité est remplacée par une pension de vieillesse.
