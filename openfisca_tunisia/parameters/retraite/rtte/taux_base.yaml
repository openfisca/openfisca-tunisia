description: Taux de la pension de vieillesse lorsque le stage de 120 mois est réalisé
values:
  1989-01-19:
    value: 0.3
metadata:
  unit: /1
  reference:
    1989-01-19:
    - title: "Décret n° 89-107 du 10 janvier 1989, étendant le régime de sécurité sociale aux travailleurs tunisiens à l'étranger, article 20"
      href: "https://www.pist.tn/jort/1989/1989F/Jo00489.pdf"
      note: "JORT n° 4 du 17 janvier 1989, pp. 98-99, lu à l'image, le fascicule n'ayant pas de couche texte. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, un jour franc après sa publication. Le taux de la pension de vieillesse est fixé à 30 % du revenu moyen de référence déterminé à l'article 19."
