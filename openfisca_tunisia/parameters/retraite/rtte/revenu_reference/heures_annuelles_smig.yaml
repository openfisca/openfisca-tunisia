description: Durée annuelle d'occupation à laquelle le SMIG est rapporté
values:
  1989-01-19:
    value: 2400
metadata:
  unit: heure
  reference:
    1989-01-19:
    - title: "Décret n° 89-107 du 10 janvier 1989, étendant le régime de sécurité sociale aux travailleurs tunisiens à l'étranger, articles 6 et 19"
      href: "https://www.pist.tn/jort/1989/1989F/Jo00489.pdf"
      note: "JORT n° 4 du 17 janvier 1989, pp. 98-99, lu à l'image, le fascicule n'ayant pas de couche texte. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, un jour franc après sa publication. Le revenu forfaitaire est déterminé par affectation au SMIG du régime de 48 heures, correspondant à une durée d'occupation de 2 400 heures par an, du coefficient de la classe de l'assuré."
