documentation: |-
  Quatre classes, entre lesquelles l'assuré choisit (article 6). Elles ne s'appliquent qu'au
  SMIG : leurs coefficients en sont des multiples, et en portent l'unité. Ce ne sont ni les
  classes des non-salariés ni celles des artistes.
