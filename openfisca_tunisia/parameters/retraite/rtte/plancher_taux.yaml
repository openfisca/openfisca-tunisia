description: Plancher de la pension, en part du SMIG annuel
values:
  1989-01-19:
    value: 0.5
metadata:
  unit: /1
  reference:
    1989-01-19:
    - title: "Décret n° 89-107 du 10 janvier 1989, étendant le régime de sécurité sociale aux travailleurs tunisiens à l'étranger, article 22"
      href: "https://www.pist.tn/jort/1989/1989F/Jo00489.pdf"
      note: "JORT n° 4 du 17 janvier 1989, pp. 98-99, lu à l'image, le fascicule n'ayant pas de couche texte. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, un jour franc après sa publication. Le montant annuel des pensions de vieillesse ou d'invalidité ne peut être inférieur à la moitié du SMIG rapporté à une durée d'occupation annuelle de 2 400 heures."
documentation: |-
  Propre au régime : la moitié du SMIG annuel, contre 30 % au régime des non-salariés et
  les deux tiers au régime non agricole.
