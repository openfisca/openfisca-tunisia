documentation: |-
  Régime institué par la loi n° 2002-32 du 12 mars 2002 pour cinq catégories : employés de
  maison ; personnes employées par l'État, les collectivités locales et les établissements
  publics administratifs sans autre couverture ; petits pêcheurs et petits armateurs ; petits
  agriculteurs ; artisans travaillant à la pièce. La loi fixe elle-même toutes les règles de
  pension ; elle ne procède pas par renvoi au régime non agricole.

  La loi ne porte pas de clause d'entrée en vigueur. Elle devient exécutoire le 21 mars 2002,
  cinq jours après le dépôt de son fascicule au siège du gouvernorat de Tunis, le 16 mars, le
  jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; et non le
  17 mars, un jour franc après sa publication, règle abandonnée en 1993. Son décret
  d'application, le décret n° 2002-916 du 22 avril 2002, devient exécutoire le 7 mai 2002.

  Deux bases distinctes, à ne pas confondre. Le taux de 30 % porte sur le salaire minimum du
  secteur, SMIG ou SMAG entier (articles 14 et 17). La majoration par trimestre et le plafond de
  80 % portent sur le salaire ayant servi au calcul des cotisations, qui n'en est que les deux
  tiers (article 7) ; les cotisations sont portées par
  `prelevements_sociaux.cotisations_sociales.secteur_prive.rtfr`.

  La revalorisation n'est pas versée, faute d'être une valeur : les pensions en cours sont
  revalorisées automatiquement à chaque hausse du SMIG ou du SMAG (article 32).

  La loi n° 2007-43 ne change aucune valeur du régime. Elle supprime le mot « mineur » en tête
  de l'article 25 et récrit le droit de la fille orpheline sans ressources, dont la pension est
  désormais définitivement suspendue si une condition fait défaut.
