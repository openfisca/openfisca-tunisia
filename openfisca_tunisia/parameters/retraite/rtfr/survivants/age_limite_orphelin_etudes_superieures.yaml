description: Âge jusqu'auquel la pension d'orphelin est servie — en études supérieures sans bourse universitaire
values:
  2002-03-21:
    value: 25
metadata:
  unit: year
  reference:
    2002-03-21:
    - title: "Loi n° 2002-32 du 12 mars 2002, relative au régime de sécurité sociale pour certaines catégories de travailleurs dans les secteurs agricole et non agricole, article 25"
      href: "https://www.pist.tn/jort/2002/2002F/Jo0222002.pdf"
      note: "JORT n° 22 du 15 mars 2002, pp. 603-606. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 16 mars 2002. La pension temporaire d'orphelin est servie jusqu'à 25 ans en études supérieures sans bourse universitaire."
    2007-07-02:
    - title: "Loi n° 2007-43 du 25 juin 2007, modifiant et complétant les lois régissant les pensions servies au titre des régimes de retraite, d'invalidité et de survivants dans les secteurs public et privé et des régimes spéciaux, articles 3 et 4"
      href: "https://www.pist.tn/jort/2007/2007F/Jo0512007.pdf"
      note: "JORT n° 51 du 26 juin 2007, pp. 2198-2199. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 27 juin 2007. La loi supprime le mot « mineur » en tête de l'article et récrit le droit de la fille sans ressources ; elle ne change pas cet âge."
documentation: |-
  Une référence de 2007 est attachée sans valeur nouvelle : la loi n° 2007-43 réécrit
  l'article sans changer cet âge. La relecture du texte ne doit pas conclure à une lacune.
