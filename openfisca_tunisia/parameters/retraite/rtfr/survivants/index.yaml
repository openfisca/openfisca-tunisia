description: Pensions de survivants
documentation: |-
  Droits propres à la loi n° 2002-32, qui ne renvoie pas au régime non agricole. La pension
  est due si le mariage existe au moment du décès (article 22). La fille orpheline sans
  ressources, ou dont l'entretien n'incombe pas à son époux, est servie sans limite d'âge ; la
  loi n° 2007-43 précise que ce paiement est définitivement suspendu dès qu'une condition fait
  défaut. Ces conditions ne sont pas des valeurs, et ne sont pas versées.
