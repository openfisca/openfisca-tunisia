description: Taux de la pension d'orphelins, en part de la pension du défunt
values:
  2002-03-17:
    value: 0.3
metadata:
  unit: /1
  reference:
    2002-03-17:
    - title: "Loi n° 2002-32 du 12 mars 2002, relative au régime de sécurité sociale pour certaines catégories de travailleurs dans les secteurs agricole et non agricole, article 26"
      href: "https://www.pist.tn/jort/2002/2002F/Jo0222002.pdf"
      note: "JORT n° 22 du 15 mars 2002, pp. 603-606. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, un jour franc après sa publication. Le taux de la pension d'orphelins est fixé à 30 % de la pension de vieillesse ou d'invalidité dont bénéficiait ou aurait dû bénéficier le défunt."
documentation: |-
  La pension d'orphelins est collective : elle est réduite à mesure que chaque orphelin
  cesse d'y avoir droit. Le cumul avec la pension du conjoint ne peut dépasser la pension
  du défunt, les pensions d'orphelins étant réduites temporairement au besoin.
