description: Âge avant lequel le remariage suspend la pension du conjoint survivant
values:
  2002-03-17:
    value: 55
metadata:
  unit: year
  reference:
    2002-03-17:
    - title: "Loi n° 2002-32 du 12 mars 2002, relative au régime de sécurité sociale pour certaines catégories de travailleurs dans les secteurs agricole et non agricole, article 24"
      href: "https://www.pist.tn/jort/2002/2002F/Jo0222002.pdf"
      note: "JORT n° 22 du 15 mars 2002, pp. 603-606. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, un jour franc après sa publication. Le paiement de la pension du conjoint survivant est suspendu lorsque l'intéressé se remarie sans avoir atteint l'âge de 55 ans ; il est rétabli, revalorisé, au décès du nouveau conjoint ou à la dissolution du mariage."
