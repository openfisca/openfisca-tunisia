description: Majoration par trimestre de cotisation au-delà de 120 mois
values:
  2002-03-17:
    value: 0.005
metadata:
  unit: /1
  reference:
    2002-03-17:
    - title: "Loi n° 2002-32 du 12 mars 2002, relative au régime de sécurité sociale pour certaines catégories de travailleurs dans les secteurs agricole et non agricole, article 14"
      href: "https://www.pist.tn/jort/2002/2002F/Jo0222002.pdf"
      note: "JORT n° 22 du 15 mars 2002, pp. 603-606. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, un jour franc après sa publication. Toute fraction de cotisation supérieure à 120 mois ouvre droit, par trimestre supplémentaire, à une majoration de 0,5 % du salaire ayant servi pour le calcul des cotisations."
documentation: |-
  La majoration porte sur le salaire de cotisation — les deux tiers du salaire minimum
  (article 7) —, et non sur le salaire minimum entier qui sert de base au taux.
