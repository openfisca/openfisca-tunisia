description: Majoration de la pension d'invalidité pour assistance d'une tierce personne
values:
  2002-03-21:
    value: 0.2
metadata:
  unit: /1
  reference:
    2002-03-21:
    - title: "Loi n° 2002-32 du 12 mars 2002, relative au régime de sécurité sociale pour certaines catégories de travailleurs dans les secteurs agricole et non agricole, article 18"
      href: "https://www.pist.tn/jort/2002/2002F/Jo0222002.pdf"
      note: "JORT n° 22 du 15 mars 2002, pp. 603-606. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 16 mars 2002. Lorsque l'invalide doit avoir recours à l'assistance d'une tierce personne pour les actes ordinaires de la vie, la pension est majorée d'une bonification de 20 % de son montant."
