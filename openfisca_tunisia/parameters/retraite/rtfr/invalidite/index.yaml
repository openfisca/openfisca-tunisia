description: Pension d'invalidité du régime des travailleurs à faibles revenus
documentation: |-
  Ouverte à l'assuré atteint d'une incapacité d'origine non professionnelle réduisant des deux
  tiers au moins sa capacité de travail ou de gain, qui n'a pas atteint l'âge de la pension de
  vieillesse (articles 15 et 16). La majoration et le plafond sont ceux de la pension de
  vieillesse (article 17).
