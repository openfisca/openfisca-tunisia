description: Majoration de la pension d'invalidité pour assistance d'une tierce personne
values:
  1974-01-01:
    value: 0.2
metadata:
  unit: /1
  reference:
    1974-01-01:
    - title: "Décret n° 74-499 du 27 avril 1974, relatif au régime de pension de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article 23"
      href: "https://www.pist.tn/jort/1974/1974F/Jo03074.pdf"
      note: "JORT n° 30, fascicule des 30 avril - 3-4 mai 1974, p. 917 : « Lorsque l'invalide est dans l'obligation d'avoir recours à l'assistance d'une tierce personne pour effectuer les actes ordinaires de la vie, la pension d'invalidité est majorée d'une bonification égale à 20 % de son montant. » L'article 24 conserve cette bonification à la conversion en pension de vieillesse. L'article 64 fixe l'effet du décret au 1er janvier 1974. Lu à l'image."
