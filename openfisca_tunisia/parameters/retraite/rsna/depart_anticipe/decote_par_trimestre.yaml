description: Décote appliquée à la pension par trimestre restant à courir avant l'âge de référence
values:
  1982-07-22:
    value: 0.005
metadata:
  unit: /1
  reference:
    1982-07-22:
    - title: "Décret n° 82-1030 du 15 juillet 1982, modifiant le décret n° 74-499 du 27 avril 1974, relatif au régime des pensions de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article premier (article 17, alinéa 3 nouveau)"
      href: "https://www.pist.tn/jort/1982/1982F/Jo05182.pdf"
      note: "JORT n° 51 des 20-23 juillet 1982, p. 1606. La pension du cas c) de l'article 15 bis est réduite d'un demi pour cent par trimestre restant à courir jusqu'à soixante ans. Le décret n'énonce pas de date d'effet : la date retenue est celle où il devient exécutoire, un jour franc après sa publication."
    2007-08-30:
    - title: "Décret n° 2007-2148 du 21 août 2007, modifiant et complétant le décret n° 74-499 du 27 avril 1974, relatif au régime de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article premier (article 17, paragraphe 3 nouveau)"
      href: "https://www.pist.tn/jort/2007/2007F/Jo0692007.pdf"
      note: "JORT n° 69 du 28 août 2007, pp. 3070-3071. Le décret n'énonce pas de date d'effet : la date retenue est celle où il devient exécutoire, un jour franc après sa publication. Le taux de la décote est inchangé ; ce qui change est le terme jusqu'auquel les trimestres se comptent, « l'âge normal » de la retraite remplaçant soixante ans."
documentation: |-
  Une valeur stable, un terme qui se déplace. Le taux est d'un demi pour cent par trimestre
  depuis 1982 et n'a jamais varié. Ce que le décret n° 2007-2148 modifie est le point
  d'arrivée du décompte : jusqu'en 2007, les trimestres se comptent jusqu'à soixante ans ;
  depuis, jusqu'à « l'âge normal » de la retraite, notion que le régime fait varier.

  Ce déplacement ne se date pas dans ce paramètre : il touche l'assiette du décompte et non
  le taux. Une référence de 2007 est attachée sans valeur nouvelle, pour que la relecture du
  texte ne conclue pas à une lacune.
