    2024-01-01:
    - title: "Arrêté du ministre des affaires sociales du 16 juillet 2024, relatif à la fixation du barème d'actualisation des salaires pris en compte dans le calcul des pensions de vieillesse, d'invalidité et de survivants, article premier"
      href: "https://www.pist.tn/jort/2024/2024F/Jo0902024.pdf"
      note: "JORT n° 90 du 19 juillet 2024, p. 1966. Barème de l'article premier ; l'article 2 l'applique aux pensions dont le droit est ouvert à compter du 1er janvier 2024. Le barème est une image insérée dans le fascicule : lu à l'image."
