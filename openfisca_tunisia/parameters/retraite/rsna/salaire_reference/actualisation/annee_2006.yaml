      href: "https://www.pist.tn/jort/2019/2019A/Ja0212019.pdf"
      note: "JORT n° 21 du 12 mars 2019, édition arabe, p. 783. Aucune édition française de ce numéro n'a été trouvée : l'adresse de l'édition française sur pist.tn sert le fascicule arabe. L'intitulé est traduit sur le modèle des arrêtés des autres années. Barème de l'article premier ; article 2 : « تنطبق الأحكام المنصوص عليها بالفصل الأول من هذا القرار بالنسبة للجرايات التي يفتتح الحق فيها ابتداء من أول جانفي 2019 », soit aux pensions dont le droit est ouvert à compter du 1er janvier 2019. Lu à l'image ; la couche texte concorde."
