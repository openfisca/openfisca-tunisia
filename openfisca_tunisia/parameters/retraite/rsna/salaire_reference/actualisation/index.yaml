documentation: |-
  Les salaires qui entrent dans le salaire moyen de référence sont actualisés selon un barème
  fixé chaque année par arrêté du ministre des affaires sociales, sur le fondement de
  l'article 18 du décret n° 74-499, dans sa rédaction issue du décret n° 94-1429. Chaque arrêté
  donne un coefficient par année de salaire, depuis 1961 jusqu'à l'année qui précède, dont le
  coefficient vaut 1. Il s'applique aux pensions dont le droit est ouvert à compter du
  1er janvier de l'année de l'arrêté ; le premier, du 17 novembre 1994, à compter du
  1er juillet 1994, date d'effet de la réforme.

  Chaque paramètre porte donc une année de salaire, et ses valeurs successives sont celles
  des arrêtés successifs : le coefficient des salaires de 1961 passe de 6,48469 dans le barème
  de 1994 à 24,91897 dans celui de 2024.

  Le barème n'est pas une simple chaîne. D'un arrêté à l'autre, le rapport entre les
  coefficients de deux années voisines reste en général le même, mais il change pour
  plusieurs années dans les arrêtés de 2004, de 2011, de 2013 et de 2017 : ces barèmes ont été
  recalculés. Les rapports de 2013 sont repris en 2014, en 2015 et en 2016. Celui de 2017
  rétablit, pour les salaires antérieurs à 2011, les rapports des barèmes de 2011 et de 2012,
  et modifie ceux des salaires de 2012 et de 2013 ; ses rapports sont repris ensuite. Les
  valeurs sont versées telles que publiées.

  Aucune édition française du Journal officiel n'a été trouvée pour l'arrêté de 2019 : sa
  référence renvoie à l'édition arabe, et son intitulé français est une traduction.

  Aucun arrêté n'a été identifié pour 2025 ni pour 2026, ni par son intitulé dans le
  répertoire des textes du Journal officiel, ni par une recherche en plein texte des
  fascicules de ces deux années ; ce n'est pas la preuve qu'il n'en existe pas, et celui de
  2026 peut n'être pas encore paru. Les valeurs du barème de 2024 sont conservées au-delà, ce
  que les textes ne disent pas expressément.
