description: Durée annuelle d'occupation à laquelle est rapporté le SMIG qui limite les salaires retenus pour le salaire moyen de référence
values:
  1974-01-01:
    value: 2400
metadata:
  unit: heure
  reference:
    1974-01-01:
    - title: "Décret n° 74-499 du 27 avril 1974, relatif au régime de pension de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article 18"
      href: "https://www.pist.tn/jort/1974/1974F/Jo03074.pdf"
      note: "JORT n° 30, fascicule des 30 avril - 3-4 mai 1974, p. 917 : « Les-dits salaires ne sont pris en compte pour une année déterminée que dans la limite de six fois le SMIG rapporté à une durée d'occupation annuelle de 2.400 heures. » L'article 64 fixe l'effet du décret au 1er janvier 1974. Lu à l'image."
    1990-09-23:
    - title: "Décret n° 90-1455 du 10 septembre 1990, amendant le décret n° 74-499 du 27 avril 1974, relatif au régime de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article 1er (article 18 nouveau)"
      href: "https://www.pist.tn/jort/1990/1990F/Jo06090.pdf"
      note: "JORT n° 60 du 21 septembre 1990, p. 1358. L'article 18 nouveau porte la période de référence à dix ans et maintient la limite de six fois le SMIG rapporté à 2 400 heures : valeur inchangée. Le décret n'énonce pas de date d'effet : exécutoire un jour franc après sa publication, soit le 23 septembre 1990."
    1994-07-01:
    - title: "Décret n° 94-1429 du 30 juin 1994, portant amendement du décret n° 74-499 du 27 avril 1974 relatif au régime de pensions de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article 1er (article 18 nouveau)"
      href: "https://www.pist.tn/jort/1994/1994F/Jo05294.pdf"
      note: "JORT n° 52 du 5 juillet 1994, pp. 1141-1142. L'article 18 nouveau, dont les périodes de référence courent à partir du 1er juillet 1994, reprend la limite de six fois le SMIG rapporté à 2 400 heures, en précisant qu'il s'agit du SMIG du régime de 48 heures : valeur inchangée."
documentation: |-
  Se lit avec `limite_multiple_smig` : la limite annuelle est six fois le SMIG horaire
  multiplié par 2 400 heures.
