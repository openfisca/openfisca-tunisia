documentation: |-
  Le salaire moyen de référence est l'assiette de la pension : les salaires soumis à
  cotisation perçus pendant une fenêtre qui précède l'ouverture du droit, actualisés
  puis divisés par un nombre de mois. Les salaires de chaque année n'y entrent que dans
  la limite de six fois le SMIG rapporté à 2 400 heures, limite inchangée depuis 1974.

  Trois rédactions des articles 18 et 19 du décret n° 74-499, et trois façons de
  l'écrire.

  1974 — les salaires des trois ou cinq dernières années, « selon que l'une ou l'autre
  de ces périodes de référence est plus avantageuse » pour l'assuré (art. 18), la
  moyenne se faisant sur 36 ou 60 mois (art. 19). Deux périodes, deux diviseurs et une
  règle de choix : `periode_courte_annees` et `diviseur_court_mois` d'un côté,
  `periode_longue_annees` et `diviseur_long_mois` de l'autre. Les mois retenus sont ceux
  qui sont écoulés au 1er janvier de l'année d'ouverture du droit.

  1990 — le décret n° 90-1455 porte la fenêtre à dix ans (`periode_annees`) en récrivant
  le seul article 18, et laisse l'article 19 inchangé, lequel continue de diviser par 36
  ou 60 mois. Le texte se contredit lui-même pendant près de quatre ans, et aucun texte
  publié au Journal officiel entre septembre 1990 et juin 1994 ne dit lequel des deux
  articles l'a emporté en pratique. Les paramètres versent ce que chaque article énonce,
  sans trancher.

  1994 — le décret n° 94-1429 abroge et remplace ensemble les articles 18 et 19, et
  fait suivre à la moyenne la durée de la fenêtre (`duree_mois`). La contradiction
  disparaît.
