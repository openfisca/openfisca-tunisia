description: Âge avant lequel le remariage suspend la pension du conjoint survivant
values:
  1990-09-23:
    value: 55
metadata:
  unit: year
  reference:
    1990-09-23:
    - title: "Décret n° 90-1455 du 10 septembre 1990, amendant le décret n° 74-499 du 27 avril 1974 relatif au régime de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article premier (article 32 nouveau)"
      href: "https://www.pist.tn/jort/1990/1990F/Jo06090.pdf"
      note: "JORT n° 60 du 21 septembre 1990, p. 1358 : « Le paiement de la pension du conjoint survivant est suspendu lorsque l'intéressé se remarie après le décès de son conjoint et sans avoir atteint l'âge de 55 ans. En cas de décès du nouveau conjoint ou dissolution du mariage, le service de la pension revalorisé le cas échéant, compte tenu des différentes modifications intervenues au cours de la période de suspension, est rétabli. Le cumul de pensions de conjoint survivant au titre de mariages successifs est interdit. Toutefois, au cas où le conjoint survivant ouvre droit à une nouvelle pension de survivant au titre du second mariage, seule la pension dont le montant est le plus élevé est servie. » Le décret ne porte pas de date d'effet (article 2 : clause d'exécution) : la date retenue est celle où il devient exécutoire, un jour franc après la publication au Journal officiel (article 3 nouveau du décret du 27 janvier 1883, rédaction du décret du 13 septembre 1956), soit le 23 septembre 1990."
documentation: |-
  Le paramètre commence en 1990 parce que la règle n'existait pas avant. Dans la rédaction
  d'origine du décret n° 74-499, « le remariage de la veuve entraîne suppression de la
  pension de réversion à partir du 1er jour du trimestre civil qui suit cet événement »
  (article 32, JORT n° 30, fascicule des 30 avril - 3-4 mai 1974, p. 917,
  https://www.pist.tn/jort/1974/1974F/Jo03074.pdf), quel que soit son âge, avec effet au
  1er janvier 1974 (article 64) : il n'y a pas d'âge à verser pour cette période.

  Depuis le 23 septembre 1990, le remariage avant 55 ans suspend le paiement au lieu de le
  supprimer, et un remariage à 55 ans ou plus laisse la pension servie. Le rétablissement
  au décès du nouveau conjoint ou à la dissolution du mariage, et l'interdiction de cumuler
  des pensions de conjoint survivant au titre de mariages successifs, sont des règles sans
  valeur datée : elles ne sont que décrites ici.
