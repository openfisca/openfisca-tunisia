description: Pensions de survivants du régime des salariés non agricoles
documentation: |-
  Droits dérivés du régime géré par la Caisse nationale de sécurité sociale, institué par
  le décret n° 74-499 et régi par ses articles 29 à 38.

  Les dates suivent la convention de l'arbre : celle du texte lorsqu'il énonce sa date
  d'effet, sinon celle où il devient exécutoire, un jour franc après sa publication au
  Journal officiel. Le décret n° 74-499 fait exception en énonçant lui-même, à son article
  64, un effet au 1er janvier 1974, antérieur à sa publication.

  Le remariage (article 32) : en 1974, il supprime la pension de réversion à partir du
  premier jour du trimestre civil suivant, quel que soit l'âge ; depuis le 23 septembre 1990
  (décret n° 90-1455), il en suspend le paiement s'il intervient avant 55 ans, âge versé dans
  `age_remariage_suspensif`. La pension est alors rétablie, revalorisée, au décès du nouveau
  conjoint ou à la dissolution du mariage, et les pensions de conjoint survivant au titre de
  mariages successifs ne se cumulent pas, la plus élevée étant servie.

  Deux règles de cette section ne sont pas versées, faute d'être des valeurs datées : le
  plafond de cumul de l'article 38, qui borne un total par un autre montant et non par un
  nombre ; et l'interdiction de cumuler une pension d'invalidité et une pension de
  survivant, que le décret n° 97-291 lève en abrogeant l'article 52.
