description: Taux de la pension d'orphelin, par orphelin
values:
  1974-01-01:
    value: 0.2
metadata:
  unit: /1
  reference:
    1974-01-01:
    - title: "Arrêté du ministre des affaires sociales du 18 novembre 1978 portant publication du règlement du régime complémentaire de pension de vieillesse, d'invalidité et de survivants, article 26"
      href: "https://www.pist.tn/jort/1978/1978F/Jo07978.pdf"
      note: "JORT n° 79 du 24 novembre 1978, pp. 3374-3379, lu sur une océrisation du fascicule, qui n'a pas de couche texte. L'article 2 de l'arrêté fait entrer le règlement en application à compter du 1er janvier 1974. Le taux de la pension d'orphelin est égal à 20 % de la pension de vieillesse ou d'invalidité dont bénéficiait ou aurait dû bénéficier le défunt ; il est porté à 30 % pour les orphelins de père et de mère."
documentation: |-
  Le taux de l'orphelin de père et de mère est porté par `taux_orphelin_pere_et_mere`. Ce sont
  les taux du régime non agricole dans sa rédaction de 1974, avant l'alignement de 1981.
