description: Âge en deçà duquel le remariage suspend la pension du conjoint survivant
values:
  1997-02-16:
    value: 55
metadata:
  unit: year
  reference:
    1997-02-16:
    - title: "Arrêté du ministre des affaires sociales du 27 janvier 1997, modifiant l'arrêté du 18 novembre 1978, relatif au régime complémentaire de pensions de vieillesse, d'invalidité et de survivants, article 24 (nouveau)"
      href: "https://www.pist.tn/jort/1997/1997F/Jo01197.pdf"
      note: "JORT n° 11 du 7 février 1997, pp. 183-184. L'arrêté ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 11 février 1997. Le paiement de la pension du conjoint survivant est suspendu lorsque l'intéressé se remarie après le décès de son conjoint et sans avoir atteint l'âge de 55 ans ; il est rétabli, revalorisé le cas échéant, en cas de décès du nouveau conjoint ou de dissolution du mariage. Le cumul de pensions de conjoint survivant au titre de mariages successifs est interdit, la plus élevée étant servie."
documentation: |-
  Dans la rédaction de 1978, le remariage de la veuve supprimait la pension de réversion à partir
  du premier jour du trimestre civil suivant, quel que soit l'âge (article 24). L'arrêté de 1997
  remplace cette suppression par une suspension, limitée aux remariages avant 55 ans.
