description: Pensions de survivants du régime complémentaire
documentation: |-
  Pension de réversion au conjoint survivant et pension temporaire d'orphelin, dans des conditions
  qui renvoient au décret n° 74-499 (articles 21 à 29). Le remariage de la veuve supprime la
  pension de réversion à compter du premier jour du trimestre civil suivant (article 24). Plusieurs
  veuves se partagent la pension à parts égales (article 23).
