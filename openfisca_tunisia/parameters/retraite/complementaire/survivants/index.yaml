description: Pensions de survivants du régime complémentaire
documentation: |-
  Pension de réversion et pension temporaire d'orphelin, dans des conditions qui renvoient au
  décret n° 74-499 (articles 21 à 29). Dans la rédaction de 1978, l'article 21 porte sur la
  « pension des veuves et des veufs » ; le remariage de la veuve supprimait la pension de
  réversion à compter du premier jour du trimestre civil suivant (article 24) ; plusieurs
  veuves se partagent la pension à parts égales (article 23).

  L'arrêté du 27 janvier 1997, exécutoire le 16 février 1997, récrit les articles 21, 22, 24
  et 30 :
  - le droit va au conjoint survivant d'un pensionné ou d'un participant qui remplissait la
    condition de stage (article 21) ;
  - la pension est due lorsque les liens de mariage existent au moment du décès (article 22) ;
  - le remariage ne supprime plus la pension : il la suspend, et seulement s'il intervient
    avant 55 ans ; elle est rétablie, revalorisée le cas échéant, au décès du nouveau conjoint
    ou à la dissolution du mariage ; les pensions de conjoint au titre de mariages successifs
    ne se cumulent pas, la plus élevée étant servie (article 24) ;
  - le cumul des pensions du conjoint et des orphelins ne peut excéder la pension dont
    bénéficiait ou aurait pu bénéficier le défunt, les pensions d'orphelins étant au besoin
    réduites temporairement (article 30).

  C'est l'alignement sur le régime des salariés agricoles, que la loi n° 96-66 avait modifié
  dans les mêmes termes.
