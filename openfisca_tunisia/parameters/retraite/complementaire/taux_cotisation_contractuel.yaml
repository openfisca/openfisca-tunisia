description: Taux de la cotisation contractuelle qui sert à l'acquisition des points
values:
  1974-01-01:
    value: 0.18
metadata:
  unit: /1
  reference:
    1974-01-01:
    - title: "Arrêté du ministre des affaires sociales du 18 novembre 1978 portant publication du règlement du régime complémentaire de pension de vieillesse, d'invalidité et de survivants, article 10"
      href: "https://www.pist.tn/jort/1978/1978F/Jo07978.pdf"
      note: "JORT n° 79 du 24 novembre 1978, pp. 3374-3379, lu sur une océrisation du fascicule, qui n'a pas de couche texte. L'article 2 de l'arrêté fait entrer le règlement en application à compter du 1er janvier 1974. Les points acquis sur une période valent la cotisation contractuelle, calculée au taux de 18 % du salaire de base défini à l'article 6, divisée par le salaire de référence de la période."
documentation: |-
  Ce taux n'est pas celui que paient les participants : le règlement appelle un taux
  initial de 4,5 % (article 6). Le taux contractuel sert seulement à convertir le salaire en
  points. Relu à l'image, page 3376.
