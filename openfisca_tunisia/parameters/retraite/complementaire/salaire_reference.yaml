  reference:
    1961-01-01:
    - title: "Arrêté du ministre des affaires sociales du 18 novembre 1978 portant publication du règlement du régime complémentaire de pension de vieillesse, d'invalidité et de survivants, annexe I, A"
      href: "https://www.pist.tn/jort/1978/1978F/Jo07978.pdf"
      note: "JORT n° 79 du 24 novembre 1978, p. 3379, lu à l'image. Les salaires de référence applicables aux périodes antérieures à l'année 1977 font l'objet d'un tableau, de 0,342 dinar pour 1961 à 0,838 dinar pour 1976."
    1977-01-01:
    - title: "Arrêté du ministre des affaires sociales du 18 novembre 1978 portant publication du règlement du régime complémentaire de pension de vieillesse, d'invalidité et de survivants, article 11"
      href: "https://www.pist.tn/jort/1978/1978F/Jo07978.pdf"
      note: "JORT n° 79 du 24 novembre 1978, p. 3376. Pour les années postérieures à 1976, le salaire de référence est fixé par le directeur général de la CAVIS sur avis du comité de gestion, dans les six premiers mois suivant la clôture de l'exercice."
documentation: |-
  Le salaire de référence est la cotisation qui donne droit à un point de retraite, en dinars
  (article 11). Les valeurs antérieures à 1977 servent à la reconstitution de carrière, qui peut
  remonter à 1961 (article 12). Les valeurs postérieures sont fixées chaque année par décision de
  la CAVIS, puis de la CNSS, qui ne paraît pas au Journal officiel : la série s'arrête donc en
  1976, et la valeur nulle au 1er janvier 1977 le signale.
