documentation: |-
  Le salaire de référence est la cotisation qui donne droit à un point de retraite, en dinars
  (article 11). Les valeurs antérieures à 1977 servent à la reconstitution de carrière, qui peut
  remonter à 1961 (article 12). Les valeurs postérieures sont fixées chaque année par décision de
  la CAVIS, puis de la CNSS, qui ne paraît pas au Journal officiel : la série publiée s'arrête donc en
  1976, et la valeur nulle au 1er janvier 1977 le signale.

  À partir de 2009, la série est reprise d'une source secondaire, secu.tn, qui la donne par
  année. Entre 1977 et 2009, aucune valeur n'est connue.
