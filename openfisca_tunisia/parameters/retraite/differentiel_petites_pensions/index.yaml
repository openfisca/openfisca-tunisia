description: Différentiel complémentaire des petites pensions (décret-loi n° 2020-30, article premier)
metadata:
  short_label: Différentiel des petites pensions
  order:
  - seuil
documentation: |-
  Le décret-loi n° 2020-30 du 10 juin 2020 attribue un différentiel complémentaire aux titulaires
  de pensions de la Caisse nationale de sécurité sociale et de la Caisse nationale de retraite et
  de prévoyance sociale (régime de la loi n° 85-12) dont le montant mensuel net, pension
  temporaire d'orphelin comprise, est inférieur ou égal au seuil. Le différentiel est l'écart
  entre ce montant et le seuil ; il s'ajoute à la pension, versé chaque mois, sans retenue au
  titre de l'assurance maladie ni de la contribution sociale de solidarité. Pour les titulaires de
  pensions des deux caisses au titre de la loi n° 2003-8, le montant net s'apprécie sur
  l'ensemble.

  Le coût est supporté par le budget de l'État, qui transfère les crédits aux caisses chaque
  semestre ; les caisses versent le différentiel pour le compte de l'État, selon deux conventions
  de gestion avec le ministère des finances.

  Le décret-loi ne fixe pas de terme. Aucun texte prolongeant, relevant ou abrogeant le seuil
  n'est établi.
