description: Âge avant lequel le remariage suspend la pension du conjoint survivant
values:
  1996-08-04:
    value: 55
metadata:
  unit: year
  reference:
    1996-08-04:
    - title: "Loi n° 96-66 du 22 juillet 1996, modifiant la loi n° 81-6 du 12 février 1981 relative à l'organisation des régimes de sécurité sociale dans le secteur agricole, article unique (article 63 nouveau)"
      href: "https://www.pist.tn/jort/1996/1996F/Jo06096.pdf"
      note: "JORT n° 60 du 26 juillet 1996, p. 1603 : « Le paiement de la pension du conjoint survivant est suspendu lorsque l'intéressé se remarie après le décès de son conjoint et sans avoir atteint l'âge de 55 ans. » La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 30 juillet 1996."
documentation: |-
  Le paramètre commence en 1996 parce que la règle n'existait pas avant. Dans la rédaction
  de 1981, le remariage de la veuve supprime la pension de réversion à partir du premier
  jour du trimestre civil qui suit, quel que soit son âge (article 63) : il n'y a pas d'âge
  à verser pour cette période.
