description: Taux de la pension de l'orphelin de père et de mère, en part de la pension du défunt
values:
  1981-01-01:
    value: 0.3
metadata:
  unit: /1
  reference:
    1981-01-01:
    - title: "Loi n° 81-6 du 12 février 1981, organisant les régimes de sécurité sociale dans le secteur agricole, article 65"
      href: "https://www.pist.tn/jort/1981/1981F/Jo00981.pdf"
      note: "JORT n° 9 du 13 février 1981, p. 271 : « Ce montant est porté à 30 % pour les orphelins de père et de mère. » L'article 88 énonce : « La présente loi entrera en vigueur le 1er janvier 1981. » Le rectificatif publié au JORT n° 26 du 17 avril 1981, p. 844, ne touche pas les articles 60 à 69."
