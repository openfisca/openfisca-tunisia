description: Pensions de survivants du régime des salariés agricoles
documentation: |-
  Droits dérivés du régime institué par la loi n° 81-6 du 12 février 1981, section III du
  titre II (articles 60 à 69), en vigueur le 1er janvier 1981. Le régime agricole amélioré
  (titre III, ajouté par la loi n° 89-73) y renvoie par son article 101.

  Ce qui a changé sans être une valeur, et n'est donc que décrit ici :
  - le bénéficiaire : en 1981, « la veuve » et « le veuf invalide » (article 60) ; depuis le
    4 août 1996, « le conjoint survivant » (loi n° 96-66) ;
  - la condition de mariage : en 1981, un mariage contracté avant l'ouverture du droit à
    pension (article 61) ; depuis 1996, des liens de mariage existant au moment du décès ;
  - le remariage : en 1981, il supprime la pension à partir du premier jour du trimestre
    civil suivant, quel que soit l'âge (article 63) ; depuis 1996, il la suspend s'il
    intervient avant 55 ans, la pension étant rétablie et revalorisée au décès du nouveau
    conjoint ou à la dissolution du mariage, et les pensions de conjoint au titre de mariages
    successifs ne se cumulent pas, la plus élevée étant servie ;
  - le plafond du cumul des pensions du conjoint et des orphelins : en 1981, la « pension de
    référence du mari » (article 69) ; depuis 1996, la pension dont bénéficiait ou aurait pu
    bénéficier le défunt ; les pensions d'orphelins sont au besoin réduites temporairement ;
  - la fille orpheline : depuis le 1er mai 1997, servie tant qu'elle ne dispose pas de
    ressources ou que l'obligation alimentaire n'incombe pas à son époux (loi n° 97-61) ;
    depuis le 2 juillet 2007, sans limite d'âge, les conditions étant appréciées au décès de
    l'ascendant et le paiement définitivement suspendu si l'une d'elles fait défaut (loi
    n° 2007-43, article 3) ;
  - l'orphelin infirme, servi sans limite d'âge depuis 1981 ;
  - le mot « mineur », supprimé en tête de l'article 64 par la loi n° 2007-43, article 4.

  Les pensions d'orphelins sont collectives et réduites à mesure que chaque orphelin cesse
  d'y avoir droit (article 66).
