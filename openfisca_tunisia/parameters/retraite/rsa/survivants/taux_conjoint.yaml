description: Taux de la pension du conjoint survivant, en part de la pension du défunt
values:
  1981-01-01:
    value: 0.5
metadata:
  unit: /1
  reference:
    1981-01-01:
    - title: "Loi n° 81-6 du 12 février 1981, organisant les régimes de sécurité sociale dans le secteur agricole, article 62"
      href: "https://www.pist.tn/jort/1981/1981F/Jo00981.pdf"
      note: "JORT n° 9 du 13 février 1981, p. 271 : « Le taux annuel de la pension de réversion est égal à 50 % de la pension de vieillesse ou d'invalidité dont bénéficiait ou aurait dû bénéficier le défunt au moment de son décès. » Plusieurs conjoints se la partagent définitivement par parts égales. L'article 88 énonce : « La présente loi entrera en vigueur le 1er janvier 1981. » Le rectificatif publié au JORT n° 26 du 17 avril 1981, p. 844, ne touche pas les articles 60 à 69."
documentation: |-
  Le taux n'a pas changé depuis 1981. La loi n° 96-66 récrit les articles 60, 61, 63 et 69,
  mais pas l'article 62 : ce qui change en 1996 est qui y a droit, non combien.
