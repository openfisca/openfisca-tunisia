description: Taux de la pension d'orphelin, par orphelin, en part de la pension du défunt
values:
  1981-01-01:
    value: 0.2
metadata:
  unit: /1
  reference:
    1981-01-01:
    - title: "Loi n° 81-6 du 12 février 1981, organisant les régimes de sécurité sociale dans le secteur agricole, article 65"
      href: "https://www.pist.tn/jort/1981/1981F/Jo00981.pdf"
      note: "JORT n° 9 du 13 février 1981, p. 271 : « Le taux de la pension d'orphelin prévue à l'article 64 précédent est égal à 20 % du montant de la pension d'invalidité ou de vieillesse dont bénéficiait ou aurait dû bénéficier le défunt au moment de son décès. » L'article 88 énonce : « La présente loi entrera en vigueur le 1er janvier 1981. » Le rectificatif publié au JORT n° 26 du 17 avril 1981, p. 844, ne touche pas les articles 60 à 69."
documentation: |-
  Le taux de l'orphelin de père et de mère est porté par `taux_orphelin_pere_et_mere`.
