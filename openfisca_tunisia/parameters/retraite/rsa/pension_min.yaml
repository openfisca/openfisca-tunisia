description: Pension minimale (en part de SMAG)
values:
  1981-01-01:
    value: 0.4
documentation: |-
  Aucun texte n'établit ce plancher : la valeur de 0,4 SMAG n'a pas de source, et son
  origine n'est pas établie. Elle n'est ni le plancher du régime agricole amélioré, à la
  moitié du SMAG rapporté à 300 jours (article 96 de la loi n° 81-6, ajouté par la loi
  n° 89-73 du 2 septembre 1989, en vigueur le 1er octobre 1989), ni les deux tiers du régime
  des salariés non agricoles.

  Ce que la recherche a couvert :
  - la loi n° 81-6 du 12 février 1981, organisant les régimes de sécurité sociale dans le
    secteur agricole, articles 45 à 88, lus à l'image (JORT n° 9 du 13 février 1981) : le
    régime des salariés agricoles n'y comporte aucun plancher de pension ;
  - son rectificatif (JORT n° 26 du 17 avril 1981, p. 844), lu en entier : il ne touche ni
    le calcul de la pension (articles 48 à 50) ni aucun montant ;
  - ses modificatifs, recensés dans les sommaires du Journal officiel et relus : loi
    n° 89-73 (ajout du titre III, régime agricole amélioré) ; loi n° 95-102 (article 74,
    délai de la demande) ; loi n° 96-66 (articles 60, 61, 63 et 69, conjoint survivant) ; loi
    n° 97-61 (articles 41 et 64, soins et orphelins) ; loi n° 2007-43 (article 64, fille
    orpheline). Aucun ne crée de minimum de pension pour ce régime ;
  - les visas des textes de 2020 et de 2026 relatifs aux régimes de la Caisse nationale de
    sécurité sociale, qui donnent la loi n° 2007-43 pour dernier modificatif de la loi
    n° 81-6.

  Aucun intitulé de texte publié au Journal officiel ne porte sur un minimum de pension du
  secteur agricole.

  La date du 1er janvier 1981 est celle de l'entrée en vigueur de la loi n° 81-6 (article 88) ;
  elle n'est rattachée à aucune disposition qui fixerait ce montant.
