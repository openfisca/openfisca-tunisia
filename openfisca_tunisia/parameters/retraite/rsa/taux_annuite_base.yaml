  reference:
    1981-01-01:
    - title: "Loi n° 81-6 du 12 février 1981, organisant les régimes de sécurité sociale dans le secteur agricole, article 49"
      href: "https://www.pist.tn/jort/1981/1981F/Jo00981.pdf"
      note: "JORT n° 9 du 13 février 1981, p. 270 : le taux de la pension de vieillesse est fixé à 40 % du salaire moyen de référence lorsque la condition de 40 trimestres est remplie, soit 4 % par année de stage. L'article 88 énonce : « La présente loi entrera en vigueur le 1er janvier 1981. » Rectificatif publié au JORT n° 26 du 17 avril 1981, p. 844, non lu."
