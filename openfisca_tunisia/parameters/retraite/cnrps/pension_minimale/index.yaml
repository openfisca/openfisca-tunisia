description: Pension minimale
documentation: |-
  Depuis le 1er mai 1981, la pension minimale et l'allocation de vieillesse s'expriment en
  part du SMIG. Du 1er avril 1959 au 30 avril 1981, le plancher s'exprime par référence à la
  rémunération afférente à l'indice 100 de la grille des traitements : ses paramètres sont
  réunis dans `indice_100`.
