description: Durée de services exigée pour la mise à la retraite des agents exerçant des fonctions astreignantes
values:
  1985-09-12:
    value: 35
metadata:
  unit: year
  reference:
    1985-09-12:
    - title: "Loi n° 85-12 du 5 mars 1985, portant régime des pensions civiles et militaires de retraite et des survivants dans le secteur public, article 28"
      href: "https://www.pist.tn/jort/1985/1985F/Jo02085.pdf"
      note: "JORT n° 20 du 12 mars 1985, p. 361 : « Les agents exerçant des fonctions astreignantes sont mis à la retraite après avoir accompli trente cinq (35) ans de services et atteint l'âge de cinquante cinq (55) ans au moins. » Ils peuvent être maintenus en activité jusqu'à 60 ans ; la liste est fixée par décret. Entrée en vigueur : l'article 75 (p. 365) la fixe « à l'expiration d'un délai de six (6) mois à compter de la date de sa publication au Journal officiel », publication faite le 12 mars 1985, soit le 12 septembre 1985 — date déduite de la clause, non énoncée telle quelle."
documentation: |-
  L'article 28 ne décrit pas un départ anticipé sur demande : il fixe la durée de services au
  terme de laquelle les agents exerçant des fonctions astreignantes **sont mis à la retraite**.

  La durée ne suffit pas : l'article exige aussi un âge, porté par `age` sous le même nœud. Les
  deux conditions sont cumulatives.

  La loi n° 2019-37 du 30 avril 2019 (JORT n° 35, p. 1312) réécrit l'article 28 **sans changer la
  durée** : les agents « sont mis à la retraite après avoir accompli trente-cinq (35) ans de
  services et atteint au moins l'âge de cinquante-sept (57) ans ». Le relèvement transitoire de
  son article 5 ne porte que sur l'âge. Une seule valeur couvre donc toute la période.

  Le paramètre commence le 12 septembre 1985, date d'effet de la loi n° 85-12. La loi n° 59-18 du
  5 février 1959, qu'elle remplace, n'a pas été lue pour cette période : l'état du droit antérieur
  n'est pas établi, et aucune valeur n'est portée avant cette date.
