description: Durée de service minimale requise pour prétendre à une pension de retraite
values:
  1985-09-12:
    value: 15
metadata:
  unit: year
  reference:
    1985-09-12:
    - title: "Loi n° 85-12 du 5 mars 1985, portant régime des pensions civiles et militaires de retraite et des survivants dans le secteur public, article 22"
      href: "https://www.pist.tn/jort/1985/1985F/Jo02085.pdf"
      note: "JORT n° 20 du 12 mars 1985, p. 360 : la pension de retraite est acquise après quinze (15) ans de services au moins ; dix (10) ans pour les ouvriers occasionnels. Entrée en vigueur : l'article 75 (p. 365) la fixe « à l'expiration d'un délai de six (6) mois à compter de la date de sa publication au Journal officiel », publication faite le 12 mars 1985, soit le 12 septembre 1985 — date déduite de la clause, non énoncée telle quelle."
documentation: |-
  Le minimum est ramené à dix ans pour les ouvriers occasionnels (exception non modélisée).

  Le paramètre commence le 12 septembre 1985, date d'effet de la loi n° 85-12. La loi
  n° 59-18 du 5 février 1959, qu'elle remplace, n'a pas été lue pour cette période :
  l'état du droit antérieur n'est pas établi, et aucune valeur n'est portée avant cette
  date.

  La dispense de cette condition pour les agents recrutés avant l'entrée en vigueur de la
  loi (article 72) est abrogée par l'article 5 de la loi n° 87-8 du 6 mars 1987 (JORT
  n° 18 du 10 mars 1987, p. 364), sans date d'effet énoncée.
