description: Durée annuelle d'occupation à laquelle le SMAG est rapporté
values:
  1989-10-01:
    value: 300
metadata:
  unit: day
  reference:
    1989-10-01:
    - title: "Loi n° 89-73 du 2 septembre 1989, modifiant et complétant la loi n° 81-6 du 12 février 1981, organisant les régimes de sécurité sociale dans le secteur agricole, articles 95 et 96 de la loi n° 81-6"
      href: "https://www.pist.tn/jort/1989/1989F/Jo06089.pdf"
      note: "JORT n° 60 des 5-8 septembre 1989, pp. 1338-1339, lu sur une océrisation du fascicule, qui n'a pas de couche texte. L'article 4 fixe l'entrée en vigueur au 1er octobre 1989. La limite de calcul et le plancher rapportent le SMAG à une durée d'occupation annuelle de 300 jours."
