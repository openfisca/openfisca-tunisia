description: Limite des salaires annuels pris en compte, en multiple du SMAG annuel
values:
  1989-10-01:
    value: 6
metadata:
  reference:
    1989-10-01:
    - title: "Loi n° 89-73 du 2 septembre 1989, modifiant et complétant la loi n° 81-6 du 12 février 1981, organisant les régimes de sécurité sociale dans le secteur agricole, article 95 de la loi n° 81-6"
      href: "https://www.pist.tn/jort/1989/1989F/Jo06089.pdf"
      note: "JORT n° 60 des 5-8 septembre 1989, pp. 1338-1339, lu sur une océrisation du fascicule, qui n'a pas de couche texte. L'article 4 fixe l'entrée en vigueur au 1er octobre 1989. Les salaires ne sont pris en compte pour une année déterminée que dans la limite de 6 fois le salaire minimum agricole garanti rapporté à une durée d'occupation annuelle de 300 jours."
documentation: |-
  Le régime des salariés agricoles, qui retient un salaire forfaitaire, n'a pas de limite de
  calcul. Celle-ci est propre au régime amélioré, comme les salaires réels qu'elle borne.
