description: Salaire trimestriel minimum, en nombre de SMAG journaliers, pour qu'un trimestre soit retenu
values:
  1989-10-01:
    value: 50
metadata:
  reference:
    1989-10-01:
    - title: "Loi n° 89-73 du 2 septembre 1989, modifiant et complétant la loi n° 81-6 du 12 février 1981, organisant les régimes de sécurité sociale dans le secteur agricole, article 93 de la loi n° 81-6"
      href: "https://www.pist.tn/jort/1989/1989F/Jo06089.pdf"
      note: "JORT n° 60 des 5-8 septembre 1989, pp. 1338-1339, lu sur une océrisation du fascicule, qui n'a pas de couche texte. L'article 4 fixe l'entrée en vigueur au 1er octobre 1989. Pour l'ouverture du droit aux prestations, sont pris en considération les trimestres de cotisation ayant donné lieu à déclaration d'un salaire au moins égal à 50 fois le salaire minimum agricole garanti."
documentation: |-
  Un trimestre ne compte pour l'ouverture du droit que si le salaire déclaré atteint 50 fois
  le SMAG journalier. Le coefficient n'a pas d'unité : c'est un nombre de salaires minimums
  journaliers.
