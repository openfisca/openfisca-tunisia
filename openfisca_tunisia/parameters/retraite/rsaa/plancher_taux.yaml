description: Plancher de la pension, en part du SMAG annuel
values:
  1989-10-01:
    value: 0.5
metadata:
  unit: /1
  reference:
    1989-10-01:
    - title: "Loi n° 89-73 du 2 septembre 1989, modifiant et complétant la loi n° 81-6 du 12 février 1981, organisant les régimes de sécurité sociale dans le secteur agricole, article 96 de la loi n° 81-6"
      href: "https://www.pist.tn/jort/1989/1989F/Jo06089.pdf"
      note: "JORT n° 60 des 5-8 septembre 1989, pp. 1338-1339, lu sur une océrisation du fascicule, qui n'a pas de couche texte. L'article 4 fixe l'entrée en vigueur au 1er octobre 1989. Le montant annuel des pensions de vieillesse ou d'invalidité ne peut être inférieur à la moitié du salaire minimum agricole garanti rapporté à une durée d'occupation de 300 jours."
documentation: |-
  Propre au régime amélioré : aucun plancher n'est fixé par les articles 45 à 88 de la loi
  pour le régime des salariés agricoles.
