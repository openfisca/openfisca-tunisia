documentation: |-
  Régime fixé par le décret n° 95-1166 du 3 juillet 1995, géré par la Caisse nationale de
  sécurité sociale. Il n'est pas le premier : les non-salariés sont couverts depuis le
  1er juillet 1982 par deux décrets du 21 octobre 1982, le décret n° 82-1359 pour le secteur
  non agricole et le décret n° 82-1360 pour le secteur agricole, qui prennent effet à cette
  date (articles 26 et 18). Le décret de 1995 les fusionne et les abroge (articles 34 à 39),
  en conservant leurs affiliés et leurs droits.

  Le décret de 1995 procède par extension : son article premier rend applicables aux
  non-salariés les articles 20 à 38, 46 à 52, 54 et 57 du décret n° 74-499, sous réserve
  des dispositions particulières de ses articles 23 à 31 (article 22).

  Ce que le renvoi importe, et qui n'est donc pas versé ici : les droits des survivants
  (articles 29 à 38 du décret n° 74-499), portés par `retraite.rsna.survivants`, et les
  règles de liquidation (articles 46 à 52).

  Ce que le décret de 1995 remplace, et qui est versé ici, parce que le régime non agricole
  en dispose autrement :
  - la pension de vieillesse (articles 23 à 26), au lieu des articles 14 à 19 du décret
    n° 74-499 : stage, âges, décote, taux, majoration, plafond ;
  - le taux de la pension d'invalidité (article 27) : 30 %, et non 50 % comme au régime non
    agricole ;
  - le plancher (article 29) : 30 % du salaire minimum annuel, et non les deux tiers ;
  - la revalorisation (article 30), au lieu de l'article 53.

  Le calcul ne part pas d'un salaire mais d'une classe de revenus (article 7) : le revenu de
  référence est la moyenne pondérée des coefficients des classes auxquelles l'assuré a
  adhéré, appliquée au SMIG du régime de 48 heures rapporté à 2 400 heures par an, ou au
  SMAG rapporté à un nombre de jours par an qui a varié (article 25 ; décret n° 96-1797).

  Les dates suivent la convention de l'arbre : celle du texte lorsqu'il énonce sa date
  d'effet, sinon celle où il devient exécutoire, cinq jours après le dépôt du fascicule au
  siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64,
  article 2). Le décret n° 95-1166, publié au JORT n° 55 du 11 juillet 1995 et sans clause
  propre, a été déposé le 14 juillet 1995 : il prend effet le 19 juillet 1995.

  Les valeurs commencent en 1995, date du régime fusionné. Les régimes de 1982 n'y sont pas
  versés, parce qu'ils différaient d'un secteur à l'autre. Au secteur non agricole, le
  décret n° 82-1359 fixait déjà l'âge de 65 ans avec départ possible dès 60 ans et une
  réduction de 0,5 % par trimestre (article 18), le taux de 30 % à 120 mois majoré de 0,5 %
  par période de trois mois dans la limite de 80 % (article 20), et un minimum égal à la
  moitié du SMIG rapporté à 2 400 heures (article 22). Au secteur agricole, le décret
  n° 82-1360 fixait l'âge à 65 ans (article 8) et étendait aux exploitants la loi n° 81-6
  (article 1er). Le décret de 1995 aligne le secteur agricole sur le non agricole.

  La revalorisation n'est pas versée, faute d'être une valeur. Au secteur non agricole, le
  décret n° 89-1611 du 10 octobre 1989 prévoit déjà une révision par arrêté en cas de
  majoration du SMIG (article 23 nouveau du décret n° 82-1359), et rapporte le revenu de
  référence au SMIG en vigueur à la liquidation (article 19 nouveau). Dans la rédaction de
  1995, l'article 30 renvoie la date et les modalités de la révision à un arrêté ; celui du
  29 juillet 1998 applique, au 1er mai 1998, un coefficient qui dépend de l'année
  d'ouverture du droit. Le décret n° 2002-3018 réécrit l'article 30 : la pension est
  désormais revalorisée automatiquement, dans la proportion de la hausse du salaire
  minimum. Les cinq textes modificatifs du décret de 1995 n'ont touché ni l'âge, ni le
  stage, ni le taux.
