description: Stage requis pour l'ouverture du droit à pension de vieillesse
values:
  1995-07-13:
    value: 40
metadata:
  unit: trimestre
  reference:
    1995-07-13:
    - title: "Décret n° 95-1166 du 3 juillet 1995, relatif à la sécurité sociale des travailleurs non salariés dans les secteurs agricole et non agricole, article 23"
      href: "https://www.pist.tn/jort/1995/1995F/Jo05595.pdf"
      note: "JORT n° 55 du 11 juillet 1995, pp. 1486-1489. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, un jour franc après sa publication. L'ouverture du droit à pension de vieillesse est subordonnée à un stage minimum de quarante trimestres de cotisations effectives."
documentation: |-
  Une période de cotisation inférieure au stage n'ouvre pas de pension mais un versement
  unique, égal aux cotisations réglées au titre du régime des pensions (article 28).
