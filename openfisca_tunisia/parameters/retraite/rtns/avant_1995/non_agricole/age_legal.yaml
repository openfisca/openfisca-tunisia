description: Âge d'ouverture du droit à pension de vieillesse, secteur non agricole
values:
  1982-07-01:
    value: 65
  1995-07-19:
    value: null
metadata:
  unit: year
  reference:
    1982-07-01:
    - title: "Décret n° 82-1359 du 21 octobre 1982, étendant le régime de sécurité sociale aux travailleurs indépendants dans le secteur non agricole, article 18"
      href: "https://www.pist.tn/jort/1982/1982F/Jo06682.pdf"
      note: "JORT n° 66 des 19-22 octobre 1982, p. 2194, lu à l'image. Article 18 : « L'âge d'ouverture de droit à pension de vieillesse est fixé à 65 ans. Cependant les intéressés peuvent demander une pension de retraite à partir de l'âge de 60 ans. Dans ce cas le montant de la pension calculé en application des dispositions de l'article 20 du présent décret est réduit de 0,5 % par trimestre restant à courir entre leur âge lors du départ à la retraite et l'âge de 65 ans. » L'article 26 (p. 2195) énonce que le décret « prend effet à compter du 1er juillet 1982 »."
    1995-07-19:
    - title: "Décret n° 95-1166 du 3 juillet 1995, relatif à la sécurité sociale des travailleurs non salariés dans les secteurs agricole et non agricole, article 39"
      href: "https://www.pist.tn/jort/1995/1995F/Jo05595.pdf"
      note: "JORT n° 55 du 11 juillet 1995, pp. 1486-1489. Article 39 : « Sont abrogées toutes dispositions antérieures contraires et notamment les décrets susvisés n° 82-1359 et n° 82-1360 du 21 octobre 1982. » Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 14 juillet 1995."
