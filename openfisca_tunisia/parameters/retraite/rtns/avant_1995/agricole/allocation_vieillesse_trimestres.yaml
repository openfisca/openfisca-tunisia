description: Durée de cotisation ouvrant l'allocation de vieillesse en période transitoire, secteur agricole
values:
  1982-07-01:
    value: 10
  1995-07-19:
    value: null
metadata:
  unit: trimestre
  reference:
    1982-07-01:
    - title: "Décret n° 82-1360 du 21 octobre 1982, relatif à la sécurité sociale des exploitants et travailleurs indépendants dans l'agriculture, article 17"
      href: "https://www.pist.tn/jort/1982/1982F/Jo06682.pdf"
      note: "JORT n° 66 des 19-22 octobre 1982, p. 2197, lu à l'image. Article 17 : les assurés visés à l'article 16 qui justifieraient d'un minimum de 10 trimestres de cotisations effectives ou assimilées auront droit à une allocation de vieillesse, équivalente pour chaque période de deux trimestres de cotisation à une mensualité de la pension à laquelle aurait droit l'assuré ayant accompli le stage minimum prévu à l'article 48 de la loi n° 81-6. L'article 18 (p. 2197) énonce que le décret « prend effet à compter du 1er juillet 1982 »."
    1995-07-19:
    - title: "Décret n° 95-1166 du 3 juillet 1995, relatif à la sécurité sociale des travailleurs non salariés dans les secteurs agricole et non agricole, article 39"
      href: "https://www.pist.tn/jort/1995/1995F/Jo05595.pdf"
      note: "JORT n° 55 du 11 juillet 1995, pp. 1486-1489. Article 39 : « Sont abrogées toutes dispositions antérieures contraires et notamment les décrets susvisés n° 82-1359 et n° 82-1360 du 21 octobre 1982. » Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 14 juillet 1995."
documentation: |-
  L'allocation est réservée aux assurés de la période transitoire (article 16) : âgés d'au moins
  45 ans à l'entrée en vigueur du décret, ils bénéficient d'une validation forfaitaire d'un
  trimestre par année écoulée entre 45 ans et leur âge, dans la limite de 18 trimestres.
