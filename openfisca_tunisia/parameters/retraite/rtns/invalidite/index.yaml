description: Pension d'invalidité du régime des travailleurs non salariés
documentation: |-
  L'article 27 du décret n° 95-1166 remplace, pour le taux et le stage, les règles du régime
  non agricole que le renvoi aurait importées : 30 % au lieu de 50 %, vingt trimestres de
  cotisations. La majoration et le plafond sont ceux de la pension de vieillesse.
