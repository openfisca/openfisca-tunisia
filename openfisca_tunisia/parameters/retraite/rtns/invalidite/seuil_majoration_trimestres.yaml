description: Nombre de trimestres au-delà duquel la pension d'invalidité est majorée
values:
  1995-07-13:
    value: 40
metadata:
  unit: trimestre
  reference:
    1995-07-13:
    - title: "Décret n° 95-1166 du 3 juillet 1995, relatif à la sécurité sociale des travailleurs non salariés dans les secteurs agricole et non agricole, article 27, alinéa 2"
      href: "https://www.pist.tn/jort/1995/1995F/Jo05595.pdf"
      note: "JORT n° 55 du 11 juillet 1995, pp. 1486-1489. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, un jour franc après sa publication. Toute fraction de cotisation supérieure à quarante trimestres ouvre droit, par trimestre supplémentaire, à une majoration de 0,5 % du revenu moyen de référence, dans la limite de 80 %."
documentation: |-
  Le seuil de la majoration n'est pas le stage : le texte ouvre le droit à vingt trimestres
  et ne majore qu'au-delà de quarante. La valeur est versée telle quelle, relue sur deux
  extractions du fascicule, plutôt qu'alignée sur le stage.
