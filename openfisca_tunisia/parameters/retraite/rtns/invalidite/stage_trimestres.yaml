description: Stage requis pour l'ouverture du droit à pension d'invalidité
values:
  1995-07-19:
    value: 20
metadata:
  unit: trimestre
  reference:
    1995-07-19:
    - title: "Décret n° 95-1166 du 3 juillet 1995, relatif à la sécurité sociale des travailleurs non salariés dans les secteurs agricole et non agricole, article 27"
      href: "https://www.pist.tn/jort/1995/1995F/Jo05595.pdf"
      note: "JORT n° 55 du 11 juillet 1995, pp. 1486-1489. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 14 juillet 1995. L'invalidité ouvre droit à pension lorsque se trouve réalisée la condition de vingt trimestres de cotisations."
documentation: |-
  Le texte fixe le stage à vingt trimestres, mais fait courir la majoration « au-delà de
  quarante trimestres » : voir `seuil_majoration_trimestres`. Les deux valeurs sont versées
  telles que le décret les écrit, relues sur deux extractions du fascicule. De même,
  l'article 28 renvoie aux « articles 23 et 26 » pour le stage de l'invalidité, que porte
  l'article 27.
