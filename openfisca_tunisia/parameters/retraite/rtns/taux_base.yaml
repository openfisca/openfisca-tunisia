description: Taux de la pension de vieillesse lorsque le stage de quarante trimestres est réalisé
values:
  1995-07-13:
    value: 0.3
metadata:
  unit: /1
  reference:
    1995-07-13:
    - title: "Décret n° 95-1166 du 3 juillet 1995, relatif à la sécurité sociale des travailleurs non salariés dans les secteurs agricole et non agricole, article 26"
      href: "https://www.pist.tn/jort/1995/1995F/Jo05595.pdf"
      note: "JORT n° 55 du 11 juillet 1995, pp. 1486-1489. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, un jour franc après sa publication. Le taux de la pension de vieillesse est fixé à 30 % du revenu moyen de référence lorsque la condition de quarante trimestres de cotisations est réalisée."
documentation: |-
  Le régime non agricole part de 40 %. Ce taux de 30 % est propre au régime des non-salariés :
  l'article 26 remplace ici l'article 17 du décret n° 74-499, que le renvoi n'importe pas.
