description: Durée annuelle de travail à laquelle le SMAG est rapporté, secteur agricole
values:
  1995-07-19:
    value: 180
  1997-01-01:
    value: 260
  1998-12-01:
    value: 300
metadata:
  unit: day
  reference:
    1995-07-19:
    - title: "Décret n° 95-1166 du 3 juillet 1995, relatif à la sécurité sociale des travailleurs non salariés dans les secteurs agricole et non agricole, article 7, alinéa 3"
      href: "https://www.pist.tn/jort/1995/1995F/Jo05595.pdf"
      note: "JORT n° 55 du 11 juillet 1995, pp. 1486-1489. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 14 juillet 1995. L'article 7 rapporte le SMAG à 300 jours par an ; le décret n° 96-1797 y déroge, avec effet dès l'origine du régime."
    - title: "Décret n° 96-1797 du 30 septembre 1996, portant amendement du décret n° 95-1166 du 3 juillet 1995, article premier"
      href: "https://www.pist.tn/jort/1996/1996F/Jo08296.pdf"
      note: "JORT n° 82 du 11 octobre 1996, p. 2021. À titre transitoire et par dérogation à l'article 7, alinéa 3, les cotisations et les prestations des non-salariés agricoles sont déterminées par référence au SMAG rapporté à 180 jours par an jusqu'au 31 décembre 1996."
    1997-01-01:
    - title: "Décret n° 96-1797 du 30 septembre 1996, portant amendement du décret n° 95-1166 du 3 juillet 1995, article premier"
      href: "https://www.pist.tn/jort/1996/1996F/Jo08296.pdf"
      note: "JORT n° 82 du 11 octobre 1996, p. 2021. 260 jours par an du 1er janvier au 31 décembre 1997."
    1998-12-01:
    - title: "Décret n° 96-1797 du 30 septembre 1996, portant amendement du décret n° 95-1166 du 3 juillet 1995, article premier"
      href: "https://www.pist.tn/jort/1996/1996F/Jo08296.pdf"
      note: "JORT n° 82 du 11 octobre 1996, p. 2021. 300 jours par an à compter du 1er décembre 1998, soit la valeur de l'article 7."
documentation: |-
  La série vient d'une dérogation transitoire à l'article 7, qui fixe 300 jours. Le décret
  n° 96-1797 y substitue 180 jours jusqu'au 31 décembre 1996, puis 260 jours en 1997, puis
  300 jours à compter du 1er décembre 1998. Publié le 11 octobre 1996, il déroge pour une
  période qui commence avec le régime : la première valeur est donc datée du 19 juillet 1995.

  Le texte ne dit rien du 1er janvier au 30 novembre 1998. Aucune valeur n'est inventée pour
  ces onze mois : le paramètre y garde celle de 1997, 260 jours, faute de texte, ce qui
  n'est pas une règle établie. Le 1er décembre est peut-être une coquille pour le 1er
  janvier ; seul un texte le dirait.

  La même durée détermine les cotisations et les prestations.
