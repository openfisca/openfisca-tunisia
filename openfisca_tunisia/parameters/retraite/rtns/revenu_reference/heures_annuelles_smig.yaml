description: Durée annuelle d'occupation à laquelle le SMIG est rapporté, secteur non agricole
values:
  1995-07-19:
    value: 2400
metadata:
  unit: heure
  reference:
    1995-07-19:
    - title: "Décret n° 95-1166 du 3 juillet 1995, relatif à la sécurité sociale des travailleurs non salariés dans les secteurs agricole et non agricole, articles 7 et 25"
      href: "https://www.pist.tn/jort/1995/1995F/Jo05595.pdf"
      note: "JORT n° 55 du 11 juillet 1995, pp. 1486-1489. Le décret ne porte pas de clause d'entrée en vigueur : la date retenue est celle où il devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 14 juillet 1995. Le revenu forfaitaire du secteur non agricole est déterminé par référence au SMIG du régime de 48 heures, rapporté à une durée d'occupation de 2 400 heures par an."
