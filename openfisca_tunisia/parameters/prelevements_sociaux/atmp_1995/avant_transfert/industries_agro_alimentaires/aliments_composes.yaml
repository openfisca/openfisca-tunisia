  reference:
    1995-01-01:
    - title: "Décret n° 95-538 du 1er avril 1995, relatif à la fixation des taux de cotisations au régime de réparation des préjudices résultant des accidents du travail et des maladies professionnelles, article premier, point 6-9"
      href: "https://www.pist.tn/jort/1995/1995F/Jo03095.pdf"
      note: "JORT n° 30 du 14 avril 1995, pp. 690-691 des éditions française et arabe ; lu dans l'édition française et à l'image dans l'édition arabe, dont les taux concordent. L'article premier fixe le taux des cotisations au régime selon les secteurs d'activité ; point 6-9 : 2,30 %. Le décret entre en vigueur à compter du 1er janvier 1995 (article 28). Les articles 1er et 2 sont abrogés et remplacés par le décret n° 99-1010 du 10 mai 1999, en vigueur le 1er avril 1999. Édition arabe : https://www.pist.tn/jort/1995/1995A/Ja03095.pdf"
    1999-04-01:
    - title: "Décret n° 99-1010 du 10 mai 1999, modifiant et complétant le décret n° 95-538 du 1er avril 1995, articles 1er et 2"
      href: "https://www.pist.tn/jort/1999/1999F/Jo04099.pdf"
      note: "JORT n° 40 du 18 mai 1999, pp. 732-734. L'article premier abroge et remplace les articles 1er et 2 du décret n° 95-538 ; le décret entre en vigueur à compter du 1er avril 1999 (article 2). La nouvelle échelle ne reprend pas les classes de 1995."
