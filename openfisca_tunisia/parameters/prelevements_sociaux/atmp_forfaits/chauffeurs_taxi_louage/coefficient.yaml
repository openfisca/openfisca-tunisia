description: "Coefficient multiplicateur de l'assiette forfaitaire des chauffeurs de louage et de taxis"
values:
  1995-01-01:
    value: 1.5
  2000-07-01:
    value: 1
metadata:
  unit: "/1"
  short_label: "Coefficient"
  reference:
    1995-01-01:
    - title: "Décret n° 95-538 du 1er avril 1995, relatif à la fixation des taux de cotisations au régime de réparation des préjudices résultant des accidents du travail et des maladies professionnelles, article 5"
      href: "https://www.pist.tn/jort/1995/1995F/Jo03095.pdf"
      note: "JORT n° 30 du 14 avril 1995, pp. 690-693 (éd. française), pp. 691-692 (éd. arabe) ; entrée en vigueur le 1er janvier 1995 (article 28). « … et affecté d'un coefficient multiplicateur égal à 1,5. » L'édition arabe, lue à l'image, fait foi : https://www.pist.tn/jort/1995/1995A/Ja03095.pdf"
    2000-07-01:
    - title: "Décret n° 2000-1439 du 27 juin 2000, relatif à la détermination de l'assiette des cotisations aux régimes de sécurité sociale et au régime de réparation des préjudices résultant des accidents du travail et des maladies professionnelles concernant les travailleurs du secteur de transport public des personnes par taxi, louage et transport rural, articles premier, 2 et 4"
      href: "https://www.pist.tn/jort/2000/2000F/Jo0522000.pdf"
      note: "JORT n° 52 du 30 juin 2000, p. 1541 ; entrée en vigueur le 1er juillet 2000 (article 4). Le forfait du taxi, du louage et du transport rural est fixé « sur la base du salaire minimum interprofessionnel garanti régime 48 heures rapporté à une durée d'occupation de 2400 heures par an », sans coefficient. Portée déduite de l'abrogation des dispositions antérieures contraires (article 3). Lu à l'image (couche texte en police chiffrée). Édition arabe : https://www.pist.tn/jort/2000/2000A/Ja05200.pdf"
