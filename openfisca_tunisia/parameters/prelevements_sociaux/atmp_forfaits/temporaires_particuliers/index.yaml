description: "Forfait des travailleurs employés temporairement auprès des particuliers (article 7)"
documentation: |-
  Assiette = SMIG × 200 heures par mois × coefficient 1 (ordinaires) ou 2 (qualifiés). Les
  cotisations suivent la période d'emploi, tout mois commencé comptant pour un mois entier. Le
  taux applicable est celui de la branche d'activité, que l'article ne désigne pas.
