  reference:
    2002-05-07:
    - title: "Loi n° 2002-32 du 12 mars 2002 relative au régime de sécurité sociale pour certaines catégories de travailleurs dans les secteurs agricole et non agricole, article 7"
      href: "https://www.pist.tn/jort/2002/2002F/Jo0222002.pdf"
      note: "JORT n° 22, p. 603. L'article fixe en une phrase le taux global de 7,5 %, l'assiette — les deux tiers du SMIG ou du SMAG selon la catégorie — et la clé deux tiers employeur / un tiers salarié. La loi ne porte pas de clause d'entrée en vigueur : elle devient exécutoire le 21 mars 2002, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 16 mars 2002. Les valeurs par branche ne commencent pourtant qu'avec le décret n° 2002-916 : la loi fixe le taux global et la clé employeur / salarié, mais seul le décret ventile le taux par branche. Attention : le seuil de 0,66 encodé ici traduit cette assiette forfaitaire des deux tiers, et non un plafond au-delà duquel le prélèvement cesserait. Édition arabe : https://www.pist.tn/jort/2002/2002A/Ja0222002.pdf"
    - title: "Décret n° 2002-916 du 22 avril 2002 fixant les modalités d'application de la loi n° 2002-32, articles 13 à 15"
      href: "https://www.pist.tn/jort/2002/2002F/Jo0352002.pdf"
      note: "JORT n° 35 du 30 avril 2002, p. 1058-1061. Le décret ne porte pas de clause d'entrée en vigueur, son article 31 n'étant que la clause d'exécution : il devient exécutoire le 7 mai 2002, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 2 mai 2002. L'article 14 ventile les 7,5 % par branche — 2,5 points de soins et 5 points de pensions — et l'article 15 par payeur — 5 points employeur et 2,5 points salarié. Les deux répartitions ne sont jamais croisées par un texte : les quatre valeurs de ce régime (3,3333 / 1,6667 / 1,6667 / 0,8333) résultent d'un croisement opéré par le modèle. Édition arabe : https://www.pist.tn/jort/2002/2002A/Ja0352002.pdf"
  official_journal_date:
    2002-05-07: "2002-04-30"
