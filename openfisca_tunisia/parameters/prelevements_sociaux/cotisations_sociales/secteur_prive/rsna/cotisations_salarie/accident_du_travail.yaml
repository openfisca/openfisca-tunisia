  reference:
    1995-01-01:
    - title: "Décret n° 95-538 du 1er avril 1995 relatif à la fixation des taux de cotisations au régime de réparation des préjudices résultant des accidents du travail et des maladies professionnelles, article 2"
      href: "https://www.pist.tn/jort/1995/1995F/Jo03095.pdf"
      note: "JORT n° 30 du 14 avril 1995, p. 690-693. Le décret entre en vigueur « à compter du 1er janvier 1995 » (article 28 ; édition arabe, p. 693 : « بداية من أول جانفي 1995 »), et non à sa date de signature. Opère le transfert d'un point des cotisations du régime général vers le régime de réparation des accidents du travail. Attention : ce point transféré n'est pas la cotisation d'accidents du travail elle-même, qui est patronale et varie de 0,50 % à 5 % selon dix-huit classes d'activité. Ce paramètre décrit le transfert, non le tarif. Édition arabe : https://www.pist.tn/jort/1995/1995A/Ja03095.pdf"
