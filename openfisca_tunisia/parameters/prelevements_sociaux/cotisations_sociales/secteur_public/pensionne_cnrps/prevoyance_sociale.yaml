documentation: |-
  Régime obligatoire de prévoyance sociale des titulaires de pension de la CNRPS. Le décret
  n° 73-91 (article 15) fixe la cotisation du retraité et de la veuve de retraité à 2 % de la
  pension en principal, au 1er avril 1973. Le décret n° 2007-1406 (articles 12 et 13) échelonne
  ensuite, de 2007 à 2010, le taux du régime de base d'assurance maladie des titulaires de pension
  affiliés à la CNRPS, de 1 % à 4 %. L'assiette est le montant brut de la pension (article 2).
