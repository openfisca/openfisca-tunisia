description: Régime de retraite des députés (loi n° 85-16 du 8 mars 1985)
metadata:
  short_label: Députés
  order:
  - retenue
  - contribution_etat
documentation: |-
  L'article 5 de la loi n° 85-16 du 8 mars 1985 soumet les indemnités parlementaires
  permanentes à une retenue pour pension au profit de la Caisse nationale de retraite et de
  prévoyance sociale, qui reçoit en outre une contribution de l'État prélevée sur le budget de la
  chambre des députés. Les deux taux s'appliquent à la même assiette.

  Quatre textes les ont modifiés : la loi n° 94-71 du 27 juin 1994, l'article 85 de la loi de
  finances pour 2002, l'article premier de la loi n° 2007-43 du 25 juin 2007, qui relèvent les
  taux par paliers, et les articles 102 et 103 de la loi de finances pour 2026, qui abrogent et
  remplacent l'article 5 avec effet au 13 mars 2023. Les taux intermédiaires sont le cumul des
  relèvements.

  Le régime s'étend aux membres de la chambre des conseillers (loi n° 2005-54 du 18 juillet 2005)
  et, sous des conditions propres, aux membres de l'Assemblée nationale constituante (loi
  n° 2015-39 du 22 septembre 2015).

  Le décret-loi n° 2011-48 du 4 juin 2011 relève d'un point, au 1er juillet 2011, la contribution
  de l'employeur des régimes des fonctionnaires, des membres du gouvernement et des gouverneurs,
  sans nommer la loi n° 85-16 : la série n'en porte pas de palier. La loi n° 2019-37, qui modifie
  la loi n° 85-12, n'y en porte pas non plus.
