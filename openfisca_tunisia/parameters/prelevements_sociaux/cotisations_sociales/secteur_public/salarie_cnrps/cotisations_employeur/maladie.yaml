metadata:
  reference:
    1973-04-01:
    - title: "Décret n° 73-91 du 12 mars 1973 portant organisation des régimes de prévoyance sociale, article 16"
      href: "https://www.pist.tn/jort/1973/1973F/Jo01073.pdf"
      note: "JORT n° 10 des 9, 13 et 16 mars 1973, p. 356. Article 16 : « La contribution de l'Etat aux régimes obligatoires des prestations en nature et de Prévoyance Sociale est fixée à 1 % et assise sur les éléments de la rémunération soumise à retenue pour pension. » L'article 18 fait prendre effet le décret au 1er avril 1973. La date de 1959 que portait ce fichier était sans appui textuel. Lu à l'image (édition française scannée). Édition arabe : https://www.pist.tn/jort/1973/1973A/Ja01073.pdf"
    - title: "الأمر عدد 91 لسنة 1973 المؤرخ في 12 مارس 1973 المتعلق بضبط الأنظمة المتعلقة بالحيطة الاجتماعية، الفصل 16"
      href: "https://www.pist.tn/jort/1973/1973A/Ja01073.pdf"
    2007-07-01:
    - title: "Décret n° 2007-1406 du 18 juin 2007 fixant l'assiette de calcul des taux de cotisations dues au titre du régime de base d'assurance maladie et ses étapes d'application, article 4"
      href: "https://www.pist.tn/jort/2007/2007F/Jo0492007.pdf"
      note: "JORT n° 49 du 19 juin 2007, p. 2157. Article 4, régime obligatoire de prévoyance des affiliés à la CNRPS en activité : au 1er juillet 2007 le taux global passe à 3 %, dont « 2 % au titre des cotisations en application […] prévu par le décret n° 73-91 » (soit 1 % salarié + 1 % employeur) et « 1 % au titre des cotisations supplémentaires à la charge de l'employeur ». La part employeur passe donc de 1 % à 2 %. Édition arabe : https://www.pist.tn/jort/2007/2007A/Ja0492007.pdf"
    - title: "أمر عدد 1406 لسنة 2007 مؤرخ في 18 جوان 2007 يتعلق بضبط قاعدة احتساب نسب الاشتراكات المستوجبة بعنوان النظام القاعدي للتأمين على المرض ومرحلية تطبيقها، الفصل 4"
      href: "https://www.pist.tn/jort/2007/2007A/Ja0492007.pdf"
    2008-07-01:
    - title: "Décret n° 2007-1406 du 18 juin 2007, article 4, 2)"
      href: "https://www.pist.tn/jort/2007/2007F/Jo0492007.pdf"
      note: "Au 1er juillet 2008 le taux global est relevé de 3 % à 4,88 % ; le relèvement de 1,88 % se répartit en 1 % à la charge de l'employeur et 0,88 % à la charge du salarié. La part employeur passe de 2 % à 3 %."
    2009-07-01:
    - title: "Décret n° 2007-1406 du 18 juin 2007, article 4, 3)"
      href: "https://www.pist.tn/jort/2007/2007F/Jo0492007.pdf"
      note: "Au 1er juillet 2009 le taux global est relevé de 4,88 % à 6,75 % ; le relèvement de 1,87 % se répartit en 1 % à la charge de l'employeur et 0,87 % à la charge du salarié. La part employeur passe de 3 % à 4 %."
  rate_unit: /1
  threshold_unit: currency
documentation: |-
  Part employeur du régime obligatoire de prévoyance sociale puis du régime de base d'assurance
  maladie des agents de la CNRPS en activité. Contribution de l'État de 1 % au 1er avril 1973
  (décret n° 73-91, article 16), portée à 2, 3 puis 4 % par la montée en charge du régime de base
  d'assurance maladie (décret n° 2007-1406, article 4). Le régime facultatif d'assurance maladie de
  l'article 5 du même décret (assurés ayant adhéré au régime de la loi n° 72-2) n'est pas modélisé.
