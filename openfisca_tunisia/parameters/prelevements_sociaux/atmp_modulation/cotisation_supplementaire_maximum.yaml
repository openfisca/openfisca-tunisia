description: "Taux maximal de la cotisation supplémentaire, en proportion des cotisations principales (articles 17 et 18)"
values:
  1995-01-01:
    value: 1.0
metadata:
  unit: "/1"
  short_label: "Cotisation supplémentaire max."
  reference:
    1995-01-01:
    - title: "Décret n° 95-538 du 1er avril 1995, relatif à la fixation des taux de cotisations au régime de réparation des préjudices résultant des accidents du travail et des maladies professionnelles, articles 17 et 18"
      href: "https://www.pist.tn/jort/1995/1995F/Jo03095.pdf"
      note: "JORT n° 30 du 14 avril 1995, pp. 690-693 (éd. française), pp. 691-692 (éd. arabe) ; entrée en vigueur le 1er janvier 1995 (article 28). Le taux de 50 % peut être doublé (article 17) ; en cas de refus ou de négligence persistant six mois après cette majoration, « les cotisations supplémentaires sont portées à 100 % des cotisations principales » (article 18). L'édition arabe, lue à l'image, fait foi : https://www.pist.tn/jort/1995/1995A/Ja03095.pdf"
