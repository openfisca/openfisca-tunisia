description: "Taux de la cotisation supplémentaire, en proportion des cotisations principales (article 17)"
values:
  1995-01-01:
    value: 0.5
metadata:
  unit: "/1"
  short_label: "Cotisation supplémentaire"
  reference:
    1995-01-01:
    - title: "Décret n° 95-538 du 1er avril 1995, relatif à la fixation des taux de cotisations au régime de réparation des préjudices résultant des accidents du travail et des maladies professionnelles, article 17"
      href: "https://www.pist.tn/jort/1995/1995F/Jo03095.pdf"
      note: "JORT n° 30 du 14 avril 1995, pp. 690-693 (éd. française), pp. 691-692 (éd. arabe) ; entrée en vigueur le 1er janvier 1995 (article 28). « Le taux de la cotisation supplémentaire est fixé à 50 % des cotisations principales. Ce taux peut être doublé » (mesures non exécutées dans les 6 mois, ou récidive dans les 3 ans pour un risque de même nature). L'édition arabe, lue à l'image, fait foi : https://www.pist.tn/jort/1995/1995A/Ja03095.pdf"
