description: "Majoration et réduction de la cotisation d'accidents du travail et de maladies professionnelles, en proportion des cotisations principales (décret n° 95-538, articles 10 à 27)"
metadata:
  reference:
    1995-01-01:
    - title: "Décret n° 95-538 du 1er avril 1995, relatif à la fixation des taux de cotisations au régime de réparation des préjudices résultant des accidents du travail et des maladies professionnelles, articles 10 à 27"
      href: "https://www.pist.tn/jort/1995/1995F/Jo03095.pdf"
      note: "JORT n° 30 du 14 avril 1995, pp. 690-693 (éd. française), pp. 691-692 (éd. arabe) ; entrée en vigueur le 1er janvier 1995 (article 28). Les articles 10 à 27 règlent la majoration et la réduction de la cotisation. L'édition arabe, lue à l'image, fait foi : https://www.pist.tn/jort/1995/1995A/Ja03095.pdf"
documentation: |-
  La CNSS peut majorer la cotisation en cas de manquement aux règles d'hygiène et de sécurité ou
  de risques exceptionnels (cotisation supplémentaire), ou la réduire pour l'employeur qui réduit
  la fréquence et la gravité des accidents. Ces décisions sont individuelles et propres à chaque
  employeur ; les quotités sont portées ici, mais leur application à un cas donné dépend de la
  décision de la CNSS.
