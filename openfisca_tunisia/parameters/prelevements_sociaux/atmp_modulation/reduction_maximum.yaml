description: "Plafond de la réduction du taux de cotisation principale (article 24)"
values:
  1995-01-01:
    value: 0.25
metadata:
  unit: "/1"
  short_label: "Réduction maximale"
  reference:
    1995-01-01:
    - title: "Décret n° 95-538 du 1er avril 1995, relatif à la fixation des taux de cotisations au régime de réparation des préjudices résultant des accidents du travail et des maladies professionnelles, article 24"
      href: "https://www.pist.tn/jort/1995/1995F/Jo03095.pdf"
      note: "JORT n° 30 du 14 avril 1995, pp. 690-693 (éd. française), pp. 691-692 (éd. arabe) ; entrée en vigueur le 1er janvier 1995 (article 28). « En tout état de cause, la réduction du taux de cotisation principale, pour tout employeur, ne peut dépasser 25 %. » L'édition arabe, lue à l'image, fait foi : https://www.pist.tn/jort/1995/1995A/Ja03095.pdf"
