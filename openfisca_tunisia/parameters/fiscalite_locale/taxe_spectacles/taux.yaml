description: "Taux de la taxe sur les spectacles"
values:
  1997-01-01:
    value: 0.06
metadata:
  unit: /1
  short_label: "Taux"
  reference:
    1997-01-01:
    - title: "Code de la fiscalité locale, article 49 ; loi n° 97-11 du 3 février 1997, portant promulgation du code de la fiscalité locale, article 3"
      href: https://www.pist.tn/jort/1997/1997F/Jo01197.pdf
      note: "JORT n° 11 du 7 février 1997, p. 178 (article 49 du code) et p. 173 (article 3 de la loi). Article 49 : « La taxe sur les spectacles est fixée à 6 pour-cent. » Date d'effet : article 3 de la loi de promulgation, p. 173 — « Les dispositions du présent code entrent en vigueur à compter du premier janvier 1997 » ; le fascicule est du 7 février 1997, la date énoncée par la loi est reprise telle quelle. Édition française lue sur la couche texte du fascicule, pp. 173 et 178 ; l'édition arabe n'est pas relue pour cet article : https://www.pist.tn/jort/1997/1997A/Ja01197.pdf"
documentation: |-
  Taux appliqué à l'assiette de la taxe sur les spectacles, soit à la moitié des recettes
  prévisionnelles (`part_recettes_previsionnelles`). L'article 49 du code énonce le taux sans
  rappeler l'assiette, que fixe l'article 48.

  Le défaut de paiement donne lieu à une pénalité égale au double du droit exigible (article 51) ;
  elle n'est pas versée.

  Aucune modification de l'article 49 n'est relevée dans les lois de finances dépouillées.
