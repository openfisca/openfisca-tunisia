description: "Part des recettes prévisionnelles retenue dans l'assiette de la taxe sur les spectacles"
values:
  1997-01-01:
    value: 0.5
metadata:
  unit: /1
  short_label: "Part des recettes prévisionnelles"
  reference:
    1997-01-01:
    - title: "Code de la fiscalité locale, article 48 ; loi n° 97-11 du 3 février 1997, portant promulgation du code de la fiscalité locale, article 3"
      href: https://www.pist.tn/jort/1997/1997F/Jo01197.pdf
      note: "JORT n° 11 du 7 février 1997, p. 178 (article 48 du code) et p. 173 (article 3 de la loi). Article 48 : « La taxe est calculée sur la base de 50 pour-cent des recettes prévisionnelles, en considération du nombre de places offertes et du prix des billets. » Date d'effet : article 3 de la loi de promulgation, p. 173 — « Les dispositions du présent code entrent en vigueur à compter du premier janvier 1997 » ; le fascicule est du 7 février 1997, la date énoncée par la loi est reprise telle quelle. Édition française lue sur la couche texte du fascicule, pp. 173 et 178, le taux étant relu à l'image, p. 178 ; l'édition arabe n'est pas relue pour cet article : https://www.pist.tn/jort/1997/1997A/Ja01197.pdf"
documentation: |-
  Fraction des recettes prévisionnelles d'un spectacle occasionnel sur laquelle la taxe est calculée
  ; ces recettes s'apprécient d'après le nombre de places offertes et le prix des billets (code de
  la fiscalité locale, article 48). Le taux de la taxe (`taux`) s'applique à cette fraction.

  Aucune modification de l'article 48 n'est relevée dans les lois de finances dépouillées.
