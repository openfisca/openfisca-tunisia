description: "Fraction du prix de référence du mètre carré couvert retenue pour l'assiette de la taxe sur les immeubles bâtis"
values:
  1997-01-01:
    value: 0.02
metadata:
  unit: /1
  short_label: "Taux d'assiette"
  reference:
    1997-01-01:
    - title: "Code de la fiscalité locale, article 4, paragraphe I ; loi n° 97-11 du 3 février 1997, portant promulgation du code de la fiscalité locale, article 3"
      href: https://www.pist.tn/jort/1997/1997F/Jo01197.pdf
      note: "JORT n° 11 du 7 février 1997, p. 174 (article 4, paragraphe I du code) et p. 173 (article 3 de la loi). Article 4, paragraphe I : « La taxe sur les immeubles bâtis est assise sur la base de 2 pour-cent du prix de référence du mètre carré couvert fixé pour chaque catégorie d'immeubles visée au paragraphe II du présent article, multiplié par la superficie couverte de l'immeuble. » Édition arabe : « على أساس 2 بالمائة من الثمن المرجعي للمتر المربع المبني ». Date d'effet : article 3 de la loi de promulgation, p. 173 — « Les dispositions du présent code entrent en vigueur à compter du premier janvier 1997 » ; le fascicule est du 7 février 1997, la date énoncée par la loi est reprise telle quelle. Édition française lue sur la couche texte du fascicule ; édition arabe lue à l'image, même page : https://www.pist.tn/jort/1997/1997A/Ja01197.pdf"
documentation: |-
  L'assiette de la taxe est égale à cette fraction du prix de référence du mètre carré couvert de
  la catégorie de l'immeuble, multipliée par sa superficie couverte (code de la fiscalité locale,
  article 4, paragraphe I).

  Pour les immeubles loués soumis à la législation sur le droit au maintien dans les lieux,
  l'assiette ne peut excéder le montant du loyer (article 4, paragraphe V).
