description: "Limites du prix de référence du mètre carré couvert des immeubles de la deuxième catégorie"
metadata:
  short_label: "Catégorie 2"
  order:
  - minimum
  - maximum
documentation: |-
  Deuxième catégorie : immeubles dont la superficie couverte excède 100 mètres carrés et ne dépasse pas 200 mètres carrés (code de la fiscalité locale,
  article 4, paragraphe II).
