description: "Taux de la taxe sur les immeubles bâtis pour un immeuble bénéficiant de un ou deux services"
values:
  1997-01-01:
    value: 0.08
metadata:
  unit: /1
  short_label: "Un ou deux services"
  reference:
    1997-01-01:
    - title: "Code de la fiscalité locale, article 5, paragraphe I ; loi n° 97-11 du 3 février 1997, portant promulgation du code de la fiscalité locale, article 3"
      href: https://www.pist.tn/jort/1997/1997F/Jo01197.pdf
      note: "JORT n° 11 du 7 février 1997, p. 174 (article 5, paragraphe I du code) et p. 173 (article 3 de la loi). Article 5, paragraphe I : « 8 pour-cent pour les immeubles bénéficiant d'un ou de deux services ». Édition arabe : « 8 بالمائة بالنسبة للعقارات المنتفعة بخدمة أو خدمتين ». Date d'effet : article 3 de la loi de promulgation, p. 173 — « Les dispositions du présent code entrent en vigueur à compter du premier janvier 1997 » ; le fascicule est du 7 février 1997, la date énoncée par la loi est reprise telle quelle. Édition française lue sur la couche texte du fascicule, pp. 173 et 174 ; édition arabe : article 5, paragraphe I du code lu à l'image, p. 174 ; l'article 3 de la loi n'est lu que dans l'édition française. Édition arabe : https://www.pist.tn/jort/1997/1997A/Ja01197.pdf"
documentation: |-
  Premier palier : l'immeuble bénéficie d'un ou de deux des six services énumérés à l'article 5, paragraphe II.
