description: "Taux de la taxe sur les immeubles bâtis pour un immeuble bénéficiant de trois ou quatre services"
values:
  1997-01-01:
    value: 0.10
metadata:
  unit: /1
  short_label: "Trois ou quatre services"
  reference:
    1997-01-01:
    - title: "Code de la fiscalité locale, article 5, paragraphe I ; loi n° 97-11 du 3 février 1997, portant promulgation du code de la fiscalité locale, article 3"
      href: https://www.pist.tn/jort/1997/1997F/Jo01197.pdf
      note: "JORT n° 11 du 7 février 1997, p. 174 (article 5, paragraphe I du code) et p. 173 (article 3 de la loi). Article 5, paragraphe I : « 10 pour-cent pour les immeubles bénéficiant de trois ou quatre services ». Édition arabe : « 10 بالمائة بالنسبة للعقارات المنتفعة بثلاث أو اربع خدمات ». Date d'effet : article 3 de la loi de promulgation, p. 173 — « Les dispositions du présent code entrent en vigueur à compter du premier janvier 1997 » ; le fascicule est du 7 février 1997, la date énoncée par la loi est reprise telle quelle. Édition française lue sur la couche texte du fascicule ; édition arabe lue à l'image, même page : https://www.pist.tn/jort/1997/1997A/Ja01197.pdf"
documentation: |-
  Deuxième palier : l'immeuble bénéficie de trois ou de quatre des six services énumérés à l'article 5, paragraphe II.
