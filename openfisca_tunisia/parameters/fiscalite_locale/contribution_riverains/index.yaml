description: "Contribution des propriétaires riverains aux dépenses de premier établissement et aux grandes réparations des voies, trottoirs et conduites d'évacuation des matières liquides"
metadata:
  short_label: "Contribution des riverains"
  order:
  - reduction_maximale
  - avance
documentation: |-
  Contribution due par les propriétaires riverains aux dépenses des travaux de premier établissement
  et des grandes réparations des voies, des trottoirs et des conduites d'évacuation des matières
  liquides, ainsi qu'aux travaux d'aménagement des quartiers résidentiels et des zones industrielles
  et touristiques, après un décret déclarant ces travaux d'utilité publique (code de la fiscalité
  locale, chapitre VI, articles 52 à 60).

  Elle est fixée sur la base du montant global des travaux adjugés, et répartie selon la longueur
  des façades pour les voies et les trottoirs, à égalité entre les riverains pour les autres travaux
  (article 53). Le code ne fixe donc pas de tarif national : ne sont versées que les grandeurs qu'il
  chiffre, la réduction que la collectivité pouvait accorder jusqu'en 2002 et les bornes du taux de
  l'avance.

  Le code des collectivités locales (loi organique n° 2018-29 du 9 mai 2018, article 391) prévoit
  que les articles 46 à 95 du code de la fiscalité locale cessent de s'appliquer, collectivité par
  collectivité, à mesure qu'entrent en vigueur ses propres délibérations tarifaires. Cette cessation
  n'a pas de date nationale : les valeurs versées ici ne sont pas closes à ce titre.
