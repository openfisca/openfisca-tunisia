description: "Taxe par mètre carré de référence du minimum de la taxe sur les établissements, immeubles de la première catégorie"
metadata:
  short_label: "Catégorie 1 : usage administratif, commercial ou non commercial"
  order:
  - taux_8
  - taux_10
  - taux_12
  - taux_14
documentation: |-
  Première catégorie : « immeuble destiné à un usage administratif ou à l'exercice d'une activité commerciale ou non commerciale » (code de la fiscalité locale, article 38,
  paragraphe II). Les trois décrets la désignent, dans la colonne « Spécificité de l'immeuble »
  de leur tableau, par : « Immeuble à usage administratif ou à l'exercice d'une activité commerciale ou non commerciale ».

  Catégorie d'usage, sans rapport avec la catégorie de superficie de même numéro de la taxe sur
  les immeubles bâtis.
