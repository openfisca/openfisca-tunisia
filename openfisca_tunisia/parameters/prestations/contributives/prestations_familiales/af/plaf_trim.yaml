documentation: |
  Plafond de la rémunération globale trimestrielle à laquelle s'appliquent les taux des
  allocations familiales (article 61 de la loi n° 60-30).

  Rédaction d'origine de l'article 61, 2e alinéa, lue à l'image dans les deux éditions du
  JORT n° 57 des 13-16 décembre 1960 (p. 1607 en français, p. 1945 en arabe) : « Toutefois,
  les parties des salaires, rémunérations ou gains ainsi déterminés, et dépassant 52 D, 500 par
  trimestre, n'entrent pas en compte pour le calcul des allocations familiales afférentes au
  trimestre considéré. » L'édition arabe porte « 500ر52 دينارا », soit 52,500 dinars. C'est un
  plafond unique de 52,500 dinars, et non une bande de 52 à 500 dinars comme on l'avait lu.

  La loi n° 75-82 porte le plafond à 72 dinars au 1er janvier 1976, avec un barème dégressif par
  rang, puis la loi n° 86-75 à 122 dinars au 1er mai 1986.

  Aucune valeur avant le 1er avril 1961 : le régime antérieur des allocations familiales,
  abrogé par l'article 131 de la loi n° 60-30, n'est pas établi ici.

  Date corrigée. La valeur de 122 dinars était encodée au 1er janvier 1960 en citant la loi
  n° 88-38 de 1988. C'est la loi n° 86-75 qui porte le plafond à 122 dinars, avec effet au
  1er mai 1986 ; la loi n° 88-38 supprime le quatrième rang, non le plafond.
