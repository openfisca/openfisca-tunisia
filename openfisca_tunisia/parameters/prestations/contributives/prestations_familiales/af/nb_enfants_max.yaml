description: Nombre maximal d'enfants ouvrant droit aux allocations familiales
values:
  1961-04-01:
    value: 4
  1989-01-01:
    value: 3
metadata:
  reference:
    1961-04-01:
      title: Article 52 de la loi n° 60-30 du 14 décembre 1960, JORT n° 57 des 13-16 décembre 1960, p. 1606 ; entrée en vigueur le 1er avril 1961 (art. 130, p. 1612)
      href: https://www.pist.tn/jort/1960/1960F/Jo05760.pdf
      note: "Article 130 : « La présente loi entre en vigueur le 1er avril 1961, sauf en ce qui concerne les dispositions prévues par les articles 1 à 33, 119, 124 à 126 et 129, qui sont d'application immédiate. » L'article 52 n'est pas de ceux-là."
    1989-01-01:
      title: Article premier de la loi n° 88-38 du 6 mai 1988, JORT n° 33 des 13-17 mai 1988, p. 735 ; effet au 1er janvier 1989 (art. 5)
      href: https://www.pist.tn/jort/1988/1988F/Jo03388.pdf
documentation: |
  Paramètre créé. Le plafond de rang n'était porté par aucun paramètre alors qu'il varie
  dans le temps : quatre jusqu'aux revenus de 1988, trois ensuite. L'issue #391 relève ce
  que cette absence entraînait.

  Article 52 d'origine : « Le cinquième enfant et suivants, dans l'ordre de primogéniture ou
  d'adoption, n'ouvrent, en aucun cas, droit aux allocations familiales. » L'article premier de
  la loi n° 88-38 ramène ce nombre à trois à compter du 1er janvier 1989.
