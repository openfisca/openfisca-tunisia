description: Âge jusqu'auquel l'enfant en apprentissage ouvre droit aux allocations familiales
values:
  1961-04-01:
    value: 18
metadata:
  unit: year
  reference:
    1961-04-01:
    - title: "Loi n° 60-30 du 14 décembre 1960 relative à l'organisation des régimes de sécurité sociale, article 54"
      href: "https://www.pist.tn/jort/1960/1960F/Jo05760.pdf"
      note: "JORT n° 57 des 13-16 décembre 1960, p. 1607, lu à l'image. Entrée en vigueur le 1er avril 1961 : « La présente loi entre en vigueur le 1er avril 1961, sauf en ce qui concerne les dispositions prévues par les articles 1 à 33, 119, 124 à 126 et 129, qui sont d'application immédiate » (article 130, p. 1612). « 2° jusqu'à l'âge de 18 ans, au titre des enfants en apprentissage qui ne perçoivent pas une rémunération supérieure à 75 % du salaire minimum légal du manœuvre du bâtiment »."
    1996-08-04:
    - title: "Loi n° 96-65 du 22 juillet 1996, amendant la loi n° 60-30 du 14 décembre 1960 relative à l'organisation des régimes de sécurité sociale, article unique (article 54 nouveau)"
      href: "https://www.pist.tn/jort/1996/1996F/Jo06096.pdf"
      note: "JORT n° 60 du 26 juillet 1996, p. 1603. La loi ne porte pas de clause d'entrée en vigueur : la date retenue est celle où elle devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2) ; le fascicule porte un dépôt le 30 juillet 1996. « 1) jusqu'à l'âge de 18 ans au titre des enfants en apprentissage qui ne perçoivent pas une rémunération supérieure à 75 % du salaire minimum interprofessionnel garanti, afférent au régime 48 heures » : âge inchangé."
documentation: |-
  L'âge n'a pas changé en 1996 ; la référence de 1996 est attachée sans valeur nouvelle. Ce
  qui change est le salaire de comparaison de la rémunération d'apprenti : 75 % du salaire
  minimum légal du manœuvre du bâtiment en 1961, 75 % du SMIG du régime de 48 heures depuis
  1996.
