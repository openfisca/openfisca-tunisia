  unit: currency
  short_label: Allocation gluten
  reference:
    2025-01-01:
    - title: "Loi n° 2024-48 du 9 décembre 2024, portant loi de finances pour l'année 2025, articles 26 et 84"
      href: https://www.pist.tn/jort/2024/2024A/Ja1492024.pdf
      note: "JORT n° 149 du 10 décembre 2024, p. 3427 (article 26) et p. 3456 (article 84) de l'édition française ; p. 6425 (article 26) et p. 6453 (article 84) de l'édition arabe. Rubrique « Appui aux patients allergiques au gluten issus de familles pauvres et à faible revenu ». Article 26 : « Est octroyée aux patients allergiques au gluten issus de familles pauvres et à faible revenu inscrits au programme “AMEN SOCIAL”, une allocation financière mensuelle de 30 dinars par personne au titre de la prise en charge des dépenses alimentaires. Les modalités d'octroi de ladite allocation sont fixées par arrêté conjoint du ministre chargé des affaires sociales, du ministre chargé de la santé et du ministre chargé des finances. » Article 84, 1) : « Les dispositions de la présente loi s'appliquent à compter du 1er janvier 2025 […] ». Édition française lue sur la couche texte d'une copie locale du fascicule ; pist.tn ne sert que l'édition arabe, vers laquelle pointe le lien, et dont l'article 26 a été relu sur l'image de la page 6425."
    - title: "Loi n° 2024-48 du 9 décembre 2024, portant loi de finances pour l'année 2025, article 26 (édition arabe)"
      href: https://www.pist.tn/jort/2024/2024A/Ja1492024.pdf
      note: "الرائد الرسمي عدد 149 بتاريخ 10 ديسمبر 2024، ص. 6425 : « الفصل 26 - تسند لمرضى حساسية دابوق القمح من العائلات الفقيرة ومحدودة الدخل المسجلة ببرنامج الأمان الاجتماعي منحة مالية شهرية تبلغ 30 دينار لكل فرد بعنوان مصاريف التكفل بنفقات الغذاء. »"
    2026-01-01:
    - title: "Loi n° 2025-17 du 12 décembre 2025, portant loi de finances pour l'année 2026, articles 35 et 110 (édition arabe)"
      href: https://www.pist.tn/jort/2025/2025A/Ja1482025.pdf
      note: "الرائد الرسمي عدد 148 بتاريخ 12 ديسمبر 2025، ص. 4238 : « الفصل 35 - […] كما تسند لمرضى حساسية دابوق القمح من العائلات الفقيرة ومحدودة الدخل المسجلة ببرنامج الأمان الاجتماعي منحة مالية شهرية بـ 130 دينار لكل فرد بعنوان التكفل بجزء من مصاريف اقتناء المستلزمات الغذائية. » ؛ ص. 4258 : « الفصل 110 - 1) تطبق أحكام هذا القانون بداية من غرة جانفي 2026 وذلك باستثناء الأحكام الواردة بالفصول 56 و60 و61 و62 من هذا القانون. » Traduction : article 35, deuxième alinéa, « Est également octroyée aux malades allergiques au gluten des familles pauvres et à revenu limité inscrites au programme Amen social une allocation financière mensuelle de 130 dinars par personne, au titre de la prise en charge d'une partie des dépenses d'acquisition des fournitures alimentaires » ; article 110 : application à compter du 1er janvier 2026, sauf les articles 56, 60, 61 et 62. Lu sur l'image des pages 4238 et 4258. Le fascicule n'a pas d'édition française : l'adresse de l'édition française sur pist.tn sert le fascicule arabe."
