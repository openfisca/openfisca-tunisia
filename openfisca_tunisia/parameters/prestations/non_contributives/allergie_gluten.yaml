documentation: |
  Allocation financière mensuelle servie à chaque personne allergique au gluten d'une famille
  pauvre ou à revenu limité inscrite au programme Amen social, pour ses dépenses alimentaires.

  Deux lois, deux montants, deux dates énoncées et reprises telles quelles : 30 dinars par mois
  et par personne au 1er janvier 2025 (loi de finances pour 2025, article 26, appliqué à
  compter du 1er janvier 2025 par l'article 84) ; 130 dinars au 1er janvier 2026 (loi de
  finances pour 2026, article 35, deuxième alinéa, appliqué à compter du 1er janvier 2026 par
  l'article 110). L'allocation est créée par la loi de finances pour 2025 : il n'existe pas
  d'état antérieur.

  Articulation des deux articles. La loi de finances pour 2026 n'abroge pas expressément
  l'article 26 de la loi de finances pour 2025. Aucun texte lu ne dit si les 130 dinars
  remplacent les 30 dinars ou s'y ajoutent à partir du 1er janvier 2026. La valeur portée au
  1er janvier 2026 est le montant de l'article 35.

  Conditions et procédure, fixées par arrêté conjoint ; aucun des deux arrêtés ne fixe de
  montant :
  - arrêté conjoint du ministre des affaires sociales, du ministre de la santé et de la
    ministre des finances du 30 juillet 2025, pris pour l'article 26 de la loi de finances
    pour 2025 (JORT n° 99 du 7 août 2025, p. 1977 de l'édition française, p. 2359 de l'édition
    arabe ; https://www.pist.tn/jort/2025/2025F/Jo0992025.pdf). Demande écrite accompagnée
    d'un certificat médical d'un médecin de la santé publique selon un modèle annexé à la seule
    édition arabe, déposée selon les articles 11 et 12 du décret gouvernemental n° 2020-317 du
    19 mai 2020 (article premier) ; enregistrement au registre des données des catégories
    pauvres et des catégories à faible revenu (article 2) ; « entrera en vigueur à compter du
    1er janvier 2025 » (article 3) ;
  - arrêté conjoint des mêmes ministres du 14 juillet 2026, pris pour l'article 35 de la loi
    de finances pour 2026 (JORT n° 70 du 14 juillet 2026, pp. 1327-1328 de l'édition
    française, pp. 1408-1411 de l'édition arabe ;
    https://www.pist.tn/jort/2026/2026F/Jo0702026.pdf). L'allocation est accordée aux personnes
    atteintes de l'allergie au gluten « appartenant à des familles pauvres et à revenu limité
    inscrites au programme « Amen social » » (article premier) ; la preuve de la maladie est
    examinée par une commission médicale de trois médecins — affaires sociales, santé, Caisse
    nationale d'assurance maladie (article 2) ; les demandeurs sont enregistrés dans un
    registre de données spécifique (article 3) ; l'arrêté du 30 juillet 2025 est abrogé
    (article 4). Sans clause d'effet, l'arrêté est exécutoire le 19 juillet 2026, cinq jours
    après le dépôt du fascicule au siège du gouvernorat de Tunis le 14 juillet 2026, le jour
    du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2).

  Entre le 1er janvier et le 18 juillet 2026, l'article 35 n'a pas d'arrêté d'application
  publié, et l'arrêté de 2025 ne vise que l'article 26 de la loi de finances pour 2025.

  Les éditions françaises disent « à faible revenu » là où l'arrêté de 2026 dit « à revenu
  limité » ; l'arabe est constant (محدودة الدخل).
