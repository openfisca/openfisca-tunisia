documentation: |
  Allocation financière mensuelle servie à chaque personne atteinte de xeroderma pigmentosum,
  pour une partie de ses frais d'équipements de protection : 130 dinars par mois et par personne
  au 1er janvier 2026 (loi de finances pour 2026, article 35, premier alinéa, appliqué à compter
  du 1er janvier 2026 par l'article 110 ; date énoncée, reprise telle quelle). L'allocation est
  créée par cette loi : il n'existe pas d'état antérieur.

  La loi ne pose aucune condition de ressources. L'arrêté conjoint du ministre des affaires
  sociales, du ministre de la santé et de la ministre des finances du 14 juillet 2026, pris pour
  l'article 35 (JORT n° 70 du 14 juillet 2026, pp. 1327-1328 de l'édition française,
  pp. 1408-1411 de l'édition arabe ; https://www.pist.tn/jort/2026/2026F/Jo0702026.pdf), réserve
  l'allocation aux personnes atteintes « qui ne bénéficient d'aucun régime légal de couverture
  sociale » (article premier ; arabe : غير المشمولين بنظام قانوني للتغطية الاجتماعية). Il ne fixe
  aucun montant. La preuve de la maladie est examinée par une commission médicale de trois
  médecins — affaires sociales, santé, Caisse nationale d'assurance maladie (article 2) ; les
  demandeurs sont enregistrés dans un registre de données spécifique (article 3). Sans clause
  d'effet, l'arrêté est exécutoire le 19 juillet 2026, cinq jours après le dépôt du fascicule au
  siège du gouvernorat de Tunis le 14 juillet 2026, le jour du dépôt n'étant pas compté
  (loi n° 93-64 du 5 juillet 1993, article 2).

  Entre le 1er janvier et le 18 juillet 2026, l'article 35 n'a pas d'arrêté d'application publié.
