      href: https://www.pist.tn/jort/2020/2020A/Ja0452020.pdf
      note: "الرائد الرسمي عدد 45 بتاريخ 20 ماي 2020، ص. 1251 : « - مقدار أساسي للتحويل المالي بمبلغ قدره 180 دينار شهريا للفرد أو للأسرة الواحدة، »"
