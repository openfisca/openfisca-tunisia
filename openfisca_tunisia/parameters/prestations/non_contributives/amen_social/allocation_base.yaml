documentation: |
  Montant de base mensuel du transfert monétaire permanent, servi à la personne seule ou à la
  famille des catégories pauvres (article 11 de la loi organique n° 2019-10, que vise l'arrêté du
  19 mai 2020). Les suppléments par enfant à charge sont dans `supplements/`.

  Six textes, six paliers. L'arrêté conjoint du 19 mai 2020 fixe 180 dinars (article 2, premier
  tiret). Cinq arrêtés remplacent ensuite ce seul premier tiret, chacun avec une date d'effet
  énoncée, antérieure à sa publication : 200 dinars au 1er janvier 2022 (arrêté du 1er avril 2022,
  qui date le montant dans l'alinéa même), 220 dinars au 1er janvier 2023 (arrêté du 3 avril 2023,
  article 2), 240 dinars au 1er janvier 2024 (arrêté du 28 février 2024, article 2), 260 dinars au
  1er janvier 2025 (arrêté du 29 janvier 2025, article 2), 280 dinars au 1er janvier 2026 (arrêté
  du 21 avril 2026, article 2). Ces dates sont reprises telles quelles.

  Palier 2026 ajouté : la série s'arrêtait à 260 dinars.

  Date du premier palier corrigée. La valeur de 180 dinars était datée du 20 mai 2020, jour de la
  publication. L'arrêté du 19 mai 2020 ne porte pas de clause d'effet : il devient exécutoire cinq
  jours après le dépôt du fascicule au siège du gouvernorat de Tunis (20 mai 2020), le jour du
  dépôt n'étant pas compté (loi n° 93-64, article 2), soit le 25 mai 2020. Aucune valeur n'est
  portée avant cette date : aucun état antérieur de ce montant n'est établi ici.

  Références corrigées. Le premier palier citait un « arrêté conjoint 2020-931 » : l'arrêté ne
  porte pas de numéro au fascicule. Il citait aussi l'article 2 de la loi
  organique n° 2019-10 et le décret gouvernemental n° 2020-317, qui ne fixent pas ce montant. Les
  paliers de 2022 à 2024 ne citaient que le fascicule, sans texte ni article. La notice attribuait
  le palier de 2025 à un arrêté du « 29 août 2025 » : il est du 29 janvier 2025.

  Les clés `official_journal_date` portent la date du fascicule ; à partir de 2022 elle est
  postérieure à la date d'effet, que chaque arrêté énonce.

  Lu dans les deux éditions de chaque fascicule ; les pages sont dans les références. Les éditions
  françaises des arrêtés modificatifs parlent de l'« alinéa 1 » de l'article 2 là où les éditions
  arabes disent « premier tiret » (المطة الأولى).
