description: Montant de l'aide ponctuelle du programme Amen social délivrée pour la rentrée universitaire
values:
  2020-05-25:
    value: 120
metadata:
  short_label: Rentrée universitaire
  unit: currency
  reference:
    2020-05-25:
    - title: "Arrêté conjoint du ministre des affaires sociales et du ministre des finances du 19 mai 2020, fixant les cas de l'octroi et les montants de l'appui financier occasionnel au profit des catégories pauvres et des catégories à revenu limité, article 4"
      href: https://www.pist.tn/jort/2020/2020F/Jo0452020.pdf
      note: "JORT n° 45 du 20 mai 2020, pp. 1097-1098 ; article 4 p. 1098, dernière page du fascicule, qui ne porte pas de numéro : « - 120 dinars à l'occasion de la rentrée universitaire, au titre de chaque fils ou fille poursuivant un enseignement supérieur, payé au début de l'année universitaire. » L'arrêté ne porte pas de clause d'entrée en vigueur (son article 5 n'ordonne que la publication) : la date retenue est celle où il devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2). Le fascicule porte en dernière page : « Ce numéro du Journal Officiel de la République Tunisienne a été déposé au siège du gouvernorat de Tunis le 20 mai 2020 » : exécutoire le 25 mai 2020."
    - title: "Arrêté conjoint du ministre des affaires sociales et du ministre des finances du 19 mai 2020, fixant les cas de l'octroi et les montants de l'appui financier occasionnel au profit des catégories pauvres et des catégories à revenu limité, article 4 (édition arabe)"
      href: https://www.pist.tn/jort/2020/2020A/Ja0452020.pdf
      note: "الرائد الرسمي عدد 45 بتاريخ 20 ماي 2020، ص. 1251-1252 ؛ الفصل 4 ص. 1252 (الصفحة الأخيرة، غير مرقمة) : « - 120 دينارا بمناسبة العودة الجامعية بعنوان كل ابن […] »"
    2022-12-14:
    - title: "Arrêté du ministre des affaires sociales et de la ministre des finances du 8 décembre 2022, fixant les cas de l'octroi et les montants de l'appui financier occasionnel au profit des catégories pauvres et des catégories à revenu limité bénéficiant du programme Amen Social, article 4"
      href: https://www.pist.tn/jort/2022/2022F/Jo1362022.pdf
      note: "JORT n° 136 du 9 décembre 2022, pp. 3447-3448 ; article 4 p. 3448 : « - 120 dinars à l'occasion de la rentrée universitaire, au titre de chaque fille ou fils poursuivant un enseignement supérieur à un établissement public d'enseignement supérieur, payé au début de l'année universitaire, » L'article 5 abroge l'arrêté du 19 mai 2020. L'arrêté ne porte pas de clause d'entrée en vigueur (son article 6 n'ordonne que la publication) : la date retenue est celle où il devient exécutoire, cinq jours après le dépôt du fascicule au siège du gouvernorat de Tunis, le jour du dépôt n'étant pas compté (loi n° 93-64 du 5 juillet 1993, article 2). Le fascicule porte en dernière page : « Ce numéro du Journal Officiel de la République Tunisienne a été déposé au siège du gouvernorat de Tunis le 9 décembre 2022 » : exécutoire le 14 décembre 2022."
    - title: "Arrêté du ministre des affaires sociales et de la ministre des finances du 8 décembre 2022, fixant les cas de l'octroi et les montants de l'appui financier occasionnel au profit des catégories pauvres et des catégories à revenu limité bénéficiant du programme Amen Social, article 4 (édition arabe)"
      href: https://www.pist.tn/jort/2022/2022A/Ja1362022.pdf
      note: "الرائد الرسمي عدد 136 بتاريخ 9 ديسمبر 2022، ص. 3789-3790 ؛ الفصل 4 ص. 3789 : « 120 دينارا بمناسبة العودة الجامعية بعنوان كل بنت أو ابن […] »"
  official_journal_date:
