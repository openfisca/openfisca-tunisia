description: Droit de timbre sur les passeports délivrés aux personnes autres que les étudiants et élèves
values:
  '1993-05-17':
    value: 21
  '1999-01-01':
    value: 30
  '2004-01-01':
    value: 35
  '2006-01-01':
    value: 60
  '2013-01-01':
    value: 80
metadata:
  unit: currency/unit
  short_label: Passeport
  notes:
    '1993-05-17':
    - note: 'Série incomplète : états antérieurs à 1993 non versés.'
  reference:
    '1993-05-17':
    - title: Loi n° 93-53 du 17 mai 1993, portant promulgation du code des droits d'enregistrement et
        de timbre, article 2 ; code, article 117, paragraphe II, numéro 7
      href: https://www.pist.tn/jort/1993/1993F/Jo03993.pdf
      note: 'JORT n° 39 du 25 mai 1993, p. 715 (loi, article 2) et p. 733 (code). Passeports délivrés
        aux autres personnes : 21 dinars. Date d''effet : article 2, I de la loi, p. 715 : « Les dispositions
        du code sus visé s''appliquent aux jugements, actes, contrats et mutations établis ou intervenus
        à compter de la promulgation de la présente loi », soit le 17 mai 1993. Édition française sans
        couche texte, lue à l''image.'
    '1999-01-01':
    - title: Loi n° 98-111 du 28 décembre 1998, portant loi de finances pour l'année 1999, articles 71
        et 76
      href: https://www.pist.tn/jort/1998/1998F/Jo10498.pdf
      note: 'JORT n° 104 des 29-31 décembre 1998, p. 2509. Rubrique « Relèvement du droit de timbre dû
        sur la carte d''identité nationale, la carte de séjour des étrangers et les passeports ». Article
        71 : passeports, 21 → 30 dinars. Article 76 (p. 2509) : application à compter du 1er janvier 1999.'
    '2004-01-01':
    - title: Loi n° 2003-80 du 29 décembre 2003, portant loi de finances pour l'année 2004, articles 56
        et 105
      href: https://www.pist.tn/jort/2003/2003F/Jo1042003.pdf
      note: 'JORT n° 104 du 30 décembre 2003, p. 3729. Article 56 : passeports, 30 → 35 dinars. Article
        105 : application à compter du 1er janvier 2004.'
    '2006-01-01':
    - title: Loi n° 2005-106 du 19 décembre 2005, portant loi de finances pour l'année 2006, articles
        45 et 62
      href: https://www.pist.tn/jort/2005/2005F/Jo1012005.pdf
      note: 'JORT n° 101 du 20 décembre 2005, p. 3602. Article 45 : « Passeports délivrés aux autres personnes
        ainsi que leur prorogation 60,000 ». Article 62 (p. 3604) : application à compter du 1er janvier
        2006.'
    '2013-01-01':
    - title: Loi n° 2012-27 du 29 décembre 2012, portant loi de finances pour l'année 2013, articles 49
        et 79
      href: https://www.pist.tn/jort/2013/2013F/Jo0012013.pdf
      note: 'JORT n° 1 du 1er janvier 2013, p. 14. Rubrique « Actualisation du tarif du droit de timbre
        ». Article 49 : « passeports délivrés aux autres personnes ainsi que leur prorogation 80,000 ».
        Article 79 (p. 28) : application à compter du 1er janvier 2013. Édition française lue sur la couche
        texte.'
documentation: |
  Droit dû sur la délivrance ou la prorogation d'un passeport, hors étudiants et élèves. Avant le
  code, 3,750 dinars au tarif de 1969, 6,500 dinars en 1975, 10 dinars en 1983. Inchangé au 1er
  janvier 2026.
