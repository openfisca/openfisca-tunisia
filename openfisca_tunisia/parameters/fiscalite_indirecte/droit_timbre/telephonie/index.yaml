  - par_dinar
  - supplement_recharge
documentation: |
  Droit de timbre sur les cartes et opérations de recharge du téléphone depuis 2006 (article 117,
  paragraphe I, numéros 8 à 8 ter du code), sur les factures de téléphonie post-payée du 25 mai 2012
  au 31 décembre 2017 (numéro 8 quater), et, depuis 2018, sur « les factures relatives aux services de
  téléphonie et aux services d'internet ainsi que les opérations de recharge y afférentes », hors
  internet des particuliers non destiné à un usage professionnel (numéro 8 nouveau). Le tarif est fixe
  par carte (2006-2012), par tranche de 5 dinars (2007-2017), ou proportionnel au montant (cartes de 5
  dinars au plus de 2012 à 2017, toutes les opérations depuis 2018). Depuis 2026, un montant
  supplémentaire frappe chaque recharge de téléphone mobile de 5 dinars ou plus, hors de l'article
  117.
