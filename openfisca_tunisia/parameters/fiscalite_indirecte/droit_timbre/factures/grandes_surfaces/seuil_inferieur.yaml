description: Montant de facture à partir duquel s'applique le tarif des grandes surfaces
values:
  '2026-01-01':
    value: 50
metadata:
  unit: currency
  short_label: Seuil inférieur
  reference:
    '2026-01-01':
    - title: Loi n° 2025-17 du 12 décembre 2025, portant loi de finances pour l'année 2026, article 20,
        paragraphes 6 et 7, et article 110
      href: https://www.pist.tn/jort/2025/2025A/Ja1482025.pdf
      note: 'JORT n° 148 du 12 décembre 2025, édition arabe, pp. 4233-4234. Rubrique « تعزيز موارد تمويل
        الصناديق الاجتماعية » (renforcement des ressources de financement des caisses sociales). Article
        20, paragraphe 6 (p. 4234) : numéro 6 bis ajouté au paragraphe I de l''article 117 du code : «
        الفواتير المسلمة من قبل المساحات التجارية الكبرى المنصوص عليها بمجلة التهيئة الترابية والتعمير
        والتي : يتراوح مبلغها من 50 دينار إلى 100 دينار 1,500 دينار عن كل فاتورة ؛ يفوق مبلغها 100 دينار
        2,000 دينار عن كل فاتورة » (factures délivrées par les grandes surfaces commerciales prévues par
        le code de l''aménagement du territoire et de l''urbanisme dont le montant va de 50 à 100 dinars
        : 1,500 dinar par facture ; dont le montant dépasse 100 dinars : 2,000 dinars par facture). Paragraphe
        7 : le produit de la hausse est affecté au compte de diversification des sources de la sécurité
        sociale. Article 110 (p. 4258) : application à compter du 1er janvier 2026, sauf les articles
        56, 60, 61 et 62. Édition arabe lue sur la couche texte et à l''image de la p. 4234 ; le fascicule
        n''a pas d''édition française, la traduction donnée ici n''est pas officielle.'
documentation: |
  Montant de la facture, 50 dinars inclus, à partir duquel s'applique le tarif de 1,500 dinar.
