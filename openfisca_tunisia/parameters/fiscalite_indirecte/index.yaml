documentation: Paramètres de la fiscalité indirecte en Tunisie.\nComprend la TVA, les
  droits d'accise, les droits d'enregistrement, le droit de timbre, la taxe unique sur les
  assurances et les prélèvements perçus en douane (redevance de prestations douanières, minimum
  de perception, taxe de contrôle par scanner).
