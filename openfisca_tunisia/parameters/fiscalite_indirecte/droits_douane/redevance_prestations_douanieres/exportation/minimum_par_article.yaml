description: Minimum de perception de la redevance de prestations douanières à l'exportation, par article
  de déclaration
values:
  '1988-01-02':
    value: 1
  '1999-01-01':
    value: 1
metadata:
  unit: currency/unit
  short_label: Minimum à l'exportation
  reference:
    '1988-01-02':
    - title: Loi n° 87-83 du 31 décembre 1987, portant loi de finances pour la gestion 1988, article 51
      href: https://www.pist.tn/jort/1987/1987F/Jo09187.pdf
      note: 'JORT n° 91 des 29-31 décembre 1987, p. 1632. Article 51, 1) : « un minimum de perception
        de un dinar (1d) par article de déclaration » sur les déclarations d''exportation en simple sortie
        des produits du tableau. Date d''effet : la loi n''a pas de clause générale d''application ; avant
        1993, elle devient exécutoire un jour franc après la publication au Journal officiel, soit le
        2 janvier 1988.'
    '1999-01-01':
    - title: Loi n° 98-111 du 28 décembre 1998, portant loi de finances pour l'année 1999, article 32
      href: https://www.pist.tn/jort/1998/1998F/Jo10498.pdf
      note: 'JORT n° 104 des 29-31 décembre 1998, p. 2503. Article 32, article 51 (nouveau) : minimum
        « de un dinar par article de déclaration » pour le pétrole brut (position 27-09). Date d''effet
        : date d''application de la loi de finances, le 1er janvier.'
