description: Maximum de perception du droit fixe des marchés et concessions, en proportion de leur valeur
values:
  '2005-01-01':
    value: 0.02
  '2013-01-01':
    value: null
metadata:
  unit: /1
  short_label: Maximum de perception
  reference:
    '2005-01-01':
    - title: Loi n° 2004-90 du 31 décembre 2004, portant loi de finances pour l'année 2005, articles 55
        et 89
      href: https://www.pist.tn/jort/2004/2004F/Jo1052004.pdf
      note: 'JORT n° 105 du 31 décembre 2004, p. 3441. Article 55, deuxième alinéa du paragraphe I de
        l''article 22 du code : « Le montant maximum de perception pour les concessions et marchés est
        fixé à 2 % de leur valeur ». Article 89 : application à compter du 1er janvier 2005. Articles
        54, 55 et 57 lus à l''image.'
    '2013-01-01':
    - title: Loi n° 2012-27 du 29 décembre 2012, portant loi de finances pour l'année 2013, articles 54
        et 79
      href: https://www.pist.tn/jort/2013/2013F/Jo0012013.pdf
      note: 'JORT n° 1 du 1er janvier 2013, p. 16. Article 54 : sont abrogées « 2- les dispositions du
        deuxième alinéa du paragraphe I de l''article 22 du code des droits d''enregistrement et de timbre
        ». Article 79 (p. 28) : application à compter du 1er janvier 2013. Édition française lue sur la
        couche texte.'
documentation: |
  Plafond du droit fixe des marchés et concessions, du 1er janvier 2005 au 31 décembre 2012.
