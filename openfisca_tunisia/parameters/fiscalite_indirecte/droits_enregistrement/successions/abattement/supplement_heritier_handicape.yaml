description: "Abattement supplémentaire sur la part revenant à chaque héritier handicapé"
values:
  1993-05-17:
    value: 4000
  1998-08-17:
    value: 10000
metadata:
  unit: currency
  short_label: "Abattement supplémentaire, héritier handicapé"
  notes:
    1993-05-17:
    - note: "Série incomplète : états antérieurs à 1993 non versés."
  reference:
    1993-05-17:
    - title: "Loi n° 93-53 du 17 mai 1993, portant promulgation du code des droits d'enregistrement et de timbre, article 2 ; code, article 51"
      href: https://www.pist.tn/jort/1993/1993F/Jo03993.pdf
      note: "JORT n° 39 du 25 mai 1993, p. 715 (loi, article 2) et p. 725 (code, article 51). Article 51, II : « Par dérogation aux dispositions du paragraphe I du présent article, il est effectué sur la part revenant à chaque personne handicapée un abattement supplémentaire de 4 000 dinars. » Date d'effet : article 2, I de la loi, p. 715 : « Les dispositions du code sus visé s'appliquent aux jugements, actes, contrats et mutations établis ou intervenus à compter de la promulgation de la présente loi », soit le 17 mai 1993. Le second alinéa du même paragraphe étend le code aux mutations antérieures dont l'enregistrement intervient avant le 1er janvier 1994, ou avant l'expiration du délai légal lorsqu'elle se situe après le 31 décembre 1993 ; les trop perçus ne sont pas restitués (article 2, II). Édition française lue à l'image ; l'édition arabe n'est pas relue."
    1998-08-17:
    - title: "Loi n° 98-73 du 4 août 1998, portant simplification des procédures fiscales et réduction des taux de l'impôt, article 10"
      href: https://www.pist.tn/jort/1998/1998F/Jo06498.pdf
      note: "JORT n° 64 du 11 août 1998, p. 1737. Rubrique « Relèvement du montant des abattements de l'actif successoral ». Article 10 : « Est relevé à 10 000 dinars de l'abattement supplémentaire revenant à chaque héritier handicapé prévu au paragraphe II de l'article 51 du code des droits d'enregistrement et de timbre. » Date d'effet : la loi n'en fixe pas ; elle est exécutoire cinq jours après le dépôt du Journal officiel au siège du gouvernorat de Tunis, jour du dépôt non compté (loi n° 93-64 du 5 juillet 1993, article 2). La dernière page du fascicule porte : « Ce numéro du Journal Officiel de la République Tunisienne a été déposé au siège du gouvernorat de Tunis le 12 août 1998 » ; d'où le 17 août 1998. L'article 12 (p. 1737), sous la rubrique « Date d'entrée en vigueur de la loi », ne fixe pas de date de début : il étend la loi aux mutations effectuées avant sa promulgation dont l'enregistrement est effectué dans l'année qui suit, sans restitution des sommes acquittées. Édition française lue sur la couche texte, p. 1737 ; l'édition arabe n'est pas relue."
documentation: |-
  Abattement effectué sur la part revenant à chaque personne handicapée, par dérogation au
  paragraphe I de l'article 51 du code des droits d'enregistrement et de timbre (article 51, II).

  Aucune des lois de finances lues de 1975 à 1993 ne donne cet abattement ; le texte qui l'a
  institué, s'il est antérieur au code de 1993, n'est pas établi.
  Le code mis à jour au 1er janvier 2025 publié par le ministère des Finances donne 10 000 dinars, dans la rédaction de la loi n° 98-73 (p. 56). C'est une compilation administrative, non une source de droit.
