  reference:
    1984-01-01:
    - title: "Loi n° 83-113 du 30 décembre 1983, portant loi de finances pour la gestion 1984, article 12"
      href: https://www.pist.tn/jort/1983/1983F/Jo08683.pdf
      note: "JORT n° 86 du 30 décembre 1983, p. 3372. Article 12 : « Les droits de mutation par décès fixés par l'article 29 de la loi N° 74-101 du 25 décembre 1974 sont modifiés conformément au tableau ci-après ». Le tableau fixe six tranches de part nette : de 0,001 à 5 000 dinars, de 5 000,001 à 10 000, de 10 000,001 à 15 000, de 15 000,001 à 45 000, de 45 000,001 à 90 000, et au-delà de 90 000 dinars. Ligne « Entre parents au-delà du 4e degré et entre personnes non parentes » : 35 %, 45 %, 55 %, 65 %, 75 % et 85 %. Date d'effet : l'article n'en fixe pas ; la loi est exécutoire un jour franc après sa publication au Journal officiel (article 3 nouveau du décret du 27 janvier 1883, rédaction du décret du 13 septembre 1956). Le fascicule est publié le vendredi 30 décembre 1983, d'où le 1er janvier 1984. Édition française lue à l'image ; l'édition arabe n'est pas relue."
    1993-05-17:
    - title: "Loi n° 93-53 du 17 mai 1993, portant promulgation du code des droits d'enregistrement et de timbre, article 2 ; code, article 20, numéro 16"
      href: https://www.pist.tn/jort/1993/1993F/Jo03993.pdf
      note: "JORT n° 39 du 25 mai 1993, p. 715 (loi, article 2) et pp. 719-720 (code, article 20, numéro 16). Sous le titre « Mutations à titre gratuit de biens meubles et immeubles » : « 16) Les donations et les successions » ; ligne « Entre parents au delà du quatrième degré et entre personnes non parentes » : 35 %. Le taux est unique, sans tranche. Date d'effet : article 2, I de la loi, p. 715 : « Les dispositions du code sus visé s'appliquent aux jugements, actes, contrats et mutations établis ou intervenus à compter de la promulgation de la présente loi », soit le 17 mai 1993. Le second alinéa du même paragraphe étend le code aux mutations antérieures dont l'enregistrement intervient avant le 1er janvier 1994, ou avant l'expiration du délai légal lorsqu'elle se situe après le 31 décembre 1993 ; les trop perçus ne sont pas restitués (article 2, II). Édition française lue à l'image ; l'édition arabe n'est pas relue."
documentation: |-
  Taux du droit d'enregistrement sur la part nette recueillie entre parents au-delà du
  quatrième degré ou entre personnes non parentes.

  Du 1er janvier 1984 au 16 mai 1993, le taux dépend de la tranche de part nette recueillie
  par chaque ayant droit : six tranches, la même pour les quatre degrés de parenté. Le texte
  fixe un taux par tranche ; la règle d'application — taux de chaque tranche à la fraction de
  part qui y tombe, ou taux de la tranche atteinte à toute la part — n'est pas établie par les
  textes lus : la loi de finances pour 1975 (article 29), que modifie celle de 1984, ne la
  donne pas, et le décret du 28 décembre 1929 « substituant pour les droits de mutations par
  décès le tarif progressif au tarif proportionnel » n'est pas lu.

  Depuis le 17 mai 1993, le code des droits d'enregistrement et de timbre fixe un taux unique,
  sans tranche (article 20, numéro 16) : les tranches 2 à 6 sont closes à cette date. Ce taux
  vaut pour les donations comme pour les successions ; depuis la loi n° 2006-69 du 28 octobre
  2006, les donations entre ascendants et descendants et entre époux sont enregistrées à un
  droit fixe, qui n'est pas versé ici.

  Le code mis à jour au 1er janvier 2025 publié par le ministère des Finances (p. 31) donne le
  tarif de l'article 20, numéro 16, dans la rédaction de la loi n° 98-73, sans modification
  ultérieure. C'est une compilation administrative, non une source de droit.
