description: Minimum de perception sur les jugements des tribunaux de première instance
values:
  '1993-05-17':
    value: 10
  '2003-01-01':
    value: 20
  '2006-01-01':
    value: 30
  '2012-05-25':
    value: 40
  '2017-01-01':
    value: 40
metadata:
  unit: currency
  short_label: Première instance
  notes:
    '1993-05-17':
    - note: 'Série incomplète : états antérieurs à 1993 non versés.'
  reference:
    '1993-05-17':
    - title: Loi n° 93-53 du 17 mai 1993, portant promulgation du code des droits d'enregistrement et
        de timbre, article 2 ; code, article 22, II
      href: https://www.pist.tn/jort/1993/1993F/Jo03993.pdf
      note: 'JORT n° 39 du 25 mai 1993, p. 715 (loi, article 2) et pp. 721-722 (code). Minimum de perception
        des jugements et arrêts : 10 dinars (jugements des tribunaux de première instance). Date d''effet
        : article 2, I de la loi, p. 715 : « Les dispositions du code sus visé s''appliquent aux jugements,
        actes, contrats et mutations établis ou intervenus à compter de la promulgation de la présente
        loi », soit le 17 mai 1993. Édition française sans couche texte, lue à l''image.'
    '2003-01-01':
    - title: Loi n° 2002-101 du 17 décembre 2002, portant loi de finances pour l'année 2003, articles
        64 et 87
      href: https://www.pist.tn/jort/2002/2002F/Jo1022002.pdf
      note: 'JORT n° 102 du 17 décembre 2002, p. 2884. Rubrique « Révision du tarif du droit d''enregistrement
        minimum ». Article 64 : minimum des jugements des tribunaux cantonaux, de première instance, et
        des cours d''appel et de cassation porté à 10, 20 et 40 dinars ; ici 20 dinars. Article 87 : application
        à compter du 1er janvier 2003.'
    '2006-01-01':
    - title: Loi n° 2005-106 du 19 décembre 2005, portant loi de finances pour l'année 2006, articles
        48 et 62
      href: https://www.pist.tn/jort/2005/2005F/Jo1012005.pdf
      note: 'JORT n° 101 du 20 décembre 2005, p. 3602. Rubrique « Révision du tarif du droit d''enregistrement
        minimum ». Article 48, article 22, II nouveau du code : « jugements des tribunaux cantonaux :
        15 dinars ; jugements des tribunaux de première instance : 30 dinars » ; arrêts des cours d''appel
        et de cassation : 60 dinars ; ici 30 dinars. Article 62 (p. 3604) : application à compter du 1er
        janvier 2006.'
    '2012-05-25':
    - title: Loi n° 2012-1 du 16 mai 2012, portant loi de finances complémentaire pour l'année 2012, article
        45
      href: https://www.pist.tn/jort/2012/2012F/Jo0392012.pdf
      note: 'JORT n° 39 du 18 mai 2012, p. 929. Rubrique « Mise à jour du tarif minimum d''enregistrement
        ». Article 45, article 22, II nouveau du code : « jugements des tribunaux cantonaux 20 Dinars
        ; jugements des tribunaux de première instance 40 Dinars ; arrêts rendus par les cours d''appel
        et la cour de cassation et jugements et arrêts rendus par le tribunal administratif 75 Dinars
        » ; ici 40 dinars. Date d''effet : la loi n''en fixe pas. Le fascicule porte la mention « déposé
        au siège du gouvernorat de Tunis le 19 mai 2012 » ; les notes communes n° 14/2012, 16/2012 et
        25/2012 fixent l''entrée en vigueur de la loi au 25 mai 2012, en application de la loi n° 93-64
        (article 2). Compté cinq jours après le dépôt, jour du dépôt non compté, le délai donnerait le
        24 mai 2012 ; la date retenue est celle de l''administration fiscale, déjà employée pour les autres
        articles de cette loi. Édition française lue sur la couche texte.'
    '2017-01-01':
    - title: Loi n° 2016-78 du 17 décembre 2016, portant loi de finances pour l'année 2017, articles 69
        et 79
      href: https://www.pist.tn/jort/2016/2016F/Jo1052016.pdf
      note: 'JORT n° 105 du 27 décembre 2016, p. 3849. Article 69, paragraphe 3 : l''article 22 du code
        est abrogé et remplacé : « Il ne peut être perçu moins de 40 dinars pour l''enregistrement des
        actes, des mutations, des jugements et arrêts et des écrits soumis à un droit d''enregistrement
        proportionnel ou progressif ». Le minimum propre aux jugements disparaît : 40 dinars pour toutes
        les juridictions. Article 79 (p. 3851) : application à compter du 1er janvier 2017. Édition française
        lue sur la couche texte.'
documentation: |
  Minimum de perception des jugements des tribunaux de première instance. Le montant de 40 dinars est
  fixé deux fois, par la loi de finances complémentaire pour 2012 puis par la loi de finances pour
  2017, qui institue le minimum unique.
