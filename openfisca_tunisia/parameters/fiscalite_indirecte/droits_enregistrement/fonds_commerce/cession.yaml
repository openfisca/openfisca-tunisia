description: Taux du droit d'enregistrement sur les mutations à titre onéreux de fonds de commerce ou
  de clientèle
values:
  '1993-05-17':
    value: 0.025
metadata:
  unit: /1
  short_label: Cession de fonds de commerce
  notes:
    '1993-05-17':
    - note: 'Série incomplète : états antérieurs à 1993 non versés.'
  reference:
    '1993-05-17':
    - title: Loi n° 93-53 du 17 mai 1993, portant promulgation du code des droits d'enregistrement et
        de timbre, article 2 ; code, article 20, numéro 13
      href: https://www.pist.tn/jort/1993/1993F/Jo03993.pdf
      note: 'JORT n° 39 du 25 mai 1993, p. 715 (loi, article 2) et p. 720 (code). Mutations à titre onéreux
        de fonds de commerce ou de clientèle : 2,5 %. Date d''effet : article 2, I de la loi, p. 715 :
        « Les dispositions du code sus visé s''appliquent aux jugements, actes, contrats et mutations
        établis ou intervenus à compter de la promulgation de la présente loi », soit le 17 mai 1993.
        Édition française sans couche texte, lue à l''image.'
documentation: |
  Taux appliqué au prix de cession d'un fonds de commerce ou d'une clientèle. Avant le code, 18,80 %
  au tarif de 1969, puis 5 % pour les actes présentés à l'enregistrement avant le 31 décembre 1988
  (loi n° 87-73 du 26 novembre 1987) ; le taux applicable du 1er janvier 1989 au 17 mai 1993 n'est pas
  établi. Taux inchangé au 1er janvier 2026.
