documentation: |-
  Taux de la taxe sur la valeur ajoutée, instituée par le code promulgué par la loi n° 88-61 du 2 juin 1988 et applicable à compter du 1er juillet 1988, et classement des produits par taux.
  La grille compte trois taux en 1988 (réduit, normal, majoré), un quatrième de 1995 à 2006 (intermédiaire), puis trois à nouveau depuis la suppression du taux majoré au 1er janvier 2007 (réduit, intermédiaire, normal).
