documentation: |-
  Position Ex 22-08, taux ad valorem, sur l'assiette de la loi n° 88-62 ; le décret n° 97-1368 n'en
  indique pas. L'annexe III de 1997 distingue les whiskies, cognac, vodka, gin et autres boissons
  spiritueuses classés et non classés ; l'annexe de 2015 et les tableaux de 2016 et 2018 n'en portent
  qu'une ligne, « whiskies, cognac, vodka, gin et autres boissons spiritueuses », dont le taux vaut
  pour les deux.

  Le décret n° 2013-929 laisse cette position « sans modification » : la valeur de 1997 court jusqu'au
  24 novembre 2015. Les lois de finances de 1998 à 2015 n'ont pas été relues une à une pour cette
  position.
