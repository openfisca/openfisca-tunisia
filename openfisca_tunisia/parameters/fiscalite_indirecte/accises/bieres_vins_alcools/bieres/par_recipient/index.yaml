documentation: |-
  Annexe I du décret n° 97-1368, puis du décret n° 2013-929 : droit en dinars par récipient, selon sa
  nature (boîte, bouteille) et sa contenance. Close au 24 novembre 2015 : l'annexe unique du décret
  gouvernemental n° 2015-1768 remplace le tarif par récipient par un tarif au volume.
