metadata:
  unit: /1
  reference:
    '2018-01-01':
    - title: "Loi n° 2017-66 du 18 décembre 2017, portant loi de finances pour l'année 2018, article 45"
      href: "https://www.pist.tn/jort/2017/2017F/Jo1012017.pdf"
      note: "JORT n° 101 du 19 décembre 2017, pp. 4283-4284. L'article 45 abroge le tableau annexé à la loi n° 88-62 du 2 juin 1988, portant refonte de la réglementation relative au droit de consommation, et le remplace : position Ex 22.08 (eaux-de-vie obtenues par distillation ; whiskies, cognac, vodka, gin et autres boissons spiritueuses ; pastis, ricard, anisette et thibarine), droit de consommation de 100 % pour les trois sous-positions. La liste `produits` associée ne porte qu'un seul produit, `liqueur`, rattaché à cette position de boissons spiritueuses. Vérification 2019-2021 : la loi n° 2018-56 du 27 décembre 2018 (JORT n° 104 du 28 décembre 2018, article 69) supprime la position 19.05 du tableau et restreint Ex 33.02, sans toucher à Ex 22.08 ; la loi n° 2019-78 du 23 décembre 2019, portant loi de finances pour l'année 2020, ne modifie aucune position du tableau 88-62 ; la loi n° 2020-46 du 23 décembre 2020, portant loi de finances pour l'année 2021 (JORT n° 128 du 28 décembre 2020, article 20), ne modifie que les bières et les vins (positions 22.03 et Ex 22.04)."
