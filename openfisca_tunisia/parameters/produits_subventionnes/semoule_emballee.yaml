description: Prix de la semoule emballée
values:
  2020-12-11:
    value: 0.79
metadata:
  short_label: Semoule emballée
  label_en: Packaged semolina price
  unit: currency/kg
  reference:
    2020-12-11:
    - title: "Augmentation des prix de la farine et de la semoule (African Manager, 11 décembre 2020)"
      href: https://africanmanager.com/augmentation-des-prix-de-la-farine-et-de-la-semoule/
      note: Le kilo de semoule emballée (sacs de 1, 5, 10 et 20 kg) passe de 700 à 790 millimes. L'article, qui cite un document parvenu à l'agence TAP, ne donne ni texte ni date d'effet ; la date de l'article est retenue.
documentation: |-
  Prix de la semoule emballée. Il ne s'agit pas du prix subventionné de la semoule en vrac (`semoule`), qui n'a pas changé à cette date. Le prix antérieur à décembre 2020 (700 millimes) n'est pas daté : il n'est pas porté dans le paramètre.
