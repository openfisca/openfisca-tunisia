metadata:
  short_label: "Orge, prix d'intervention"
  label_en: "Barley intervention price"
  unit: currency/100kg
  notes:
    1993-09-06:
    - note: "Début de la série : jusqu'à la récolte 1991, l'orge a un prix de base à la production (paramètre prix_base_production.orge). À partir de la récolte 1992, sa commercialisation est libre et le décret ne fixe plus qu'un prix d'intervention (décret n° 93-1721, article premier)."
    1995-11-07:
    - note: "Pour la récolte 1995, une prime spéciale de prompte livraison de 5,000 D/ql s'ajoute au prix d'intervention pour les livraisons du 1er juin au 31 juillet 1995 (décret n° 95-2021, article premier) ; elle n'est pas comprise dans la valeur."
    2001-04-30:
    - note: "Pour la récolte 2000, une prime de prompte livraison de 8,000 D/ql s'ajoute au prix d'intervention (décret n° 2001-864, article premier) ; elle n'est pas comprise dans la valeur."
    2008-06-16:
    - note: "Pour la récolte 2008, la prime exceptionnelle de prompte livraison du décret n° 2008-2081 (article 2) vise le blé dur, le blé tendre et le triticale, pas l'orge ; pour la récolte 2009, le décret n° 2009-1853 l'étend à l'orge (10 D/ql, livraisons avant le 31 août 2009). Elle n'est pas comprise dans la valeur."
