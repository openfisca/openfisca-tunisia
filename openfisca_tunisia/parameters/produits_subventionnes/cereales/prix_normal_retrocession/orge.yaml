documentation: |-
  Prix auquel l'Office des céréales rétrocède les céréales, en dinars par quintal (100 kg). Dans
  le décret de la récolte 2025 (article 10), il comprend le prix de base (pour l'orge, le prix
  d'intervention), la marge brute de rétrocession de l'Office (prime de magasinage, marge nette,
  péréquation de transport, dotation du fonds d'équipement) et la prime exceptionnelle de prompte
  livraison. Les blés destinés aux semoules et aux farines sont rétrocédés à des prix réduits
  fixés par décision du ministre chargé du commerce ; l'Office reçoit alors de la Caisse générale
  de compensation une prime de compensation égale à la différence entre le prix normal et le prix
  réduit. Ces décisions ne sont pas identifiées au Journal officiel ; les prix réduits ne sont
  pas versés. De la récolte 2010 à la récolte 2013, et pour la récolte 2016, le texte donne un
  seul prix pour l'orge et le triticale.

  Chaque texte fixe les prix « de la récolte de l'année » qu'il vise ; la valeur prend effet à la
  date d'entrée en vigueur du texte, non au début de la récolte. Deux décrets publiés en juillet
  2022 après celui de la récolte 2022 ne sont pas portés en valeur : le décret n° 2022-580
  (récolte 2021) et le décret n° 2022-650 (récolte 2018), qui auraient fait revenir la série à
  des prix antérieurs ; ils figurent dans les références au 13 juillet 2022. Depuis le décret-loi
  n° 2025-2 du 24 septembre 2025 (JORT n° 118 du 25 septembre 2025, p. 2420), ces prix sont fixés
  par arrêté conjoint des ministres chargés des finances et de l'agriculture, et non plus par
  décret.
