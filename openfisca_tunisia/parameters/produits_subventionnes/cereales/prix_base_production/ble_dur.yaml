metadata:
  short_label: "Blé dur"
  label_en: "Durum wheat basic producer price"
  unit: currency/100kg
  notes:
    1970-08-04:
    - note: "Série incomplète : états antérieurs à 1970 non versés."
    2008-06-16:
    - note: "À partir de la récolte 2008, une prime exceptionnelle de prompte livraison s'ajoute au prix de base (décret n° 2008-2081, article 2, et décret n° 2009-1853 : blé dur 15 D/ql, blé tendre 10 D/ql pour les récoltes 2008 et 2009) ; elle n'est pas comprise dans la valeur."
  reference:
    1970-08-04:
    - title: "Décret n° 70-261 du 30 juillet 1970, fixant le prix et les modalités de paiement, de stockage et de rétrocession des céréales, fèves, féveroles et pois-chiches, pour la campagne 1970-1971"
      href: https://www.pist.tn/jort/1970/1970F/Jo03770.pdf
      note: "JORT n° 37 du 31 juillet au 4 août 1970, p. 985-992 (prix : p. 990). Prix de base à la production, récolte 1970 : blé dur : 4,800 D/ql. Date d'effet : le texte n'en énonce pas ; numéro daté du 31 juillet au 4 août 1970, jour de parution non établi : la date portée est la dernière date du numéro, le 4 août 1970, retenue comme date de publication. Lu à l'image."
