documentation: |-
  Prix fixé pour chaque récolte, en dinars par quintal (100 kg), auquel les céréales saines,
  loyales et marchandes sont achetées à la production et auprès des collecteurs. Le texte de
  campagne le fixe à son article premier.

  Chaque texte fixe les prix « de la récolte de l'année » qu'il vise ; la valeur prend effet à la
  date d'entrée en vigueur du texte, non au début de la récolte. Avant 1993, un texte est
  exécutoire un jour franc après sa publication ; quand le numéro du Journal officiel porte
  plusieurs dates, la valeur est portée à la dernière,
  retenue comme date de publication, sans calcul de jour franc. Une campagne régie par
  reconduction d'un texte antérieur (récoltes 1979, 1993-1994, 1997-1999, 2001-2004 et 2006) ne
  porte pas de valeur nouvelle ; le texte qui reconduit figure dans les références, à la date de
  la valeur qu'il maintient. Deux décrets ne sont pas portés
  en valeur : le décret n° 2022-580 (récolte 2021), entré en vigueur le même jour que celui de la
  récolte 2022, et le décret n° 2022-650 (récolte 2018), entré en vigueur après lui ; leurs prix,
  inférieurs à ceux de la récolte 2022, auraient fait revenir la série à des prix antérieurs. Ils
  figurent dans les références au 13 juillet 2022. Depuis le décret-loi n° 2025-2 du 24 septembre
  2025 (JORT n° 118 du 25 septembre 2025, p. 2420), ces prix sont fixés par arrêté conjoint des
  ministres chargés des finances et de l'agriculture, et non plus par décret.
