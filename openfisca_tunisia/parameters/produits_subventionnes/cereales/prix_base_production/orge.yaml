documentation: |-
  Prix fixé pour chaque récolte, en dinars par quintal (100 kg), auquel l'orge saine, loyale et
  marchande est achetée à la production, des récoltes 1970 à 1991. À partir de la récolte 1992, la
  commercialisation de l'orge est libre : le texte de campagne ne fixe plus qu'un prix
  d'intervention, et la série s'arrête à l'entrée en vigueur du décret n° 93-1721.

  Chaque texte fixe les prix « de la récolte de l'année » qu'il vise ; la valeur prend effet à la
  date d'entrée en vigueur du texte, non au début de la récolte. Avant 1993, un texte est
  exécutoire un jour franc après sa publication ; quand le numéro du Journal officiel porte
  plusieurs dates, la valeur est portée à la dernière,
  retenue comme date de publication, sans calcul de jour franc. Une campagne régie par
  reconduction d'un texte antérieur ne porte pas de valeur nouvelle ; le texte qui reconduit
  figure dans les références, à la date de la valeur qu'il maintient.
