metadata:
  short_label: "Blé tendre"
  label_en: "Soft wheat reduced resale price to mills"
  unit: currency/100kg
  notes:
    1974-06-27:
    - note: "Début de la série : le décret de la récolte 1974 est le premier décret de campagne qui fixe un prix réduit de rétrocession du blé ; ceux des récoltes 1970 à 1973 n'en fixent pas. L'écart entre le prix normal et le prix réduit est versé aux minoteries en indemnité compensatrice, imputée au compte « Soutien du Marché des Céréales » de l'Office des céréales."
    1983-12-28:
    - note: "Du 28 décembre 1983 au 29 février 1984, le prix de rétrocession du blé dur dépasse son prix normal : l'écart est perçu par une redevance compensatrice, et non versé en indemnité (décret n° 83-1274, article 22 nouveau)."
    1989-09-03:
    - note: "Pour les récoltes 1988 et 1989, l'indemnité reste imputée au compte « Soutien du Marché des Céréales », « dont le solde sera pris en charge par la caisse générale de compensation » (décret n° 89-1171, article 27 ; décret n° 90-671, article 26)."
    1991-07-04:
    - note: "Fin de la série publiée. Pour la récolte 1990, le prix réduit est « fixé par arrêté du ministre de l'économie nationale » (décret n° 91-943, article 8) ; cet arrêté n'est pas identifié au Journal officiel. Depuis la récolte 1991, il est fixé par décision du ministre chargé de l'économie, puis du commerce (décret n° 92-1657, article 8 ; décret n° 93-1721, articles 7 et 13), décision qui n'est pas publiée. La Caisse générale de compensation prend en charge la prime de compensation, différence entre le prix normal et le prix réduit."
  reference:
