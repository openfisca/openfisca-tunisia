documentation: |-
  Prix, en dinars par quintal (100 kg), auquel l'Office des céréales rétrocède le blé tendre destiné
  à la fabrication industrielle des semoules et des farines, inférieur au prix normal de
  rétrocession. Les décrets de campagne le fixent dans leur texte pour les récoltes 1974 à 1989,
  et des décrets modificatifs le changent en cours de campagne (1975, 1976, 1979, 1983-1984).
  À partir de la récolte 1990, le décret renvoie à un arrêté, puis à une décision du ministre,
  dont le montant n'est pas publié au Journal officiel : la série s'arrête à l'entrée en vigueur
  du décret n° 91-943.

  Une date d'effet énoncée par le texte est reprise telle quelle, même antérieure à la
  publication. À défaut, le texte est exécutoire un jour franc après sa publication ; quand le
  numéro du Journal officiel porte plusieurs dates, la dernière est retenue comme date de
  publication.
