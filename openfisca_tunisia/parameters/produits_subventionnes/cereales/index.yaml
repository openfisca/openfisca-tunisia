documentation: |-
  Prix fixés pour chaque récolte par le texte de campagne de l'Office des céréales, depuis la
  récolte 1970 : décret jusqu'à la récolte 2025, arrêté conjoint des ministres chargés des finances et de l'agriculture
  depuis la récolte 2026. Montants en dinars par quintal (100 kg).
