metadata:
  short_label: Semoule
  label_en: Subsidized semolina price (bulk)
  unit: currency/kg
  reference:
    2010-01-01:
    - title: Prix de vente de la semoule en 2010, tels que les services du ministère du Commerce les ont communiqués à l'enquête nationale sur le budget, la consommation et le niveau de vie des ménages de 2010
      note: Texte ni date de fixation retrouvés en ligne. Valeur reprise de la version d'origine du paramètre.
    2011-01-01:
    - title: "Produits subventionnés : les prix restent inchangés (L'Économiste maghrébin, 3 janvier 2018)"
      href: https://www.leconomistemaghrebin.com//2018/01/03/produits-subventionnes-augmentation-prix/
      note: Le communiqué du ministère du Commerce reproduit par l'article donne la semoule à 450 millimes le kilo, prix inchangé au 3 janvier 2018. Date de la baisse de 480 à 450 millimes non retrouvée en ligne ; 1er janvier 2011 retenu comme pour les pâtes, le couscous et le sucre.
documentation: |-
  Prix de vente de la semoule vendue en vrac au détail. La semoule vendue emballée est un autre prix, non subventionné : voir `semoule_emballee`.
  Le prix de 450 millimes est resté inchangé jusqu'en janvier 2018 au moins ; le prix en vigueur après cette date n'a pas été retrouvé en ligne. La valeur est reportée sans date de fin.
