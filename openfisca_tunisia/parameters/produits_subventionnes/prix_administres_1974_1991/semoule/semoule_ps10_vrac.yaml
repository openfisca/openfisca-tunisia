description: "Prix de vente au public de la semoule PS-10 en vrac, au kilogramme"
values:
  1984-03-01:
    value: 0.145
  1984-07-10:
    value: null
  1991-08-17:
    value: 0.205
  1992-01-01:
    value: null
metadata:
  short_label: "Semoule PS-10 vrac"
  label_en: "PS-10 semolina in bulk, retail price per kg"
  unit: currency/kg
  notes:
    1984-03-01:
    - note: "Série incomplète : états antérieurs à 1984 non versés."
    1984-07-10:
    - note: "À compter du 10 juillet 1984, le texte fixe le prix de la semoule PS-10 au quintal (paramètre de la semoule PS-10 au quintal) ; aucun prix de ce produit-ci n'est relevé ensuite."
    1991-08-17:
    - note: "Dernière valeur relevée au Journal officiel. Au 1er janvier 1992, la loi n° 91-64 du 29 juillet 1991 relative à la concurrence et aux prix abroge la loi n° 70-26 (article 62, JORT n° 55 du 6 août 1991, p. 1398) ; son article 3 exclut de la liberté des prix les produits de première nécessité. Aucun texte lu ne met fin à cette valeur, et aucun prix au public de ce produit n'est relevé ensuite au Journal officiel : la série est close au 1er janvier 1992, date à partir de laquelle aucun prix au public n'est plus publié."
    - note: "Prix de 2010 à 2022 : paramètre produits_subventionnes/semoule, d'après le tableau annuel du ministère du Commerce (0,480 D le kilogramme en 2010). Variété et conditionnement non précisés par le tableau. Le raccord avec la présente série n'est pas établi."
    1992-01-01:
    - note: 'Lacune 1992-2009 : prix homologués non publiés ; les valeurs 2010-2022 sont portées par les paramètres voisins de produits_subventionnes, sans raccord faute de texte publié entre les deux.'
  reference:
    1984-03-01:
    - title: "Arrêté du 17 février 1984 fixant les prix des semoules (intitulé repris du visa de l'arrêté du 10 juillet 1984)"
      href: https://www.pist.tn/jort/1984/1984F/Jo01484.pdf
      note: "JORT n° 14 du 28 février 1984, p. 452, article premier. Semoule PS-10 vrac, 1 kg : 125,4 millimes rendu, 129 en gros, 145 au détail ; paquet de 1 kg : 185 au détail. Lu sur l'océrisation du fascicule. Le texte n'énonce pas de date d'effet. Règle d'avant 1993, un jour franc après la publication : publié le 28 février 1984 ; 1984 étant bissextile, le jour franc est le 29 février ; en vigueur le 1er mars 1984."
    1984-07-10:
    - title: "Arrêté du ministre de l'économie nationale du 10 juillet 1984 fixant les prix des semoules"
      href: https://www.pist.tn/jort/1984/1984F/Jo04384.pdf
      note: "JORT n° 43 des 17-20 juillet 1984, p. 1595, article premier. Prix fixé au quintal. Date d'effet énoncée par le texte : 10 juillet 1984, antérieure à la publication."
    1991-08-17:
    - title: "Arrêté du ministre de l'économie nationale du 15 août 1991 portant fixation des prix de vente de la semoule PS-10"
      href: https://www.pist.tn/jort/1991/1991F/Jo06191.pdf
      note: "JORT n° 61 des 3-6 septembre 1991, p. 1546, article premier. Semoule PS-10, vrac, 1 kg : 180 millimes rendu chef-lieu de délégation, 185 en gros, 205 au détail. Date d'effet énoncée par le texte : 17 août 1991, antérieure à la publication."
    1992-01-01:
    - title: Loi n° 91-64 du 29 juillet 1991 relative à la concurrence et aux prix
      href: https://www.pist.tn/jort/1991/1991F/Jo05591.pdf
      note: "JORT n° 55 du 6 août 1991, p. 1398, art. 62 : entrée en vigueur le 1er janvier 1992 et abrogation de la loi n° 70-26. Les produits de première nécessité (décret n° 91-1996, tableau A) restent à prix homologués, mais aucun prix au public n'est plus publié au Journal officiel : la valeur n'est pas établie à partir de cette date."
