description: "Prix de vente au public de la semoule PS-10, au quintal"
values:
  1983-12-28:
    value: 27.0
  1984-03-01:
    value: null
  1984-07-10:
    value: 15.5
  1989-08-12:
    value: 17.5
  1991-08-17:
    value: null
metadata:
  short_label: "Semoule PS-10 (quintal)"
  label_en: "PS-10 semolina, retail price per quintal"
  unit: currency/100kg
  notes:
    1983-12-28:
    - note: "Série incomplète : états antérieurs à 1983 non versés."
    1984-03-01:
    - note: "À compter du 1er mars 1984, le texte fixe le prix de la semoule PS-10 en vrac au kilogramme (paramètre de la semoule PS-10 en vrac) ; aucun prix de ce produit-ci n'est relevé ensuite."
    1991-08-17:
    - note: "À compter du 17 août 1991, le texte fixe le prix de la semoule PS-10 en vrac au kilogramme (paramètre de la semoule PS-10 en vrac) ; aucun prix de ce produit-ci n'est relevé ensuite."
  reference:
    1983-12-28:
    - title: "Arrêté du ministre de l'économie nationale du 28 décembre 1983, fixant les prix des semoules"
      href: https://www.pist.tn/jort/1984/1984F/Jo00184.pdf
      note: "JORT n° 1 du 3 janvier 1984, p. 6-7, article premier. Semoule PS-10 : 24,100 D le quintal en gros, 27,000 D au public ; lu sur l'océrisation du fascicule, premier chiffre à relire à l'image. Date d'effet énoncée par le texte : « à compter du 28 décembre 1983 », antérieure à la publication."
    1984-03-01:
    - title: "Arrêté du 17 février 1984 fixant les prix des semoules (intitulé repris du visa de l'arrêté du 10 juillet 1984)"
      href: https://www.pist.tn/jort/1984/1984F/Jo01484.pdf
      note: "JORT n° 14 du 28 février 1984, p. 452, article premier. Abroge l'arrêté du 28 décembre 1983 ; prix fixé au kilogramme, en vrac et en paquet. Le texte n'énonce pas de date d'effet. Règle d'avant 1993, un jour franc après la publication : publié le 28 février 1984 ; 1984 étant bissextile, le jour franc est le 29 février ; en vigueur le 1er mars 1984."
    1984-07-10:
    - title: "Arrêté du ministre de l'économie nationale du 10 juillet 1984 fixant les prix des semoules"
      href: https://www.pist.tn/jort/1984/1984F/Jo04384.pdf
      note: "JORT n° 43 des 17-20 juillet 1984, p. 1595, article premier. « Semoules de blé dur extraites à P.S. 10 » : 13,440 D le quintal rendu chef-lieu de délégation, 13,800 D en gros, 15,500 D au détail. Date d'effet énoncée par le texte : 10 juillet 1984, antérieure à la publication."
    1989-08-12:
    - title: "Arrêté du 11 novembre 1989 fixant les prix des semoules (intitulé non relevé)"
      href: https://www.pist.tn/jort/1989/1989F/Jo07789.pdf
      note: "JORT n° 77 des 17-21 novembre 1989, p. 1824-1825. Semoule PS-10 : 15,440 D le quintal rendu chef-lieu, 15,800 D en gros, 17,500 D au détail. Date d'effet énoncée par le texte : 12 août 1989, antérieure à la signature et à la publication."
    1991-08-17:
    - title: "Arrêté du ministre de l'économie nationale du 15 août 1991 portant fixation des prix de vente de la semoule PS-10"
      href: https://www.pist.tn/jort/1991/1991F/Jo06191.pdf
      note: "JORT n° 61 des 3-6 septembre 1991, p. 1546, article premier. Prix fixé au kilogramme en vrac. Date d'effet énoncée par le texte : 17 août 1991, antérieure à la publication."
