documentation: |-
  Un paramètre par unité de prix : le prix est fixé tantôt au quintal, tantôt au kilogramme en vrac.
  Les prix des décrets n° 75-352 et 79-413, « rendu fabrique ou magasin » ou rendus au chef-lieu de la délégation, ne sont pas des prix au public et ne sont pas versés ici.
