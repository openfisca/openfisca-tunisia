description: "Prix maximum de vente au public du gros pain de 500 grammes"
values:
  1989-08-12:
    value: 0.1
  1991-08-17:
    value: 0.12
metadata:
  short_label: "Gros pain de 500 g"
  label_en: "Large bread (500 g), maximum retail price"
  unit: currency/unit
  notes:
    1991-08-17:
    - note: "Dernière valeur publiée au Journal officiel. Au 1er janvier 1992, la loi n° 91-64 du 29 juillet 1991 relative à la concurrence et aux prix abroge la loi n° 70-26 (article 62, JORT n° 55 du 6 août 1991, p. 1398) ; son article 3 exclut de la liberté des prix les produits de première nécessité. Aucun texte lu ne met fin à cette valeur, et aucun prix au public de ce produit n'est publié ensuite au Journal officiel : la valeur reste ouverte."
  reference:
    1989-08-12:
    - title: "Arrêté du ministre de l'économie nationale du 11 novembre 1989, portant fixation du poids et du prix de vente du pain"
      href: https://www.pist.tn/jort/1989/1989F/Jo07789.pdf
      note: "JORT n° 77 des 17-21 novembre 1989, p. 1823. Gros pain de 500 g : 100 millimes. Date d'effet énoncée par le texte : « à compter du 12 août 1989 », antérieure à la signature et à la publication."
    1991-08-17:
    - title: "Arrêté du ministre de l'économie nationale du 15 août 1991, portant fixation des prix du pain"
      href: https://www.pist.tn/jort/1991/1991F/Jo06191.pdf
      note: "JORT n° 61 des 3-6 septembre 1991, p. 1545. « Gros pain : 500 grammes : 120 millimes », tolérance de 30 g. Date d'effet énoncée par le texte : « à compter du 17 août 1991 », antérieure à la publication. Publié le 3 septembre 1991."
