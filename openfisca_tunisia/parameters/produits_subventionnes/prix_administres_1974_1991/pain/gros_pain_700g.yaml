metadata:
  short_label: "Gros pain de 700 g"
  label_en: "Large bread (700 g), maximum retail price"
  unit: currency/unit
  notes:
    1975-05-31:
    - note: "Série incomplète : états antérieurs à 1975 non versés. Le rapport annuel de la Banque centrale de Tunisie pour 1975 donne 55 millimes avant le 31 mai 1975, sans date d'effet."
    1980-01-01:
    - note: "Valeur non établie à compter du 1er janvier 1980. Le rapport annuel de la Banque centrale de Tunisie pour 1983 donne un prix du gros pain de 700 g de 80 millimes en 1980 ; le texte qui le fixe et sa date d'effet ne sont pas identifiés. Le 1er janvier 1980 n'est pas une date d'effet : il borne la période où la valeur n'est pas établie, jusqu'à l'arrêté du 28 décembre 1983."
    1986-08-30:
    - note: "Le gros pain passe de 700 à 600 grammes : voir le paramètre du gros pain de 600 g."
  reference:
    1975-05-31:
    - title: "Décret n° 75-352 du 3 juin 1975, fixant le prix des farines et semoules, du pain, des pâtes alimentaires et du couscous rapide"
      href: https://www.pist.tn/jort/1975/1975F/Jo03875.pdf
      note: "JORT n° 38 du 3 au 6 juin 1975, p. 1192, article premier. Pain de 700 g : 65 millimes. Date d'effet énoncée par le texte : « à compter du 31 mai 1975 », antérieure à la publication."
    1979-05-03:
    - title: "Décret n° 79-413 du 7 mai 1979, fixant le prix des farines et semoules, du pain, des pâtes alimentaires et du couscous"
      href: https://www.pist.tn/jort/1979/1979F/Jo03279.pdf
      note: "JORT n° 32 du 11 mai 1979, p. 1381-1382, article premier. Pain de 700 g : 70 millimes. Date d'effet énoncée par le texte : « à compter du 3 mai 1979 », antérieure à la publication."
    1984-01-01:
    - title: "Arrêté du ministre de l'économie nationale du 28 décembre 1983, relatif au prix maxima de la vente du pain"
      href: https://www.pist.tn/jort/1984/1984F/Jo00184.pdf
      note: "JORT n° 1 du 3 janvier 1984, p. 9, article premier. Pain de 700 g : 170 millimes ; lu sur l'océrisation du fascicule. Date d'effet énoncée par le texte : à compter du 1er janvier 1984."
    1984-03-01:
    - title: "Arrêté du ministre de l'économie nationale du 17 février 1984, relatif aux prix maxima de la vente du pain"
      href: https://www.pist.tn/jort/1984/1984F/Jo01484.pdf
      note: "JORT n° 14 du 28 février 1984, p. 453, article premier. Pain de 700 g : 80 millimes ; abroge l'arrêté du 28 décembre 1983 ; lu sur l'océrisation du fascicule. Le texte n'énonce pas de date d'effet. Règle d'avant 1993, un jour franc après la publication : publié le 28 février 1984 ; 1984 étant bissextile, le jour franc est le 29 février ; en vigueur le 1er mars 1984."
    1984-07-10:
    - title: "Arrêté du ministre de l'économie nationale du 10 juillet 1984, portant fixation des prix de vente du pain"
      href: https://www.pist.tn/jort/1984/1984F/Jo04384.pdf
      note: "JORT n° 43 des 17-20 juillet 1984, p. 1594-1595. Pain de 700 g : 90 millimes. Date d'effet énoncée par le texte : 10 juillet 1984, antérieure à la publication."
    1985-07-15:
    - title: "Arrêté du ministre de l'économie nationale du 15 juillet 1985, portant fixation des prix de vente du pain"
      href: https://www.pist.tn/jort/1985/1985F/Jo05585.pdf
      note: "JORT n° 55 du 19 juillet 1985, p. 946. Pain de 700 g : 100 millimes. Date d'effet énoncée par le texte : à compter du 15 juillet 1985, antérieure à la publication."
    1986-08-30:
    - title: "Arrêté du ministre de l'industrie et du commerce du 29 août 1986, portant fixation du poids du pain"
      href: https://www.pist.tn/jort/1986/1986F/Jo05086.pdf
      note: "JORT n° 50 du 16 septembre 1986, p. 1020. « Gros pain : 600 grammes ». Effet énoncé : 30 août 1986."
