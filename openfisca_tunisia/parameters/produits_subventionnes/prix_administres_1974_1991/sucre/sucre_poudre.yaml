description: "Prix de vente maximum au public du sucre en poudre"
values:
  1974-05-24:
    value: 0.17
  1975-05-31:
    value: 0.2
  1980-01-23:
    value: 0.24
  1986-11-25:
    value: 0.27
  1988-07-01:
    value: 0.3
  1989-08-12:
    value: 0.35
  1990-07-13:
    value: 0.4
  1991-06-17:
    value: 0.43
