metadata:
  short_label: "Couscous PS-10 vrac"
  label_en: "Quick couscous PS-10 in bulk, retail price per kg"
  unit: currency/kg
  notes:
    1983-12-28:
    - note: "Série incomplète : états antérieurs à 1983 non versés."
    1991-08-17:
    - note: "Dernière valeur relevée au Journal officiel. Au 1er janvier 1992, la loi n° 91-64 du 29 juillet 1991 relative à la concurrence et aux prix abroge la loi n° 70-26 (article 62, JORT n° 55 du 6 août 1991, p. 1398) ; son article 3 exclut de la liberté des prix les produits de première nécessité. Aucun texte lu ne met fin à cette valeur, et aucun prix au public de ce produit n'est relevé ensuite au Journal officiel : la valeur reste ouverte."
    - note: "Prix de 2010 à 2022 : paramètre produits_subventionnes/couscous, d'après le tableau annuel du ministère du Commerce (0,845 D le kilogramme en 2010). Variété et conditionnement non précisés par le tableau. Le raccord avec la présente série n'est pas établi."
  reference:
    1983-12-28:
    - title: "Arrêté du ministre de l'économie nationale du 28 décembre 1983, fixant les prix de vente maxima des pâtes et couscous rapide"
      href: https://www.pist.tn/jort/1984/1984F/Jo00184.pdf
      note: "JORT n° 1 du 3 janvier 1984, p. 7-8, article premier. Couscous PS-10, vrac, 1 kg : 322 millimes à l'usine, 330 en gros, 360 au détail. Date d'effet énoncée par le texte : « à compter du 28 décembre 1983 », antérieure à la publication. Lu sur l'océrisation du fascicule."
    1984-03-01:
    - title: "Arrêté du 17 février 1984 fixant les prix de vente maximum des pâtes et couscous rapide (intitulé repris du visa de l'arrêté du 10 juillet 1984)"
      href: https://www.pist.tn/jort/1984/1984F/Jo01484.pdf
      note: "JORT n° 14 du 28 février 1984, p. 453, article premier. Couscous PS-10, vrac, 1 kg : 173 millimes à l'usine, 178 en gros, 198 au détail. Le texte n'énonce pas de date d'effet. Règle d'avant 1993, un jour franc après la publication : publié le 28 février 1984 ; 1984 étant bissextile, le jour franc est le 29 février ; en vigueur le 1er mars 1984. Lu sur l'océrisation du fascicule."
    1984-07-10:
    - title: "Arrêté du ministre de l'économie nationale du 10 juillet 1984 fixant les prix de vente des pâtes et couscous rapide"
      href: https://www.pist.tn/jort/1984/1984F/Jo04384.pdf
      note: "JORT n° 43 des 17-20 juillet 1984, p. 1595-1596, article premier. Couscous PS-10, vrac, 1 kg : 183 millimes à l'usine, 188 en gros, 208 au détail. Date d'effet énoncée par le texte : 10 juillet 1984, antérieure à la publication."
    1986-08-30:
    - title: "Arrêté du 29 août 1986 fixant les prix des pâtes alimentaires et du couscous (intitulé non relevé)"
      href: https://www.pist.tn/jort/1986/1986F/Jo05086.pdf
      note: "JORT n° 50 du 16 septembre 1986, p. 1019-1020. Couscous P.S.-10, vrac, le kilogramme : 223 et 228 millimes aux stades de la fabrication et du gros, 250 au détail. Date d'effet énoncée par le texte : 30 août 1986."
    1989-08-12:
    - title: "Arrêté du ministre de l'économie nationale du 11 novembre 1989 portant fixation du prix de vente des pâtes alimentaires et couscous rapide"
      href: https://www.pist.tn/jort/1989/1989F/Jo07789.pdf
      note: "JORT n° 77 des 17-21 novembre 1989, p. 1822-1823, article premier. Couscous PS-10, vrac, 1 kg : 273 millimes rendu chef-lieu de délégation, 278 en gros, 300 au détail. Date d'effet énoncée par le texte : 12 août 1989, antérieure à la signature et à la publication."
    1991-08-17:
    - title: "Arrêté du 15 août 1991 fixant les prix des pâtes alimentaires et du couscous (intitulé non relevé)"
      href: https://www.pist.tn/jort/1991/1991F/Jo06191.pdf
      note: "JORT n° 61 des 3-6 septembre 1991, p. 1545-1546. Couscous PS-10, vrac : 340 millimes le kilogramme au détail. Date d'effet énoncée par le texte : 17 août 1991, antérieure à la publication."
