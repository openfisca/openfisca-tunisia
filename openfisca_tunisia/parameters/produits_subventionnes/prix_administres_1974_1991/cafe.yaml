description: "Prix de vente au public du café, le kilogramme"
values:
  1980-01-23:
    value: 3.0
metadata:
  short_label: "Café"
  label_en: "Coffee, retail price per kg"
  unit: currency/kg
  notes:
    1980-01-23:
    - note: "Série incomplète : états antérieurs à 1980 non versés."
    - note: "Dernière valeur publiée au Journal officiel. Au 1er janvier 1992, la loi n° 91-64 du 29 juillet 1991 relative à la concurrence et aux prix abroge la loi n° 70-26 (article 62, JORT n° 55 du 6 août 1991, p. 1398) ; son article 3 exclut de la liberté des prix les produits de première nécessité. Aucun texte lu ne met fin à cette valeur, et aucun prix au public de ce produit n'est publié ensuite au Journal officiel : la valeur reste ouverte."
  reference:
    1980-01-23:
    - title: "Arrêté du ministre du commerce du 20 février 1980 portant fixation des prix de vente du sucre et du café"
      href: https://www.pist.tn/jort/1980/1980F/Jo01280.pdf
      note: "JORT n° 12 du 26 février 1980, p. 558, article premier. Café, le kilogramme : 2,840 D aux grossistes, 2,890 D aux détaillants, 3,000 D au public. Date d'effet énoncée par le texte : « à compter du 23 janvier 1980 à zéro heure », antérieure à la signature et à la publication."
