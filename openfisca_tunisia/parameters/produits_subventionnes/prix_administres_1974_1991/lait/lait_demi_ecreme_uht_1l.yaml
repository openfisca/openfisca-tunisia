description: "Prix de vente au public du lait régénéré demi-écrémé UHT en brique d'un litre"
values:
  1989-08-12:
    value: 0.38
  1991-07-22:
    value: 0.44
  1992-01-01:
    value: null
metadata:
  short_label: "Lait demi-écrémé UHT 1 l"
  label_en: "Semi-skimmed recombined milk (UHT), 1 l carton, retail price"
  unit: currency/l
  notes:
    1989-08-12:
    - note: "Série incomplète : états antérieurs à 1989 non versés."
    1991-07-22:
    - note: "Dernière valeur relevée au Journal officiel. Au 1er janvier 1992, la loi n° 91-64 du 29 juillet 1991 relative à la concurrence et aux prix abroge la loi n° 70-26 (article 62, JORT n° 55 du 6 août 1991, p. 1398) ; son article 3 exclut de la liberté des prix les produits de première nécessité. Aucun texte lu ne met fin à cette valeur, et aucun prix au public de ce produit n'est relevé ensuite au Journal officiel : la série est close au 1er janvier 1992, date à partir de laquelle aucun prix au public n'est plus publié."
    - note: "Prix de 2010 à 2022 : paramètre produits_subventionnes/lait_demi_ecreme_uht, d'après le tableau annuel du ministère du Commerce (1,030 D le litre en 2010). Lait demi-écrémé UHT, sans dire s'il est régénéré. Le raccord avec la présente série n'est pas établi."
    1992-01-01:
    - note: 'Lacune 1992-2009 : prix homologués non publiés ; les valeurs 2010-2022 sont portées par les paramètres voisins de produits_subventionnes, sans raccord faute de texte publié entre les deux.'
  reference:
    1989-08-12:
    - title: "Arrêté du ministre de l'économie nationale du 11 novembre 1989, portant fixation du prix de vente du lait régénéré demi-écrémé"
      href: https://www.pist.tn/jort/1989/1989F/Jo07789.pdf
      note: "JORT n° 77 des 17-21 novembre 1989, p. 1824. Lait régénéré demi-écrémé UHT, brique de 1 l : 380 millimes. Date d'effet énoncée par le texte : 12 août 1989, antérieure à la signature et à la publication."
    1991-07-22:
    - title: "Arrêté du ministre de l'économie nationale du 30 juillet 1991, fixant les prix de vente du lait régénéré demi-écrémé"
      href: https://www.pist.tn/jort/1991/1991F/Jo05791.pdf
      note: "JORT n° 57 du 16 août 1991, p. 1451, articles 1er et 3. Lait régénéré demi-écrémé UHT, brique de 1 l : 440 millimes. Date d'effet énoncée par le texte : « A compter du 22 juillet 1991 » (article premier), alors que l'article 3 dit l'arrêté « d'application immédiate » ; signé le 30 juillet, publié le 16 août 1991. La date de l'article premier est retenue."
    1992-01-01:
    - title: Loi n° 91-64 du 29 juillet 1991 relative à la concurrence et aux prix
      href: https://www.pist.tn/jort/1991/1991F/Jo05591.pdf
      note: "JORT n° 55 du 6 août 1991, p. 1398, art. 62 : entrée en vigueur le 1er janvier 1992 et abrogation de la loi n° 70-26. Les produits de première nécessité (décret n° 91-1996, tableau A) restent à prix homologués, mais aucun prix au public n'est plus publié au Journal officiel : la valeur n'est pas établie à partir de cette date."
