  Prix de vente au public du litre de lait régénéré en brique.
  L'arrêté du 21 novembre 1982 dit « lait régénéré », sans « demi-écrémé » ; ceux de 1989 et de 1991 disent « demi-écrémé » : paramètres distincts.
