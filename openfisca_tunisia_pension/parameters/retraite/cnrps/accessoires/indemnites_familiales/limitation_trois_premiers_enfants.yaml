description: L'indemnité familiale est limitée aux trois premiers enfants
values:
  1986-05-01:
    value: false
  1989-01-01:
    value: true
metadata:
  reference:
    1986-05-01:
    - title: "Décret n° 86-611 du 3 juin 1986, portant fixation des taux des indemnités à caractère familial, article premier"
      href: "https://www.pist.tn/jort/1986/1986F/Jo03486.pdf"
      note: "JORT n° 34 des 3-6 juin 1986, p. 674. L'article premier fixe quatre taux mensuels — premier enfant 7,600 dinars, deuxième 6,500, troisième 5,600, quatrième 4,700 : le droit n'est donc pas limité aux trois premiers enfants. L'article 3 énonce : « prend effet à compter du 1er mai 1986 ». La valeur « false » est déduite de l'existence d'un taux pour le quatrième enfant, et non d'une clause qui écarterait expressément toute limitation : aucun texte lu n'en énonce une avant 1989."
    1989-01-01:
    - title: "Loi n° 88-39 du 6 mai 1988, relative à l'octroi des indemnités familiales dans le secteur public, article unique"
      href: "https://www.pist.tn/jort/1988/1988F/Jo03388.pdf"
      note: "JORT n° 33 du 13 mai 1988, p. 735. L'article unique accorde l'indemnité familiale « dans la limite des trois premiers enfants », et dispose : « Les dispositions de la présente loi ne s'appliquent pas aux droits acquis antérieurement au 1er janvier 1989. » Le décret n° 88-1136 du 11 juin 1988 (JORT n° 43 du 24 juin 1988, p. 941), qui prend effet le 1er janvier 1989, ne fixe en conséquence que trois taux. Date d'effet du 1er janvier 1989 énoncée par l'article 2 de ce décret ; la loi n° 88-39 ne porte pas elle-même de clause d'entrée en vigueur, mais réserve expressément les droits acquis à cette même date."
documentation: |-
  Depuis le 1er janvier 1989, l'indemnité familiale n'est due qu'au titre des **trois
  premiers enfants** (loi n° 88-39, article unique). Deux exceptions subsistent, que la
  formule `cnrps_indemnites_familiales` lit dans des variables d'entrée :

  - les **droits acquis antérieurement au 1er janvier 1989**, que la loi n° 88-39 réserve
    expressément, et dont le décret n° 96-1906 (article 2) fixe encore le taux en 1996 au
    titre du « quatrième enfant ayant acquis ce droit antérieurement au 1er janvier 1989 » ;
  - l'**enfant handicapé** venant après le troisième rang, qui ouvre droit quel que soit son
    rang (loi n° 81-46 du 29 mai 1981, article 18 ; décret n° 96-1906, article 3).

  Avant le 1er janvier 1989, aucune limitation n'est opposée : le décret n° 86-611 fixe un
  taux pour le quatrième enfant. La valeur « false » est déduite de ce fait, et non d'une
  clause qui écarterait expressément toute limitation — aucun texte lu n'en énonce une pour
  cette période. Le paramètre commence le 1er mai 1986, comme les quatre taux qu'il
  gouverne : l'état du droit antérieur n'est pas établi, le décret n° 75-952 du 30 décembre
  1975 n'ayant pas été lu.
