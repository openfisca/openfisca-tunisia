description: Durée minimum de services effectifs pour la retraite anticipée sur demande (Cadre commun)
values:
  1985-03-05:
    value: 35
  1985-09-12:
    value: 35
  2007-06-26:
    value: 37
metadata:
  unit: year
  reference:
    1985-09-12:
    - title: "Loi n° 85-12 du 5 mars 1985, portant régime des pensions civiles et militaires de retraite et des survivants dans le secteur public, article 30"
      href: "https://www.pist.tn/jort/1985/1985F/Jo02085.pdf"
      note: "JORT n° 20 du 12 mars 1985, p. 361 : droit au départ anticipé après 35 ans de services et à 55 ans, quelle que soit la fonction. Entrée en vigueur : l'article 75 (p. 365) la fixe « à l'expiration d'un délai de six (6) mois à compter de la date de sa publication au Journal officiel », publication faite le 12 mars 1985, soit le 12 septembre 1985 — date déduite de la clause, non énoncée telle quelle."
    2007-06-26:
    - title: "Loi n° 2007-43 du 25 juin 2007, modifiant et complétant les lois régissant les pensions servies au titre des régimes de retraite, d'invalidité et de survivants dans les secteurs public et privé et des régimes spéciaux, article 2 (article 30 nouveau de la loi n° 85-12)"
      href: "https://www.pist.tn/jort/2007/2007F/Jo0512007.pdf"
      note: "JORT n° 51 du 26 juin 2007, pp. 2198-2199 : l'article 30 nouveau porte les conditions à 37 ans de services et 57 ans. La loi ne comporte pas de clause d'entrée en vigueur : la date retenue est celle de sa publication, le 26 juin 2007."
documentation: |-
  La valeur portée du 5 mars 1985, date de signature de la loi n° 85-12, au 11 septembre 1985 est antérieure à son entrée en vigueur : valeur antérieure au texte non établie, conservée pour la continuité des calculs.
