      href: "https://www.pist.tn/jort/1985/1985F/Jo02085.pdf"
      note: "JORT n° 20 du 12 mars 1985, p. 362 : cinq années d'ancienneté au moins. Entrée en vigueur : l'article 75 (p. 365) la fixe « à l'expiration d'un délai de six (6) mois à compter de la date de sa publication au Journal officiel », publication faite le 12 mars 1985, soit le 12 septembre 1985 — date déduite de la clause, non énoncée telle quelle."
