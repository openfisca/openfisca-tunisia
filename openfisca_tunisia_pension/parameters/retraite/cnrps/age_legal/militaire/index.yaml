description: Âge de mise à la retraite des militaires, par grade
documentation: |-
  L'article 61, 1°, de la loi n° 85-12 échelonne l'âge de mise à la retraite des militaires
  selon le grade, du plus bas au plus élevé. Chaque grade a son fichier, parce que ces âges
  ne forment pas une échelle indexée sur une grandeur continue : ce sont cinq valeurs
  attachées à cinq positions statutaires.

  La loi n° 88-71 réécrit l'article 61 en entier. Un seul de ces âges change, celui des
  officiers généraux ; les quatre autres sont reconduits. Une référence de 1989 est
  attachée à chacun, sans valeur nouvelle, pour que la relecture du texte ne conclue pas à
  une lacune.

  L'état du droit antérieur au 12 septembre 1985 n'est pas établi : la loi n° 59-18 du
  5 février 1959, que la loi n° 85-12 remplace, n'a pas été lue pour cette période.

  La loi n° 2019-37 relève ces âges en deux temps, comme ceux des agents civils. Son article
  premier réécrit l'article 61 : cinquante-deux ans pour les hommes de troupe, cinquante-sept
  pour les sous-officiers, soixante pour les officiers subalternes, soixante-deux pour les
  officiers supérieurs et les officiers généraux. Son article 5 fixe le calendrier, par
  dérogation à ce même article 61 : un an de plus à partir du 1er juillet 2019, deux ans à
  partir du 1er janvier 2020.

  Le second palier retombe exactement sur les âges de l'article 61 nouveau, pour chacun des
  cinq grades. Ce n'est pas une coïncidence de lecture : c'est ce qui permet d'attribuer les
  quatre âges du texte aux cinq grades sans ambiguïté, les officiers supérieurs et généraux
  partageant le même.

  La loi entre en vigueur le 2 mai 2019, mais aucune valeur n'est portée à cette date. Entre
  elle et le 1er juillet 2019, l'article 5 maintient l'âge antérieur : c'est la date du
  premier palier transitoire qui ouvre la série, comme pour les âges civils du même arbre.
