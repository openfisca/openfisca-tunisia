documentation: |-
  Il s'agit
  - des cadres actifs des forces de sécurité intérieure et de la garde nationale
  - les cadres actifs exerçant dans :
    - les sociétés de transport
    - la Société nationale des chemins de fer tunisiens (SNCFT)
    - la Société tunisienne de l’électricité et du gaz (STEG)

  Les cadres actifs relèvent de l'article 29 de la loi n° 85-12. Les ouvriers accomplissant
  des tâches pénibles et insalubres (article 27, liste fixée par le décret n° 85-1177 du
  24 septembre 1985) ont leur propre paramètre, `age_legal.civil.ouvriers_travaux_penibles` ;
  les agents exerçant des fonctions astreignantes (article 28) aussi,
  `age_legal.civil.fonctions_astreignantes`.
