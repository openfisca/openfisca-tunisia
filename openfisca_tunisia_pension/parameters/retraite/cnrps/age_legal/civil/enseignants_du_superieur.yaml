description: Age de départ à la retraite pour certains enseignants du supérieur
values:
  2009-04-14:
    value: 65
metadata:
  unit: year
  reference:
    2009-04-14:
    - title: "Loi n° 2009-20 du 13 avril 2009, portant dispositions exceptionnelles relatives à la retraite des professeurs de l'enseignement supérieur, article 2 (article 29 bis de la loi n° 85-12)"
      href: "https://www.pist.tn/jort/2009/2009F/Jo0302009.pdf"
      note: "JORT n° 30 du 14 avril 2009, p. 1036 : « L'âge de mise à la retraite est fixé à soixante-cinq (65) ans pour les professeurs de l'enseignement supérieur et les maîtres de conférences de l'enseignement supérieur […] ». L'article premier insère « 29 bis » à l'article 24 de la loi n° 85-12. La loi ne comporte pas de clause d'entrée en vigueur : la date retenue est celle de sa publication."
documentation: |-
  Les enseignants concernés sont :
  - les professeurs de l'enseignement supérieur et les maîtres de conférences de l'enseignement supérieur rattachés aux établissements universitaires et aux établissements de recherche scientifique civils et militaires ;
  - les professeurs hospitalo-universitaires et les maîtres de conférences agrégés hospitalo-universitaires.

  Dans sa rédaction de 2009, l'article 29 bis permet de les maintenir en activité par décret jusqu'à soixante-dix (70) ans au maximum, sur rapport motivé du ministre concerné.

  La loi n° 2019-37 du 30 avril 2019 abroge ces deux derniers paragraphes et laisse l'âge de 65 ans inchangé. Elle ouvre aux agents de l'article 29 bis une augmentation optionnelle de l'âge de mise à la retraite, de un à cinq ans sans dépasser 70 ans, sur demande écrite adressée six mois avant cet âge (article 71 bis). Depuis le 1er janvier 2023, l'article 71 bis est remplacé par l'article 12 du décret-loi n° 2022-79 portant loi de finances pour 2023, qui dispense ces agents de l'accord de l'employeur exigé des autres.
