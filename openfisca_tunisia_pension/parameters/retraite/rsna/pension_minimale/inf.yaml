description: Inférieur à la durée du stage requis
values:
  1982-07-22:
    value: 0.5
metadata:
  unit: smig
  reference:
    1982-07-22:
    - title: "Décret n° 82-1030 du 15 juillet 1982, modifiant le décret n° 74-499 du 27 avril 1974 relatif au régime des pensions de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article 5 (article 45, alinéa premier nouveau)"
      href: "https://www.pist.tn/jort/1982/1982F/Jo05182.pdf"
      note: "JORT n° 51 des 20-23 juillet 1982, p. 1606 : « En ce qui concerne les pensions de retraite anticipée et les pensions proportionnelles liquidées en application de l'article 15 bis a) et b) et de l'article 39, le montant à servir ne peut être inférieur à la moitié du SMIG rapporté à une durée d'occupation de 2 400 heures. » Le décret n'énonce pas de date d'effet (l'article 8 est une clause d'exécution). Date retenue : 22 juillet 1982, date à laquelle il devient obligatoire selon la règle générale alors en vigueur — « un jour franc après la publication au Journal Officiel » (article 3 nouveau du décret du 27 janvier 1883, rédaction du décret du 13 septembre 1956, JORT n° 74 du 14 septembre 1956, p. 1247), la publication étant prise au premier jour du fascicule daté des 20-23 juillet ; au dernier jour, ce serait le 25 juillet."
documentation: |-
  Ce plancher est créé en 1982. Dans sa rédaction de 1974, l'article 45 du décret
  n° 74-499 ne connaît que le plancher des deux tiers du SMIG, et exclut
  l'allocation de vieillesse — alors versée en capital aux assurés qui n'ont pas
  accompli le stage (articles 39 à 43) — de toute garantie de montant.

  Aucune valeur n'est portée avant le 22 juillet 1982 : le paramètre n'a pas d'objet
  avant le texte qui le crée.

  Le critère du texte est le type de pension — retraite anticipée, pension
  proportionnelle —, et non la durée du stage.
