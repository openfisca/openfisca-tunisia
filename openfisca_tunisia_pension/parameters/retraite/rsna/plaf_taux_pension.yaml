description: Plafonnement du taux de pension
values:
  1974-01-01:
    value: 0.8
  1982-07-22:
    value: 0.8
metadata:
  unit: /1
  reference:
    1974-01-01:
    - title: "Décret n° 74-499 du 27 avril 1974, relatif au régime de pension de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article 17"
      href: "https://www.pist.tn/jort/1974/1974F/Jo03074.pdf"
      note: "JORT n° 30 des 30 avril, 3 et 4 mai 1974, p. 917 : « sans que le montant total de la pension puisse excéder un maximum de 80 % dudit salaire ». L'article 64 fait prendre effet au décret à compter du 1er janvier 1974."
    1982-07-22:
    - title: "Décret n° 82-1030 du 15 juillet 1982, modifiant le décret n° 74-499 du 27 avril 1974 relatif au régime des pensions de vieillesse, d'invalidité et de survivants dans le secteur non agricole, article 4 (article 17, alinéa 2 nouveau)"
      href: "https://www.pist.tn/jort/1982/1982F/Jo05182.pdf"
      note: "JORT n° 51 des 20-23 juillet 1982, pp. 1605-1607. La majoration devient trimestrielle (0,5 % par trimestre) et le plafond de 80 % est reconduit : valeur inchangée. Le décret n'énonce pas de date d'effet (l'article 8 est une clause d'exécution). Date retenue : 22 juillet 1982, date à laquelle il devient obligatoire selon la règle générale alors en vigueur — « un jour franc après la publication au Journal Officiel » (article 3 nouveau du décret du 27 janvier 1883, rédaction du décret du 13 septembre 1956, JORT n° 74 du 14 septembre 1956, p. 1247), la publication étant prise au premier jour du fascicule daté des 20-23 juillet ; au dernier jour, ce serait le 25 juillet."
documentation: |-
  Plafond énoncé en toutes lettres par le texte. Le barème d'annuités
  (`retraite.rsna.bareme_annuite`) le rencontre par construction à 120 trimestres
  (40 % + 2 % par année au-delà de dix ans). Aucune formule ne lit ce paramètre à ce jour.
