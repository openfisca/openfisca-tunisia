# Indemnités familiales : la limitation aux trois premiers enfants,
# et ses deux exceptions.
#
# Depuis le 1er janvier 1989, la loi n° 88-39 du 6 mai 1988 limite
# l'indemnité familiale aux trois premiers enfants, en réservant les
# droits acquis antérieurement ; l'enfant handicapé ouvre droit quel
# que soit son rang (loi n° 81-46, art. 18).
#
# Taux : 7,600 / 6,500 / 5,600 / 4,700 du 1er mai 1986 au 31 octobre
# 1996 ; 7,320 / 6,507 / 5,693 / 4,880 depuis le 1er novembre 1996.

- name: Trois enfants en 2024, la limitation ne mord pas
  period: 2024-01
  absolute_error_margin: 0.00001
  input:
    nombre_enfants_charge: 3
  output:
    cnrps_indemnites_familiales: 19.520

- name: Quatre enfants en 2024, rien de déclaré
  period: 2024-01
  absolute_error_margin: 0.00001
  input:
    nombre_enfants_charge: 4
  output:
    cnrps_indemnites_familiales: 19.520

- name: Quatre enfants en 2024, dont un droit acquis avant 1989
  period: 2024-01
  absolute_error_margin: 0.00001
  input:
    nombre_enfants_charge: 4
    nombre_enfants_indemnite_familiale_droit_acquis: 1
  output:
    cnrps_indemnites_familiales: 24.400

- name: Quatre enfants en 2024, dont un handicapé au-delà du 3e rang
  period: 2024-01
  absolute_error_margin: 0.00001
  input:
    nombre_enfants_charge: 4
    nombre_enfants_handicapes_au_dela_du_troisieme_rang: 1
  output:
