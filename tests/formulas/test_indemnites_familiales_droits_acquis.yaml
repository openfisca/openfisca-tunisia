# Indemnités familiales : deux régimes, de part et d'autre du
# 1er janvier 1989, portés par deux formules datées.
#
# Jusqu'au 31 décembre 1988, chaque enfant au-delà du troisième ouvre
# droit : le décret n° 86-611 fixe quatre taux, et aucun texte lu ne
# limite alors le nombre d'enfants.
#
# Depuis le 1er janvier 1989, la loi n° 88-39 du 6 mai 1988 accorde
# l'indemnité « dans la limite des trois premiers enfants », en
# réservant les droits acquis antérieurement ; l'enfant handicapé ouvre
# droit quel que soit son rang (loi n° 81-46, art. 18).
#
# Taux : 7,600 / 6,500 / 5,600 / 4,700 du 1er mai 1986 au 31 octobre
# 1996 ; 7,320 / 6,507 / 5,693 / 4,880 depuis le 1er novembre 1996.

# --- La bascule, au mois près --------------------------------------

- name: Décembre 1988, dernier mois du premier régime
  period: 1988-12
  absolute_error_margin: 0.00001
  input:
    nombre_enfants_charge: 4
  output:
    cnrps_indemnites_familiales: 24.400

- name: Janvier 1989, premier mois du second régime
  period: 1989-01
  absolute_error_margin: 0.00001
  input:
    nombre_enfants_charge: 4
  output:
    cnrps_indemnites_familiales: 19.700

- name: Janvier 1989, le droit acquis échappe à la limitation
  period: 1989-01
  absolute_error_margin: 0.00001
  input:
    nombre_enfants_charge: 4
    nombre_enfants_indemnite_familiale_droit_acquis: 1
  output:
    cnrps_indemnites_familiales: 24.400

