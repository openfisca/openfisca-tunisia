- name: Cinq enfants en 2024, un droit acquis et un handicapé
  period: 2024-01
  absolute_error_margin: 0.00001
  input:
    nombre_enfants_charge: 5
    nombre_enfants_indemnite_familiale_droit_acquis: 1
    nombre_enfants_handicapes_au_dela_du_troisieme_rang: 1
  output:
    cnrps_indemnites_familiales: 29.280

# On ne peut ouvrir droit pour plus d'enfants qu'il n'y en a au-delà
