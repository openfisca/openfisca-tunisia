# --- La bonification s'ajoute à la durée d'assurance ---------------

- name: 35 ans de services, 140 trimestres plus 20 de bonification
  period: 2024
  absolute_error_margin: 0
  input:
    duree_service_cadre_actif: 35
    cnrps_duree_assurance_annuelle: 35 * 4
  output:
    cnrps_duree_assurance: 35 * 4 + 5 * 4

- name: 25 ans de cadre actif et 25 de militaire, 100 plus 36
  period: 2024
  absolute_error_margin: 0
  input:
    duree_service_cadre_actif: 25
    duree_service_militaire: 25
    cnrps_duree_assurance_annuelle: 25 * 4
  output:
    cnrps_duree_assurance: 25 * 4 + (4 + 5) * 4
