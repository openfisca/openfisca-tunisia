# --- Les valeurs ne bougent pas dans le temps ----------------------
# Premier exercice entier sous la loi n° 85-12, effet 12/09/1985.

- name: 35 ans en 1986, même bonification qu'en 2024
  period: 1986
  absolute_error_margin: 0
