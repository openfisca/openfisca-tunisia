# Indemnité familiale et indemnité pour salaire unique du secteur public : qui est servi.
#
# Source : circulaire du Premier ministre n° 42 du 25 octobre 1996 (JORT n° 89 du
# 5 novembre 1996, p. 2349-2352), annexe 2 « Les indemnités familiales au titre des enfants de
# l'agent public, ou de ses enfants adoptés, et l'indemnité pour salaire unique » (JORT n° 94
# du 22 novembre 1996, p. 2353-2362). Décret du 22 novembre 1918 (indemnité familiale) et décret
# du 24 février 1944 (indemnité pour salaire unique).
#
# Un test par cas, nommé par son code de l'annexe (« I-A / cas 1 »). Le résultat attendu est lu
# dans les tableaux du précis (« Circulaire n° 42, annexe 2, I à VII »), non dans le code. Les
# cas 34, 42 et 43, que l'annexe ne tranche pas, sont dans
# `tests/test_indemnites_familiales_public.py`, marqués `skip`.
#
# `non_precise` : l'annexe ne nomme pas l'organisme payeur. Garde partagée (cas 68 à 78) : un
# enfant par parent, le résultat se lit enfant par enfant.

- name: "I-A / cas 1 : enfants communs (circulaire n° 42, annexe 2, JORT n° 94, p. 2353-2355)"
  period: 2000-01
  input:
    individus:
      enfant:
        pf_public_situation_parents: parents_en_vie_non_divorces
        pf_public_statut_pere: agent_public
        pf_public_statut_mere: agent_public
        pf_public_filiation: communs
    menage:
      enfants: [enfant]
  output:
    pf_public_cas_annexe_2: 1
    indemnite_familiale_public_beneficiaire: pere
    indemnite_familiale_public_payeur: non_precise
    indemnite_salaire_unique_public_beneficiaire: non_servie
    indemnite_salaire_unique_public_payeur: non_precise

