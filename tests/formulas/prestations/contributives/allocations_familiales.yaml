        regime_securite_sociale_cotisant:
          1961: rsna
      enfant1:
        date_naissance: 1953-07-15
    menage:
      personne_de_reference: pere
      enfants: [enfant1]
  output:
    menage:
      af_mensuelle: 0.15 * 52.5 / 3

- name: Un salarié qui ne relève pas du régime de la loi n° 60-30 n'ouvre pas droit
