# Allocations familiales du régime des salariés non agricoles : loi n° 60-30 du
# 14 décembre 1960, articles 52 à 65, en vigueur le 1er avril 1961 (article 130).
#
# Le montant trimestriel est un pourcentage, par enfant, de la rémunération globale
# trimestrielle plafonnée (article 61). Il est réparti par tiers entre les mois du
# trimestre, chaque tiers au droit en vigueur le premier du mois ; la variable annuelle `af`
# additionne les douze tiers.
#
# | Depuis         | Texte             | Taux par rang           | Plafond trimestriel | Rangs |
# |----------------|-------------------|-------------------------|--------------------:|------:|
# | 1er avril 1961 | loi n° 60-30      | 15 % pour chaque enfant |            52,500 D |     4 |
# | 1er janv. 1976 | loi n° 75-82      | 18 / 16 / 14 / 12 %     |            72,000 D |     4 |
# | 1er mai 1986   | loi n° 86-75      | 18 / 16 / 14 / 12 %     |           122,000 D |     4 |
# | 1er janv. 1989 | loi n° 88-38      | 18 / 16 / 14 %          |           122,000 D |     3 |
#
# Limites d'âge (article 54) : moins de 14 ans sans condition, 16 ans en primaire, 18 ans en
# apprentissage, 20 ans en études secondaires ou supérieures, au-delà de 20 ans pour l'enfant
# infirme ; depuis la loi n° 96-65 (exécutoire le 4 août 1996, donc à partir de septembre
# 1996 pour un calcul mensuel), 16, 18 et 21 ans.
#
# Les dates de naissance évitent le premier du mois : l'âge se lit au premier jour du mois.
# Les salaires sont annuels et répartis par douzièmes.

# --- 1961 : entrée en vigueur au 1er avril --------------------------------------------------

- name: 1960, avant l'entrée en vigueur de l'article 61, aucune allocation
  period: 1960
  absolute_error_margin: 0.001
  input:
    individus:
      pere:
        date_naissance: 1930-06-15
        salaire_de_base: 360
        regime_securite_sociale_cotisant: rsna
      enfant1:
        date_naissance: 1953-07-15
      enfant2:
        date_naissance: 1955-07-15
    menage:
      personne_de_reference: pere
      enfants: [enfant1, enfant2]
  output:
    menage:
      af: 0

- name: 1961, trois trimestres à 15 % par enfant d'une rémunération plafonnée à 52,500 D
  # 30 D par mois, soit 90 D par trimestre, plafonnés à 52,500 D.
  # Deux enfants : 2 × 15 % × 52,500 = 15,750 D par trimestre, d'avril à décembre.
  period: 1961
  absolute_error_margin: 0.001
  input:
    individus:
      pere:
        date_naissance: 1930-06-15
        salaire_de_base: 360
        regime_securite_sociale_cotisant: rsna
      enfant1:
        date_naissance: 1953-07-15
      enfant2:
        date_naissance: 1955-07-15
    menage:
      personne_de_reference: pere
      enfants: [enfant1, enfant2]
  output:
    menage:
      af: 3 * 2 * 0.15 * 52.5

- name: Mars 1961, dernier mois avant le 1er avril
  period: 1961-03
  absolute_error_margin: 0.001
  input:
    individus:
      pere:
        date_naissance: 1930-06-15
        # La base est la rémunération du trimestre civil entier : salaire saisi sur l'année.
        salaire_de_base:
          1961: 360
        regime_securite_sociale_cotisant:
          1961: rsna
      enfant1:
        date_naissance: 1953-07-15
    menage:
      personne_de_reference: pere
      enfants: [enfant1]
  output:
    menage:
      af_mensuelle: 0

- name: Avril 1961, premier mois, 15 % d'un tiers du plafond de 52,500 D
  period: 1961-04
  absolute_error_margin: 0.001
