[project]
name = "OpenFisca-Tunisia-Pension"
version = "5.4.1"
description = "OpenFisca Rules as Code model for Tunisia pensions."
readme = "README.md"
keywords = ["microsimulation", "tax", "benefit", "pension", "rac", "rules-as-code", "tunisia"]
authors = [
  {name = "OpenFisca Team", email = "contact@openfisca.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">= 3.10"
dependencies = [
    "numba>=0.54,<1.0.0",
    'numpy >=1.24.3, <3',
    'openfisca-core[web-api] >=44.0.3, <45.0.0',
    'openfisca-tunisia >=0.80',
    'scipy >= 0.12',
]

[project.urls]
Homepage = "https://github.com/openfisca/openfisca-tunisia-pension"
Repository = "https://github.com/openfisca/openfisca-tunisia-pension"
Documentation = "https://openfisca.org/doc"
Issues = "https://github.com/openfisca/openfisca-tunisia-pension/issues"
Changelog = "https://github.com/openfisca/openfisca-tunisia-pension/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest",  # Let OpenFisca-Core decide pytest version
    "ruff >=0.6.9, <1",
    "scipy >=1.10.1, <2.0",
    "tomli >=2.0.0; python_version < '3.11'",
    "requests >=2.28.2, <3.0",
    "twine >=6.0.0",
    "yamllint >=1.30.0, <2.0"
]
notebook = [
    'ipykernel >= 4.8',
    'jupyter-client >= 5.2',
    'matplotlib >= 2.2',
    'nbconvert >= 5.3',
    'nbformat >= 4.4',
    'pandas >= 0.22.0',
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["build", "dist", ".git", "**/notebooks"]

[tool.ruff.lint]
# Règles ignorées globalement (contexte formules OpenFisca / régimes) :
# F403, F405 : import * (usage courant dans les formules)
# F811 : même symbole importé deux fois (ex. select depuis numpy et model_api)
# F821 : noms "indéfinis" en apparence (variables de formule évaluées à l'exécution)
ignore = ["F403", "F405", "F811", "F821"]

# Fichiers sous variables/ : générés à la volée par script_ast à partir des régimes.
# On applique le lint (longueur, style, isort, etc.) mais on ignore les règles inadaptées au code généré :
# E402 : import non en tête de fichier (docstring / libellé de régime avant les imports, structure imposée par le générateur)
# F401 : import signalé inutilisé (certains imports sont requis par le générateur ou pour l'héritage de classes)
[tool.ruff.lint.per-file-ignores]
"openfisca_tunisia_pension/variables/*.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["openfisca_tunisia_pension"]
combine-as-imports = true
force-single-line = false

[tool.pytest.ini_options]
addopts      = "--showlocals --exitfirst --doctest-modules --disable-pytest-warnings --assert=plain"
testpaths    = "tests"
python_files = "**/*.py"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    'ignore:function ham\(\) is deprecated:DeprecationWarning',
    "ignore:invalid value encountered in divide:RuntimeWarning",
    "ignore:invalid value encountered in multiply:RuntimeWarning",
    "ignore:divide by zero encountered in divide:RuntimeWarning",
]

[tool.setuptools]
packages = ["openfisca_tunisia_pension"]
