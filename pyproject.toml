[project]
name = "OpenFisca-Tunisia"
version = "0.97"
description = "OpenFisca Rules as Code model for Tunisia."
readme = "README.md"
keywords = ["microsimulation", "tax", "benefit", "rac", "rules-as-code", "tunisia"]
authors = [
  {name = "OpenFisca Team", email = "contact@openfisca.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">= 3.10"
dependencies = [
    # "numpy >=1.24.3, <2", #TODO: Pour le CRES ?
    "openfisca-core[web-api] >=44, <45",
]

[project.urls]
Homepage = "https://github.com/openfisca/openfisca-tunisia"
Repository = "https://github.com/openfisca/openfisca-tunisia"
Documentation = "https://openfisca.org/doc"
Issues = "https://github.com/openfisca/openfisca-tunisia/issues"
Changelog = "https://github.com/openfisca/openfisca-tunisia/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "ruff >=0.6.9, <0.9",
    "pytest",  # Let OpenFisca-Core decide pytest version
    "scipy >=1.10.1, <2.0",
    "requests >=2.28.2, <3.0",
    "twine >=6.0.0",
    "yamllint >=1.30.0, <2.0"
]
# Le système des pensions compile ses calculs avec numba. numba 0.64 à 0.66 plafonnent
# numpy sous 2.5 : exiger 0.67 permet aux deux systèmes de partager le même numpy.
# scipy, que l'ancien dépôt déclarait, n'est importé nulle part : la suite de la pension
# passe avec scipy bloqué.
pension = [
    "numba >=0.67, <1.0",
]
notebook = [
    'ipykernel >= 4.8',
    'jupyter-client >= 5.2',
    'matplotlib >= 2.2',
    'nbformat >= 4.4',
    'pandas >= 0.22.0',
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["build", "dist", ".git", "**/notebooks"]

[tool.ruff.lint]
ignore = ["F403", "F405"]  # star imports

[tool.ruff.lint.per-file-ignores]
# Le code de la pension est en partie GÉNÉRÉ par script_ast à partir des régimes, et ses
# formules emploient des noms résolus à l'exécution. Ces exemptions sont celles que la
# pension appliquait dans son propre dépôt ; elles sont bornées à ses deux dossiers.
"openfisca_tunisia_pension/regimes/*.py" = ["F811", "F821"]
"openfisca_tunisia_pension/variables/*.py" = ["E402", "F401", "F811", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["openfisca_tunisia", "openfisca_tunisia_pension"]
combine-as-imports = true
force-single-line = false

[tool.pytest.ini_options]
addopts      = "--showlocals --exitfirst --doctest-modules --disable-pytest-warnings"
testpaths    = "tests"
python_files = "**/*.py"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    'ignore:function ham\(\) is deprecated:DeprecationWarning',
    "ignore:invalid value encountered in divide:RuntimeWarning",
    "ignore:invalid value encountered in multiply:RuntimeWarning",
    "ignore:divide by zero encountered in divide:RuntimeWarning",
    "ignore:The iteration is not making good progress:RuntimeWarning",
]

[tool.setuptools.packages.find]
include = ["openfisca_tunisia*"]

[tool.uv.workspace]
members = ["openfisca-tunisia"]
