- name: RSNA 1994, droit ouvert le 15 septembre 1994, cinq années, barème de 1994
  period: 1994
  absolute_error_margin: 0.01
  input:
    rsna_liquidation_date: 1994-09-15
    rsna_salaire_de_base:
      1988: 10000
      1989: 10000
      1990: 10000
      1991: 10000
      1992: 10000
      1993: 10000
      1994: 99999
  output:
    # Arrêté du 17 novembre 1994 : 1989 1,26342 ; 1990 1,18541 ; 1991 1,10005 ;
    # 1992 1,04197 ; 1993 1. L'année 1988 est la sixième : elle ne compte pas.
    rsna_salaire_de_reference: 10000 * (1.26342 + 1.18541 + 1.10005 + 1.04197 + 1) / 5

