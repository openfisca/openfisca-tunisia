- name: RSNA 2011, dix dernières années, barème de 2011
  period: 2011
  absolute_error_margin: 0.01
  input:
    rsna_salaire_de_base:
      2000: 10000
      2001: 10000
      2002: 10000
      2003: 10000
      2004: 10000
      2005: 20000
      2006: 20000
      2007: 20000
      2008: 20000
      2009: 20000
      2010: 20000
      2011: 20000
  output:
    # Arrêté du 23 février 2011 : 2001 1,36436 ; 2002 1,32686 ; 2003 1,29167 ;
    # 2004 1,24653 ; 2005 1,22165 ; 2006 1,17305 ; 2007 1,13406 ; 2008 1,08095 ;
    # 2009 1,04409 ; 2010 1. L'année 2011, celle de l'ouverture, ne compte pas.
    rsna_salaire_de_reference: >-
      (10000 * (1.36436 + 1.32686 + 1.29167 + 1.24653)
      + 20000 * (1.22165 + 1.17305 + 1.13406 + 1.08095 + 1.04409 + 1)) / 10

