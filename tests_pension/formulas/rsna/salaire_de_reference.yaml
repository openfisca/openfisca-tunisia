# Salaire moyen de référence du régime des salariés non agricoles, rendu en montant
# annuel.
#
# Rédaction de 1974 (décret n° 74-499, articles 18 et 19) : les salaires des trois ou des
# cinq années qui précèdent le 1er janvier de l'année d'ouverture du droit, divisés par 36
# ou 60 mois, la période la plus avantageuse étant retenue. L'année d'ouverture du droit
# n'est pas comptée : ses salaires sont renseignés à dessein, et ne doivent pas jouer.
#
# Rédaction de 1994 (décret n° 94-1429, articles 18 et 19 nouveaux) : les cinq, sept puis
# dix dernières années de salaire, aux 1er juillet 1994, 1995 et 1996, qui précèdent le
# 1er janvier de l'année d'ouverture du droit ; si l'assuré en compte moins, la moyenne
# se fait sur celles-ci. Chaque salaire est multiplié par le coefficient de son année au
# barème d'actualisation applicable à la date d'ouverture du droit, recopié en clair
# depuis `retraite/rsna/salaire_reference/actualisation`. La date d'ouverture est la
# date de liquidation quand elle tombe dans l'exercice, le 1er janvier sinon. Les
# salaires de l'année d'ouverture sont renseignés à dessein, et ne doivent pas jouer.

- name: RSNA 1985, les trois dernières années sont plus avantageuses
  period: 1985
  absolute_error_margin: 0.01
  input:
    rsna_salaire_de_base:
      1978: 5000
      1979: 5000
      1980: 10000
      1981: 10000
      1982: 10000
      1983: 20000
      1984: 20000
      1985: 99999
  output:
    # 3 ans : (10 000 + 20 000 + 20 000) × 12 / 36 ; 5 ans : 70 000 × 12 / 60 = 14 000.
    rsna_salaire_de_reference: (10000 + 20000 + 20000) * 12 / 36

- name: RSNA 1985, les cinq dernières années sont plus avantageuses
  period: 1985
  absolute_error_margin: 0.01
  input:
    rsna_salaire_de_base:
      1980: 20000
      1981: 20000
      1982: 10000
      1983: 10000
      1984: 10000
      1985: 99999
  output:
    # 3 ans : 30 000 × 12 / 36 = 10 000 ; 5 ans : 70 000 × 12 / 60.
    rsna_salaire_de_reference: (20000 + 20000 + 10000 + 10000 + 10000) * 12 / 60

- name: RSNA 1985, une seule année de salaire, divisée par 36 mois
  period: 1985
  absolute_error_margin: 0.01
  input:
    rsna_salaire_de_base:
      1984: 12000
  output:
    rsna_salaire_de_reference: 12000 * 12 / 36

