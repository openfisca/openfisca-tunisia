- name: RSNA 2024, dix années, barème de 2024
  period: 2024
  absolute_error_margin: 0.01
  input:
    rsna_salaire_de_base:
      2013: 99999
      2014: 20000
      2015: 21000
      2016: 22000
      2017: 23000
      2018: 24000
      2019: 25000
      2020: 26000
      2021: 27000
      2022: 28000
      2023: 29000
      2024: 99999
  output:
    # Arrêté du 16 juillet 2024 : 2014 1,73582 ; 2015 1,65758 ; 2016 1,59801 ;
    # 2017 1,51728 ; 2018 1,41202 ; 2019 1,32216 ; 2020 1,25163 ; 2021 1,18406 ;
    # 2022 1,09323 ; 2023 1.
    rsna_salaire_de_reference: >-
      (20000 * 1.73582 + 21000 * 1.65758 + 22000 * 1.59801 + 23000 * 1.51728
      + 24000 * 1.41202 + 25000 * 1.32216 + 26000 * 1.25163 + 27000 * 1.18406
      + 28000 * 1.09323 + 29000 * 1) / 10

