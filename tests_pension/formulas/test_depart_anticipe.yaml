- name: Retraite normale - Non éligible (trop jeune)
  period: 2024
  input:
    age: 59
    cnrps_duree_assurance: 100
    cnrps_salaire_de_base:
      2024: 1000
  output:
    cnrps_eligible: false

- name: Retraite anticipée sur demande (Cadre commun > 57 ans)
  period: 2024
  input:
    age: 58
    cnrps_duree_assurance: 150 # = 37.5 ans > 37
    depart_anticipe_sur_demande: true
    cnrps_salaire_de_base:
      2024: 1000
    cnrps_salaire_de_reference_calcule_sur_demande: false
  output:
    cnrps_eligible: true

- name: Retraite anticipée mères de 3 enfants
  period: 2024
  input:
    age: 52
    cnrps_duree_assurance: 65 # = 16.25 ans > 15 ans
    mere_3_enfants: true
    cnrps_salaire_de_base:
      2024: 1000
  output:
    cnrps_eligible: true

- name: Rente invalidité (pas d'âge ni durée requis)
  period: 2024
  input:
    age: 30
    cnrps_duree_assurance: 10
    invalidite_physique: true
    cnrps_salaire_de_base:
      2024: 1000
  output:
    cnrps_eligible: true
